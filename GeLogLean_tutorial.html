s:7px;margin:15px 0;overflow:hidden;background:var(--paper)}.chain-title{padding:9px 12px;background:#f2f4f5;font-size:11px;font-weight:650;color:#65717c}.chain-row{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:10px 12px;border-top:1px solid var(--line)}.chain-row .n{font:11px ui-monospace,monospace;color:var(--faint)}.chain-row .claim{font-weight:600}.chain-row .reason{font-size:12px;color:var(--muted);margin-top:3px}.chain-row.goal{background:#f3f8f5}.chain-row.goal .claim{color:#38664c}.exercise{margin:27px 0 20px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:17px}.exercise h3{margin:0 0 10px;font-size:15px}.question{font-size:14px;font-weight:600;margin:0 0 12px}.options{display:grid;gap:7px}.option{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left;color:var(--ink);font-size:13px}.option:hover{background:#f5f7f8}.option.correct{border-color:#8fb49d;background:#f2f8f4}.option.wrong{border-color:#d5a0a0;background:#fbf4f4}.feedback{font-size:12px;margin-top:11px;color:var(--muted)}.solution{margin-top:12px}.solution[hidden]{display:none}.lesson-footer{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin-top:34px;padding-top:18px}.lesson-footer .spacer{flex:1}.nav-pair{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.nav-pair button{max-width:48%;text-align:left}.empty{padding:20px;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.search-result{font-size:12px;color:var(--muted);margin:0 0 8px}.glossary{columns:2;column-gap:30px}.gl-item{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--line)}.gl-item b{font-size:13px}.gl-item p{font-size:12px;color:var(--muted);margin:3px 0 0}.footer-note{font-size:11px;color:var(--faint);margin-top:32px;border-top:1px solid var(--line);padding-top:14px}

<script>

'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modules=[
{id:'m1',title:'Основания математики и язык теорий',desc:'Доказательство, аксиомы, формальный синтаксис, семантика, множества и отношения.'},
{id:'m2',title:'Логика высказываний и натуральный вывод',desc:'Связки, таблицы истинности, правила введения и устранения, временные предположения.'},
{id:'m3',title:'Логика предикатов и формальные выражения',desc:'Сигнатуры, термы, кванторы, области действия, подстановка и равенство.'},
{id:'m4',title:'Евклидова геометрия и строгие доказательства',desc:'Аксиомы, определения, соответствие треугольников, параллельные прямые и разборы геометрических теорем.'},
{id:'m5',title:'Стратегии и практикумы доказательства',desc:'Анализ цели, доказательство по случаям, контрпримеры, необходимость и достаточность, существование и единственность.'},
{id:'m6',title:'GeoProof: интерфейс, инструменты и рабочие сценарии',desc:'Пошаговая работа с инструментами чертежа, зависимостями, доказательным редактором, каталогом и файлами проекта.'},
{id:'m7',title:'Lean 4: практический старт и доказательства',desc:'Установка, Lake, типы, определения, цели, базовые тактики, случаи, кванторы и структуры.'},
{id:'m8',title:'Формализация и проверка доказательств',desc:'Формализация геометрии, переход GeoProof → Lean, доверие и воспроизводимость.'}
];
const lessons=[];
function add(module,title,lead,body,question,choices,answer,feedback,reveal,solution){lessons.push({id:'l'+(lessons.length+1),module,title,lead,body,exercise:{q:question,choices,answer,feedback,reveal},solution});}
add('m1','Доказательство как конечная цепочка оснований','Математическое доказательство объясняет, почему заключение следует из явно заданных предпосылок, а не почему оно кажется правдоподобным.',`
<h2>1. Утверждение и обоснование</h2>
<p>Математическое утверждение — предложение, которому в рамках выбранной интерпретации можно приписать истинностное значение. Доказательство — конечная, контролируемая структура, показывающая, как целевое утверждение получается из принятых оснований. Убедительность изложения важна для читателя, но не заменяет логической связи между посылками и выводом.</p>
<div class="definition"><div class="box-label">Определение · доказательство</div>Доказательство формулы φ из множества предпосылок Γ — конечная последовательность или дерево формул, в котором каждый узел является предпосылкой, допустимой аксиомой либо непосредственно получен из предыдущих узлов по правилу выбранного исчисления.</div>
<p>Фраза «по рисунку очевидно» не указывает правило вывода. Фраза «по теореме о вертикальных углах» указывает математическое основание, но всё ещё предполагает, что условия теоремы установлены. Хорошее доказательство делает эти условия обозримыми.</p>
<h2>2. Структура шага</h2>
<p>У каждого содержательного шага есть четыре компонента: формулировка, доступные предпосылки, основание перехода и вывод. Если хотя бы один компонент отсутствует, читатель вынужден самостоятельно восстанавливать скрытый аргумент.</p>
<div class="chain"><div class="chain-title">Минимальная доказательная цепочка</div><div class="chain-row"><div class="n">1</div><div><div class="claim">AB = AC</div><div class="reason">Посылка задачи</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">∠ABC = ∠BCA</div><div class="reason">Теорема о равных углах при основании равнобедренного треугольника — после установления условий</div></div></div></div>
<h2>3. Три независимых вопроса</h2>
<ul><li><b>Истинно ли утверждение?</b> Это вопрос математики и выбранной модели.</li><li><b>Следует ли оно из посылок?</b> Это вопрос логической корректности вывода.</li><li><b>Проверила ли это программа?</b> Это вопрос реализации, охвата валидатора и доверенной базы.</li></ul>
<div class="warning"><div class="box-label">Типичная ошибка</div>Количество шагов не является мерой строгости. Десять шагов со скрытым недоказанным предположением хуже трёх шагов, каждый из которых корректно обоснован.</div>`, 'Какой компонент обязателен для содержательного шага доказательства?',['Только убедительная формулировка','Основание, связывающее доступные посылки с выводом','Рисунок с совпадающими углами'],1,'Нужна явная допустимая связь между посылками и заключением. Рисунок помогает увидеть структуру, но не создаёт логическое основание.','Почему «очевидно» не является достаточным математическим основанием?','Потому что эта фраза не определяет, какие предпосылки использованы и по какому правилу получен вывод. Доказательство должно быть воспроизводимым другим читателем.');
add('m1','Аксиомы, определения, теоремы и следствия','Эти четыре понятия выполняют разные роли: задают исходную теорию, вводят язык или сообщают доказанный результат.',`
<h2>1. Аксиома</h2><div class="definition"><div class="box-label">Определение · аксиома</div>Аксиома — формула, принимаемая как исходное основание конкретной теории. Внутри этой теории она не выводится из более ранних теорем, хотя может быть обоснована в метатеории или следовать из другой системы аксиом.</div>
<p>Аксиома не обязана быть «очевидной истиной вне всякой системы». Геометрии с разными аксиомами параллельных дают разные математические структуры. Поэтому фраза «по аксиоме» должна подразумевать известную аксиоматическую систему.</p>
<h2>2. Определение</h2><div class="definition"><div class="box-label">Определение · математическое определение</div>Определение вводит новое обозначение или понятие через уже известный язык. Оно фиксирует смысл термина и само по себе не устанавливает независимый математический факт.</div>
<p>Например, M называется серединой AB, если M принадлежит отрезку AB и AM = MB. Из определения можно раскрыть, что означает слово «середина», но для существования такой точки в выбранной геометрической системе могут понадобиться отдельные основания.</p>
<h2>3. Теорема и следствие</h2><p>Теорема — утверждение, для которого предъявлено доказательство из аксиом, определений и ранее доказанных результатов. Лемма — теорема, вводимая ради последующего доказательства. Следствие — результат, который получается сравнительно коротко из уже установленной теоремы. Различие между ними в основном методическое, а не логическое.</p>
<div class="insight"><div class="box-label">Практическая дисциплина</div>Когда выбираешь основание для шага GeoProof, не смешивай каталоговое правило, исходную аксиому и доказанную теорему. Сам факт наличия записи в каталоге не превращает её в доказанную теорему.</div>
<h2>4. Зависимость результата</h2><p>Теорема всегда зависит от набора предпосылок. Если в доказательстве использована аксиома параллельных, результат нельзя без дополнительного анализа переносить в геометрию, где эта аксиома заменена другой.</p>`, 'Что делает определение?',['Принимает новый факт как аксиому','Фиксирует смысл нового термина через уже известный язык','Автоматически доказывает все свойства объекта'],1,'Определение задаёт значение понятия. Его существование и свойства могут требовать отдельных доказательств.','Почему теорема должна иметь указанный аксиоматический контекст?','Потому что выводимость зависит от исходных предпосылок. Одна и та же формула может следовать из одной аксиоматики и не следовать из другой.');
add('m1','Формальные языки, грамматика и AST','Синтаксис задаёт допустимые выражения; абстрактное синтаксическое дерево представляет их внутреннюю структуру.',`
<h2>1. Алфавит и грамматика</h2><p>Формальный язык задаётся алфавитом и рекурсивными правилами построения. Для логики первого порядка нелогическая часть сигнатуры содержит константы, функции и предикаты. Логическая часть включает связки, кванторы, переменные и технические символы.</p>
<div class="formula">Терм ::= переменная | константа | f(терм₁,…,термₙ)<small>Схематическое правило построения термов</small></div>
<div class="formula">Формула ::= атом | ¬A | A ∧ B | A ∨ B | A → B | ∀x A | ∃x A<small>Схематическое правило построения формул</small></div>
<p>Терм обозначает объект области интерпретации. Формула выражает свойство или отношение и получает истинностное значение в интерпретации. Поэтому запись midpoint(A,B) может быть термом, а IsMidpoint(M,A,B) — атомарной формулой.</p>
<h2>2. Почему строка недостаточна</h2><p>Выражения P ∧ (Q ∨ R) и (P ∧ Q) ∨ R содержат одинаковые атомы и связки, но различаются группировкой. Если хранить только строку, каждое действие потребует повторного разбора скобок, приоритетов и областей действия.</p>
<div class="definition"><div class="box-label">Определение · AST</div>Абстрактное синтаксическое дерево — древовидное представление выражения, где узел обозначает оператор или атом, а дочерние узлы — его аргументы и подформулы.</div>
<h2>3. Структура формулы</h2><div class="table-wrap"><table><thead><tr><th>Узел</th><th>Данные</th><th>Пример</th></tr></thead><tbody><tr><td>atom</td><td>предикат и термы</td><td>OnLine(A,l)</td></tr><tr><td>and / or</td><td>две подформулы</td><td>P ∧ Q</td></tr><tr><td>implies</td><td>условие и следствие</td><td>P → Q</td></tr><tr><td>not</td><td>одна подформула</td><td>¬P</td></tr><tr><td>forall / exists</td><td>имя переменной и тело</td><td>∀x P(x)</td></tr></tbody></table></div>
<div class="insight"><div class="box-label">Связь с GeoProof</div>В текущем app.js формулы действительно имеют структурированные поля op, args, predicate, terms и variable. Сравнение AST позволяет проверять форму логического правила независимо от пробелов и оформления текста.</div>
<h2>4. Синтаксическая корректность не есть истинность</h2><p>Формула P ∧ Q может быть синтаксически правильной, даже если P и Q ложны. Ошибочная последовательность символов может не быть формулой вообще. Это два разных уровня анализа, и учебник будет последовательно разделять их.</p>`, 'Что хранит AST?',['Только цвет и координаты узла','Структуру операторов и подформул','Истинностное значение каждой геометрической теоремы'],1,'AST представляет синтаксис выражения, а не автоматически его семантику.','Почему P ∧ (Q ∨ R) нельзя сравнивать с (P ∧ Q) ∨ R как одинаковую структуру?','У формул разные корневые операторы: в первом случае AND, во втором OR. Их смысл различается, несмотря на одинаковые атомы.');
add('m1','Семантика, интерпретации и модели','Семантика задаёт смысл символов и точное понятие истинности формулы относительно структуры.',`
<h2>1. Интерпретация языка</h2><p>Интерпретация логики первого порядка включает непустую область D. Каждой константе сопоставляется элемент D, каждому n-местному функциональному символу — функция Dⁿ → D, каждому n-местному предикату — отношение на Dⁿ. Одни и те же символы могут получать разные значения в разных интерпретациях.</p>
<div class="definition"><div class="box-label">Определение · модель</div>Структура M является моделью множества формул Γ, если все формулы из Γ истинны в M. Говорят M ⊨ Γ.</div>
<h2>2. Четыре важных понятия</h2><ul><li><b>Удовлетворимость:</b> формула истинна хотя бы в одной интерпретации.</li><li><b>Общезначимость:</b> формула истинна во всех допустимых интерпретациях.</li><li><b>Противоречивость:</b> нет интерпретации, удовлетворяющей всем формулам множества.</li><li><b>Логическое следование:</b> во всякой модели посылок истинно заключение.</li></ul>
<div class="formula">Γ ⊨ φ  ⇔  для каждой M: M ⊨ Γ ⇒ M ⊨ φ<small>Семантическое следование</small></div>
<div class="formula">Γ ⊢ φ  ⇔  существует формальный вывод φ из Γ<small>Синтаксическая выводимость в фиксированном исчислении</small></div>
<h2>3. Корректность и полнота</h2><p>Корректность исчисления означает: если формула выводима синтаксически, то она следует семантически. Полнота означает, что всякое семантическое следствие выводимо в исчислении. Это метатеоремы о выбранной системе правил, а не характеристики одного шага.</p>
<div class="warning"><div class="box-label">Не путать</div>Одна диаграмма GeoProof — одна конкретная конфигурация. Даже точное численное совпадение длин в ней не доказывает, что равенство верно для всех конфигураций, удовлетворяющих условию теоремы.</div>`, 'Что означает M ⊨ Γ?',['Все формулы Γ истинны в структуре M','Формулы Γ синтаксически красивы','Существует доказательство всех формул в Lean'],0,'Это определение модели множества формул.','Чем Γ ⊨ φ отличается от Γ ⊢ φ?','Первое является семантическим утверждением о всех моделях предпосылок. Второе — синтаксическим утверждением о существовании вывода в заданном исчислении.');
add('m1','Множества, отношения и функции','Математические структуры GeoProof удобно понимать через множества объектов, отношения между ними и отображения зависимых объектов.',`
<h2>1. Множества и включение</h2><p>Множество A является подмножеством B, если каждый элемент A принадлежит B. Равенство множеств определяется совпадением элементов: A = B тогда и только тогда, когда A ⊆ B и B ⊆ A. Для доказательства равенства множеств обычно доказывают два включения.</p>
<h2>2. Отношения</h2><div class="definition"><div class="box-label">Определение · бинарное отношение</div>Отношение R между A и B — подмножество декартова произведения A × B. Запись R(a,b) означает, что пара (a,b) принадлежит этому отношению.</div>
<div class="table-wrap"><table><thead><tr><th>Свойство</th><th>Формула</th><th>Смысл</th></tr></thead><tbody><tr><td>Рефлексивность</td><td>R(a,a)</td><td>Элемент связан с собой</td></tr><tr><td>Симметричность</td><td>R(a,b) ⇒ R(b,a)</td><td>Связь обратима</td></tr><tr><td>Транзитивность</td><td>R(a,b) ∧ R(b,c) ⇒ R(a,c)</td><td>Связь проходит через промежуточный элемент</td></tr><tr><td>Антисимметричность</td><td>R(a,b) ∧ R(b,a) ⇒ a=b</td><td>Взаимная связь даёт равенство</td></tr></tbody></table></div>
<h2>3. Функции</h2><div class="definition"><div class="box-label">Определение · функция</div>Функция f : A → B сопоставляет каждому a ∈ A ровно один элемент f(a) ∈ B. Условия существования и единственности значения составляют содержание понятия.</div>
<p>В геометрической модели отношение OnCircle(P,c) отвечает на вопрос, лежит ли точка на окружности. Функция midpoint(A,B) возвращает точку. Первое — свойство пары объектов, второе — построение объекта из аргументов.</p>
<h2>4. Графы и композиция</h2><p>Функции можно компоновать: если f : A → B и g : B → C, то g ∘ f : A → C. Цепочки таких отображений описывают вычисление зависимых геометрических объектов. Если зависимость образует цикл, композиция перестаёт задавать простой порядок пересчёта.</p>
<div class="insight"><div class="box-label">Связь</div>Множества задают классы объектов, отношения — геометрические свойства, функции — построения. Эта тройка понятий связывает основы математики, теорию множеств, программирование и модель GeoProof.</div>`, 'Чем функция отличается от отношения?',['Функция возвращает ровно один объект для каждого элемента области определения; отношение может связывать элемент с несколькими объектами или ни с одним','Никак не отличается','Отношение всегда вычисляется быстрее'],0,'Функция имеет требование единственности результата, которое не предполагается у произвольного отношения.','Почему равенство множеств доказывают двумя включениями?','A ⊆ B исключает элементы A вне B, а B ⊆ A исключает элементы B вне A. Вместе они устанавливают совпадение всех элементов.');
add('m2','Логика высказываний: связки и их смысл','Логика высказываний исследует сложные утверждения, составленные из целых высказываний с помощью логических связок.',`
<h2>1. Атомарные высказывания</h2><p>Атомарное высказывание P рассматривается как целое: логика высказываний не анализирует его внутреннюю геометрическую или числовую структуру. Например, P может означать «AB = CD», а Q — «прямые l и m параллельны». Каждому атому приписывается значение истина или ложь.</p>
<h2>2. Основные связки</h2><div class="table-wrap"><table><thead><tr><th>Обозначение</th><th>Название</th><th>Условие истинности</th></tr></thead><tbody><tr><td>¬P</td><td>Отрицание</td><td>Истинно, когда P ложно</td></tr><tr><td>P ∧ Q</td><td>Конъюнкция</td><td>Оба высказывания истинны</td></tr><tr><td>P ∨ Q</td><td>Дизъюнкция</td><td>Истинно хотя бы одно</td></tr><tr><td>P → Q</td><td>Импликация</td><td>Ложно только при P=true, Q=false</td></tr><tr><td>P ↔ Q</td><td>Эквивалентность</td><td>Оба значения совпадают</td></tr></tbody></table></div>
<p>Дизъюнкция в классической логике включающая: P ∨ Q истинно и тогда, когда истинны обе части. Это не исключающее «либо одно, либо другое».</p>
<h2>3. Приоритет связок и скобки</h2><p>В разных учебниках могут использовать разные соглашения о приоритете. Для формальной записи лучше не полагаться на память: ставь скобки, если возможна неоднозначность. В частности, P → Q → R обычно читают как P → (Q → R), но при обсуждении логики важно фиксировать соглашение.</p>
<div class="formula">¬(P ∧ Q)  ≡  (¬P ∨ ¬Q)<small>Первый закон де Моргана</small></div><div class="formula">¬(P ∨ Q)  ≡  (¬P ∧ ¬Q)<small>Второй закон де Моргана</small></div>
<h2>4. Импликация не является причинностью</h2><p>Импликация P → Q задаёт логическое условие истинности. Из неё не следует, что P вызывает Q, происходит раньше Q или является единственной причиной Q. В доказательстве импликация выражает отношение следования между формулами.</p>`, 'Когда P ∨ Q истинно?', ['Только когда истинна ровно одна часть','Когда истинна хотя бы одна часть','Только когда обе части ложны'],1,'Классическая дизъюнкция включающая: допустим и случай, когда истинны обе части.','Почему нельзя читать P → Q как «P является причиной Q»?','Потому что импликация задаёт только логическое условие истинности. Она не содержит временной, физической или причинной семантики.');
add('m2','Таблицы истинности, тавтологии и противоречия','Таблицы истинности дают конечный способ исследовать семантику логики высказываний и обнаруживать логические ошибки.',`
<h2>1. Все оценки</h2><p>Оценка — функция, сопоставляющая каждому атомарному высказыванию значение 0 или 1. Для n разных атомов существует 2ⁿ возможных оценок. Таблица истинности перечисляет их все и вычисляет значение составной формулы снизу вверх.</p>
<div class="table-wrap"><table><thead><tr><th>P</th><th>Q</th><th>¬P</th><th>P ∧ Q</th><th>P ∨ Q</th><th>P → Q</th></tr></thead><tbody><tr><td>И</td><td>И</td><td>Л</td><td>И</td><td>И</td><td>И</td></tr><tr><td>И</td><td>Л</td><td>Л</td><td>Л</td><td>И</td><td>Л</td></tr><tr><td>Л</td><td>И</td><td>И</td><td>Л</td><td>И</td><td>И</td></tr><tr><td>Л</td><td>Л</td><td>И</td><td>Л</td><td>Л</td><td>И</td></tr></tbody></table></div>
<h2>2. Три класса формул</h2><div class="definition"><div class="box-label">Тавтология</div>Формула истинна при каждой булевой оценке. Пример: P ∨ ¬P в классической логике.</div><div class="definition"><div class="box-label">Противоречие</div>Формула ложна при каждой оценке. Пример: P ∧ ¬P.</div><div class="definition"><div class="box-label">Контингентная формула</div>Формула истинна при некоторых оценках и ложна при других. Например, P → Q.</div>
<h2>3. Проверка эквивалентности</h2><p>Формулы A и B логически эквивалентны, если при каждой оценке их значения совпадают. Эквивалентность можно проверить сравнением двух столбцов таблицы или построением таблицы для A ↔ B и проверкой, что она является тавтологией.</p>
<h2>4. Предел метода</h2><p>Для конечного набора атомов логики высказываний таблица исчерпывает все случаи. В логике предикатов появляется квантификация по области объектов, которая может быть бесконечной. Поэтому табличная проверка не является общим решателем логики первого порядка.</p>
<div class="insight"><div class="box-label">Практическое применение</div>Таблицы помогают быстро проверять предполагаемую форму логического перехода, находить контрпример к невалидному рассуждению и понимать разницу между эквивалентностью и односторонним следованием.</div>`, 'Сколько оценок существует для четырёх атомарных высказываний?',['4','8','16'],2,'Число оценок равно 2ⁿ. При n=4 получаем 16.','Почему таблицы истинности не дают общего метода проверки геометрических теорем?','Они исследуют булевы комбинации уже выделенных атомов. Геометрическая теорема требует формализации объектов, отношений, кванторов и аксиом пространства.');
add('m2','Конъюнкция и дизъюнкция: введение и устранение','Натуральный вывод строится вокруг правил, объясняющих, как доказывать связку и как использовать уже доказанную формулу.',`
<h2>1. Конъюнкция</h2><p>Правило введения конъюнкции требует доказать обе части. Правила устранения позволяют извлечь каждую часть из конъюнкции. Это не эвристика: у каждой операции есть точная форма применения.</p>
<div class="chain"><div class="chain-title">Введение ∧I и устранение ∧E</div><div class="chain-row"><div class="n">∧I</div><div><div class="claim">P, Q ⟹ P ∧ Q</div><div class="reason">Обе посылки должны быть установлены.</div></div></div><div class="chain-row"><div class="n">∧E₁</div><div><div class="claim">P ∧ Q ⟹ P</div><div class="reason">Из конъюнкции извлекается левая часть.</div></div></div><div class="chain-row"><div class="n">∧E₂</div><div><div class="claim">P ∧ Q ⟹ Q</div><div class="reason">Из конъюнкции извлекается правая часть.</div></div></div></div>
<h2>2. Дизъюнкция</h2><p>Для введения P ∨ Q достаточно доказать P либо доказать Q. Это не означает, что неизвестную часть можно вывести. Устранение дизъюнкции требует отдельного рассуждения в каждом случае.</p>
<div class="chain"><div class="chain-title">Устранение дизъюнкции ∨E</div><div class="chain-row"><div class="n">1</div><div><div class="claim">P ∨ Q</div><div class="reason">Исходная дизъюнкция.</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">[P] … R</div><div class="reason">Если предположить P, получается R.</div></div></div><div class="chain-row"><div class="n">3</div><div><div class="claim">[Q] … R</div><div class="reason">Если предположить Q, получается то же R.</div></div></div><div class="chain-row goal"><div class="n">4</div><div><div class="claim">R</div><div class="reason">Оба временных предположения сняты.</div></div></div></div>
<h2>3. Почему важно совпадение заключений</h2><p>Если первая ветвь доказывает R, а вторая S, то общего заключения нет. Устранение дизъюнкции не разрешает произвольно выбирать одну ветвь, потому что исходная дизъюнкция не указывает, какая часть истинна.</p>
<div class="insight"><div class="box-label">GeoProof</div>В app.js реализованы схемы ∧I, ∧E, ∨I и ∨E. Для ∨E редактор хранит отдельную группу случаев, проверяет соответствие исходным дизъюнктам и совпадение двух результирующих формул.</div>`, 'Что нужно для применения ∨E к P ∨ Q?', ['Доказать только случай P','Доказать R из P и отдельно R из Q','Показать, что P и Q равны'],1,'В обеих ветвях требуется одно и то же заключение R.','Почему нельзя просто выбрать P из P ∨ Q?','Дизъюнкция истинна, если выполнена хотя бы одна часть, но без дополнительной информации мы не знаем какая. Для общего результата нужно доказать его в обоих случаях.');
add('m2','Импликация: modus ponens и условное доказательство','Импликация имеет два фундаментальных правила: применение уже известного условия и построение условного утверждения через временное предположение.',`
<h2>1. Modus ponens (→E)</h2><div class="definition"><div class="box-label">Правило</div>Из P → Q и P выводится Q. Формула P является антецедентом, Q — консеквентом.</div>
<div class="chain"><div class="chain-title">Modus ponens</div><div class="chain-row"><div class="n">1</div><div><div class="claim">P → Q</div><div class="reason">Если P, то Q.</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">P</div><div class="reason">Условие выполнено.</div></div></div><div class="chain-row goal"><div class="n">3</div><div><div class="claim">Q</div><div class="reason">Применение импликации.</div></div></div></div>
<h2>2. Введение импликации (→I)</h2><p>Чтобы доказать P → Q, мы временно предполагаем P и внутри этого контекста выводим Q. После этого предположение P снимается, а результатом становится условное утверждение.</p>
<div class="chain"><div class="chain-title">Условное доказательство</div><div class="chain-row"><div class="n">1</div><div><div class="claim">[P]</div><div class="reason">Открываем временное предположение.</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">…</div><div class="reason">Получаем Q из P и внешних посылок.</div></div></div><div class="chain-row"><div class="n">3</div><div><div class="claim">Q</div><div class="reason">Заключение внутри контекста.</div></div></div><div class="chain-row goal"><div class="n">4</div><div><div class="claim">P → Q</div><div class="reason">Закрываем контекст и снимаем P.</div></div></div></div>
<h2>3. Две распространённые ошибки</h2><ul><li><b>Утверждение следствия:</b> P → Q, Q, следовательно P. Неверно: Q может быть истинно по другой причине.</li><li><b>Отрицание основания:</b> P → Q, ¬P, следовательно ¬Q. Неверно: отсутствие P не сообщает, истинно ли Q.</li></ul>
<p>Контрапозиция ¬Q → ¬P логически эквивалентна P → Q в классической логике. Но это не те же самые посылки: при формальном использовании нужно построить требуемое преобразование или отдельно доказать контрапозицию.</p>`, 'Что следует из P → Q и P?', ['P ∧ Q','Q','¬Q'],1,'Это modus ponens: антецедент импликации установлен, значит можно получить консеквент.','Как доказывать импликацию P → Q, если P ещё не доказано?', 'Временно предположить P, внутри этого контекста вывести Q, а затем снять предположение правилом введения импликации.');
add('m2','Отрицание, противоречие и классическая логика','Работа с отрицанием требует понимать, какие именно предположения снимаются и какой логической силой обладает система.',`
<h2>1. Ложь и отрицание</h2><p>Символ ⊥ обозначает противоречие или невозможное утверждение. В стандартном прочтении натурального вывода отрицание ¬P связано с импликацией P → ⊥. Поэтому доказать ¬P — значит показать, что предположение P приводит к противоречию.</p>
<div class="chain"><div class="chain-title">Введение отрицания ¬I</div><div class="chain-row"><div class="n">1</div><div><div class="claim">[P]</div><div class="reason">Временное предположение.</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">… ⊥</div><div class="reason">Из P получено противоречие.</div></div></div><div class="chain-row goal"><div class="n">3</div><div><div class="claim">¬P</div><div class="reason">Снимаем предположение P.</div></div></div></div>
<h2>2. Принцип взрыва</h2><p>Из ⊥ в классической и интуиционистской логике можно вывести любую формулу R. Именно поэтому противоречивые исходные посылки опасны: если база противоречива, формально становится выводимо любое утверждение.</p>
<h2>3. Классическая и конструктивная логика</h2><div class="table-wrap"><table><thead><tr><th>Принцип</th><th>Классическая</th><th>Интуиционистская</th></tr></thead><tbody><tr><td>¬¬P → P</td><td>Принимается</td><td>Не выводится вообще</td></tr><tr><td>P ∨ ¬P</td><td>Закон исключённого третьего</td><td>Не выводится вообще</td></tr><tr><td>[¬P] … ⊥ ⟹ P (RAA)</td><td>Принимается</td><td>Не является общим правилом</td></tr><tr><td>P → ¬¬P</td><td>Принимается</td><td>Принимается</td></tr></tbody></table></div>
<h2>4. ¬I и RAA различаются</h2><p>При введении отрицания предполагается P, а затем выводится ⊥; результат — ¬P. При классическом reductio ad absurdum предполагается ¬P, выводится ⊥, а затем заключают P. Второй переход использует классическую силу логики.</p>
<div class="warning"><div class="box-label">Формализация</div>GeoProof имеет отдельные правила для введения отрицания, двойного отрицания и классического RAA. При переносе доказательства в конструктивную среду нужно отметить, где именно использован классический принцип.</div>`, 'Что требуется для правила ¬I?', ['Предположить P и получить ⊥','Предположить ¬P и сразу записать P','Доказать P и Q'],0,'Введение отрицания снимает предположение P после получения противоречия.','Почему ¬¬P → P — классический шаг?', 'Из невозможности доказать отрицание P конструктивно не следует автоматически предъявление доказательства P. Классическая логика допускает этот переход, интуиционистская — нет.');
add('m3','Сигнатура, термы, предикаты и арность','Логика первого порядка раскрывает структуру объектов: термы обозначают элементы области, а предикаты выражают свойства и отношения.',`
<h2>1. Сигнатура</h2><div class="definition"><div class="box-label">Определение · сигнатура</div>Сигнатура языка — набор нелогических символов с указанием их арности и назначения: констант, функциональных символов и предикатных символов.</div>
<div class="table-wrap"><table><thead><tr><th>Символ</th><th>Тип</th><th>Интерпретация</th></tr></thead><tbody><tr><td>O</td><td>Константа</td><td>Центр заданной окружности</td></tr><tr><td>mid(x,y)</td><td>Функция, арность 2</td><td>Точка-середина отрезка</td></tr><tr><td>OnLine(x,l)</td><td>Предикат, арность 2</td><td>Точка лежит на прямой</td></tr><tr><td>Collinear(x,y,z)</td><td>Предикат, арность 3</td><td>Три точки коллинеарны</td></tr></tbody></table></div>
<h2>2. Терм и формула</h2><p>Терм — синтаксическое выражение, обозначающее объект области. Константа A и выражение mid(A,B) могут быть термами. Предикат OnLine(A,l) образует атомарную формулу, которая в интерпретации истинна или ложна.</p>
<p>Арность — число аргументов символа. У двухместного предиката нельзя записать один или три аргумента, если грамматика сигнатуры этого не разрешает. Такая проверка напоминает проверку типов аргументов обычной функции в языке программирования.</p>
<h2>3. Атомарные формулы в GeoProof</h2><p>В GeoProof термы могут ссылаться на внутренние объекты модели: точки, отрезки, углы и окружности. Это не означает, что подпись объекта является его идентичностью. Внутренняя ссылка должна указывать на конкретный объект, даже если подпись меняется.</p>
<div class="insight"><div class="box-label">Важное различие</div>«Существует точка M» — высказывание о существовании объекта. M — имя или терм, обозначающий объект. IsMidpoint(M,A,B) — формула, утверждающая свойство M. Эти уровни языка нельзя смешивать.</div>`, 'Что является атомарной формулой?', ['mid(A,B)','OnLine(A,l)','A'],1,'OnLine(A,l) — предикат, применённый к термам, поэтому он образует утверждение.','Почему терм нельзя трактовать как предикат?', 'Терм обозначает объект области. Предикат утверждает свойство этого объекта или отношение нескольких объектов и образует формулу с истинностным значением.');
add('m3','Кванторы: смысл всеобщности и существования','Кванторы позволяют высказываться обо всех объектах области или утверждать наличие хотя бы одного объекта с заданным свойством.',`
<h2>1. Квантор всеобщности</h2><div class="definition"><div class="box-label">Определение · ∀</div>Формула ∀x P(x) истинна в интерпретации тогда и только тогда, когда P(a) истинно для каждого элемента a области D.</div>
<p>Квантор связывает переменную x в своей области действия. Его нельзя понимать как конечный перебор точек, которые нарисованы сейчас в GeoProof. Область квантификации задаётся математической структурой и может быть бесконечной.</p>
<h2>2. Квантор существования</h2><div class="definition"><div class="box-label">Определение · ∃</div>Формула ∃x P(x) истинна в интерпретации тогда и только тогда, когда существует хотя бы один элемент a из D, для которого P(a) истинно.</div>
<p>Для конструктивного доказательства существования обычно предъявляют свидетель a и доказывают P(a). Классическое доказательство существования может не давать явного способа построения свидетеля.</p>
<h2>3. Порядок кванторов важен</h2><div class="formula">∀x ∃y R(x,y)  ≠  ∃y ∀x R(x,y)<small>Эти формулы в общем случае неэквивалентны.</small></div>
<p>Первое утверждение: для каждого x можно найти подходящий y, причём y может зависеть от x. Второе: существует один y, который подходит для всех x. Смена порядка кванторов изменяет математический смысл и не является перестановкой скобок.</p>
<h2>4. Пример с прямыми</h2><p>«Через любую точку проходит некоторая прямая» имеет форму ∀P ∃l On(P,l). Утверждение «существует одна прямая, проходящая через все точки плоскости» имеет форму ∃l ∀P On(P,l) и описывает совсем другое свойство.</p>
<div class="warning"><div class="box-label">Типичная ошибка</div>Не опускай область квантификации. ∀x P(x) в теории точек и ∀x P(x) в теории прямых — разные формулы с разными типами области.</div>`, 'Что означает ∃x P(x)?',['P(x) истинно для всех x','Существует хотя бы один x, для которого P(x) истинно','P(x) не зависит от x'],1,'Квантор существования требует хотя бы одного свидетеля.','Почему ∀x∃y R(x,y) не равносильно ∃y∀x R(x,y)?','В первом случае значение y может зависеть от x. Во втором требуется один общий y для всех x. Это существенно разные условия.');
add('m3','Правила вывода для кванторов и условия свежести','Правила ∀I, ∀E, ∃I и ∃E связывают квантификацию с доказательствами; условия свежести защищают от незаконного обобщения.',`
<h2>1. Всеобщность</h2><div class="chain"><div class="chain-title">Устранение ∀E</div><div class="chain-row"><div class="n">1</div><div><div class="claim">∀x P(x)</div><div class="reason">Свойство каждого объекта области.</div></div></div><div class="chain-row goal"><div class="n">2</div><div><div class="claim">P(a)</div><div class="reason">Подставляем конкретный терм a.</div></div></div></div>
<p>Для введения всеобщности ∀I берут произвольный параметр a и доказывают P(a). Параметр не должен зависеть от специальных недоказанных предположений, иначе свойство может выполняться только для особого объекта.</p>
<h2>2. Существование</h2><div class="chain"><div class="chain-title">Введение ∃I и устранение ∃E</div><div class="chain-row"><div class="n">∃I</div><div><div class="claim">P(a) ⟹ ∃x P(x)</div><div class="reason">Предъявляется конкретный свидетель.</div></div></div><div class="chain-row"><div class="n">∃E</div><div><div class="claim">∃x P(x), [P(c)] … R ⟹ R</div><div class="reason">Свежий c вводится локально, а итог R не зависит от c.</div></div></div></div>
<h2>3. Почему свежесть — математическое условие</h2><p>Пусть известно, что существует точка с некоторым свойством. Нельзя назвать неизвестную точку C и затем считать, что C отличается от всех других объектов, если это не следует из условий. Свежий параметр — не конкретный выбранный объект, а произвольное имя временного свидетеля.</p>
<p>При ∃E заключение R не должно содержать c и не должно опираться на специальные свойства c, не следующие из P(c). Иначе после снятия предположения доказательство потеряет основание.</p>
<div class="insight"><div class="box-label">GeoProof</div>Код отслеживает неразряженные предположения, область действия контекстов и свежесть параметра для ∀I и свидетеля для ∃E. Это одна из причин, почему редактор хранит структуру поддоказательств, а не только нумерованный список текста.</div>`, 'Какое условие нужно для ∀I?', ['Параметр должен быть произвольным и не зависеть от специальных недоказанных предположений','Нужно предъявить один частный пример','Нужно предположить отрицание заключения'],0,'Всеобщность обобщает свойство произвольного объекта; специальная зависимость делает обобщение незаконным.','Почему вывод ∃E не должен зависеть от свежего c?','c — временное имя неизвестного свидетеля. После закрытия локального предположения внешний результат должен оставаться доказанным независимо от того, какой объект был свидетелем.');
add('m3','Свободные и связанные переменные; α-эквивалентность','Точное понимание области действия квантора необходимо для корректной подстановки и сравнения формул.',`
<h2>1. Свободное и связанное вхождение</h2><p>Вхождение переменной связано, если находится в области действия квантора, который связывает именно эту переменную. В противном случае вхождение свободно. Переменная свободна в формуле, если имеет хотя бы одно свободное вхождение.</p>
<div class="table-wrap"><table><thead><tr><th>Формула</th><th>Свободные переменные</th><th>Объяснение</th></tr></thead><tbody><tr><td>P(x,y)</td><td>x, y</td><td>Нет кванторов</td></tr><tr><td>∀x P(x,y)</td><td>y</td><td>x связана квантором</td></tr><tr><td>∀x ∃y R(x,y)</td><td>Нет</td><td>Обе переменные связаны</td></tr><tr><td>∀x(P(x) → Q(z))</td><td>z</td><td>z не связана этим квантором</td></tr></tbody></table></div>
<h2>2. α-эквивалентность</h2><p>Связанное имя можно безопасно переименовать, если замена согласованно затрагивает его область действия и не создаёт захвата. Поэтому ∀x P(x) и ∀z P(z) выражают один и тот же смысл. Но свободные переменные нельзя произвольно переименовывать: они могут обозначать параметры внешней задачи.</p>
<h2>3. Захват переменной</h2><p>Пусть требуется подставить терм y вместо свободного x в формулу ∀y R(x,y). Наивная замена дала бы ∀y R(y,y), где подставленная y стала связанной внешним квантором. Это захват переменной и изменение смысла формулы.</p>
<div class="formula">∀y R(x,y)  [y/x]  ⟶  ∀z R(y,z)<small>Сначала связанная y переименована в свежую z, затем выполнена подстановка.</small></div>
<h2>4. Реализация</h2><p>В app.js есть рекурсивный обход AST для свободных переменных, сбор всех термов, переименование связанных вхождений и подстановка с проверкой захвата. Сравнение формул нормализует имена связанных переменных, то есть учитывает α-эквивалентность.</p>`, 'Сколько свободных переменных в ∀x (P(x) ∧ Q(y))?',['Ноль','Одна: y','Две: x и y'],1,'x связана, а y остаётся свободной.','Почему при подстановке нужно переименовывать связанный параметр?', 'Чтобы свободная переменная подставляемого терма случайно не оказалась под областью действия квантора. Иначе новая формула будет иметь другой смысл.');
add('m3','Равенство, тождество и подстановка','Равенство в логике имеет собственные правила; в геометрии важно отличать идентичность объектов от равенства их измеряемых величин.',`
<h2>1. Основные свойства равенства</h2><div class="table-wrap"><table><thead><tr><th>Свойство</th><th>Схема</th></tr></thead><tbody><tr><td>Рефлексивность</td><td>a = a</td></tr><tr><td>Симметричность</td><td>a = b ⇒ b = a</td></tr><tr><td>Транзитивность</td><td>a = b ∧ b = c ⇒ a = c</td></tr><tr><td>Подстановка</td><td>a = b ⇒ (P(a) ⇒ P(b))</td></tr></tbody></table></div>
<h2>2. Объекты и величины</h2><p>Равенство точек A = B обычно утверждает идентичность объектов. Равенство длин AB = CD утверждает совпадение числовых величин или конгруэнтность отрезков в соответствующей аксиоматике. Два отрезка могут иметь одинаковую длину и находиться в разных местах плоскости.</p>
<p>Аналогично, равенство углов не следует смешивать с совпадением их сторон или вершин. Тип утверждения определяет, какие определения и теоремы допустимо использовать.</p>
<h2>3. Нормализация не равна доказательству</h2><p>Приложение может распознавать симметричность некоторых отношений, например перестановку концов отрезка или сторон равенства. Такая нормализация помогает сопоставлять формулы. Но она не доказывает произвольное алгебраическое тождество и не заменяет рассуждение о геометрической конгруэнтности.</p>
<div class="warning"><div class="box-label">Контроль типа</div>Перед использованием правила выясни, что именно сравнивается: точки, отрезки как объекты, длины отрезков, углы как геометрические фигуры или их меры. Один и тот же символ в неформальной записи может скрывать разные типы отношений.</div>`, 'Из a = b и b = c по транзитивности следует…',['a = c','a ≠ c','a = b = c как новый объект'],0,'Транзитивность передаёт равенство через общую промежуточную величину.','Почему равенство длин не означает совпадение отрезков?','Длина — числовая величина отрезка. Отрезки могут иметь одинаковую длину, но располагаться в разных местах и иметь разные концы.');
add('m4','Евклидова геометрия: аксиоматические основания','Геометрические теоремы выводятся не из рисунка, а из системы понятий, отношений и аксиом, определяющих допустимое пространство.',`
<h2>1. Первичные понятия</h2><p>В синтетической аксиоматике точка, прямая и принадлежность могут приниматься как первичные понятия. Попытка определить точку через «место без размера» лишь заменяет одно неформальное выражение другим. Строгая теория задаёт поведение первичных объектов через аксиомы.</p>
<h2>2. Основные группы аксиом</h2><div class="table-wrap"><table><thead><tr><th>Группа</th><th>Что регулирует</th><th>Пример отношения</th></tr></thead><tbody><tr><td>Инцидентность</td><td>Связь точек, прямых и плоскостей</td><td>Точка лежит на прямой</td></tr><tr><td>Порядок</td><td>Расположение точек на прямой</td><td>B между A и C</td></tr><tr><td>Конгруэнтность</td><td>Равенство отрезков и углов</td><td>AB ≅ CD</td></tr><tr><td>Параллельность</td><td>Взаимное положение прямых</td><td>Единственность параллельной</td></tr><tr><td>Непрерывность</td><td>Полнота геометрической прямой</td><td>Существование границ и пересечений</td></tr></tbody></table></div>
<h2>3. Евклид и Гильберт</h2><p>«Начала» Евклида строят геометрию из определений, постулатов и общих понятий. Аксиоматика Гильберта систематизирует основания по группам и уточняет логические условия. Это позволяет анализировать, какие аксиомы использует теорема и какие можно исключить.</p>
<h2>4. Аксиома параллельных</h2><p>В форме Плейфера: через точку, не лежащую на данной прямой, проходит ровно одна прямая, не пересекающая данную. В других геометриях условие меняется. Поэтому результат «сумма углов треугольника равна 180°» относится к евклидовой геометрии, а не к любому пространству.</p>
<div class="insight"><div class="box-label">Методологический вывод</div>Теорема должна иметь явные предпосылки. Если доказательство использует аксиому параллельных, это часть математического содержания результата.</div>`, 'Что означает аксиома в выбранной геометрии?',['Любое очевидное утверждение','Исходное положение, принятое в данной системе оснований','Рисунок, который построила программа'],1,'Аксиома является частью спецификации математической теории.','Почему евклидову аксиому параллельных важно указывать явно?','Потому что существуют другие непротиворечивые геометрические системы с иным поведением параллельных. Некоторые привычные теоремы зависят от евклидова основания.');
add('m4','Инцидентность, коллинеарность, порядок и отрезки','Принадлежность точек прямой и их порядок — разные отношения; определение отрезка использует оба понятия.',`
<h2>1. Инцидентность</h2><p>Инцидентность выражает принадлежность геометрических объектов. Точка P лежит на прямой l — бинарное отношение между объектами разных типов. В аксиоматике обычно требуется, чтобы через любые две различные точки проходила ровно одна прямая.</p>
<h2>2. Коллинеарность и порядок</h2><div class="definition"><div class="box-label">Коллинеарность</div>Точки A, B, C коллинеарны, если существует одна прямая, содержащая все три точки.</div><div class="definition"><div class="box-label">Отношение «между»</div>B лежит между A и C, если точки коллинеарны, B отличается от A и C и занимает внутреннее положение на отрезке AC в принятой аксиоматике порядка.</div>
<p>Коллинеарность не сообщает, какая точка находится посередине. На одной прямой могут располагаться A–B–C, A–C–B и B–A–C. Для утверждения о середине нужен порядок, а не только принадлежность одной прямой.</p>
<h2>3. Отрезок, луч и прямая</h2><p>Прямая AB не ограничена концами A и B. Отрезок AB содержит концы и точки между ними. Луч AB начинается в A и продолжается в направлении B. Эти объекты не следует смешивать, особенно когда речь идёт о высотах тупоугольного треугольника: основание высоты может лежать на продолжении стороны.</p>
<h2>4. Середина</h2><div class="formula">M — середина AB  ⇔  M ∈ AB и AM = MB<small>Схема определения; формальные детали принадлежности зависят от выбранной аксиоматики.</small></div><p>Построение середины даёт кандидат M. Доказательство требует отдельно обосновать принадлежность отрезку и равенство двух частей. Доказательство единственности — ещё один отдельный аргумент.</p>`, 'Достаточно ли коллинеарности A, B, C, чтобы утверждать, что B между A и C?',['Да','Нет, необходимо дополнительно установить порядок точек','Только если A и C равноудалены от B'],1,'Коллинеарность сообщает лишь, что точки лежат на одной прямой.','Почему определение высоты использует прямую, содержащую противоположную сторону?', 'В тупоугольном треугольнике основание высоты может лежать на продолжении стороны. Определение через несущую прямую включает этот корректный случай.');
add('m4','Отрезки, углы, измерение и конгруэнтность','Геометрические объекты, их меры и отношения равенства следует определять раздельно.',`
<h2>1. Отрезок и длина</h2><p>Отрезок как множество точек и его длина как числовая величина — разные математические объекты. Равенство длин не означает совпадение отрезков: два параллельных отрезка могут иметь одинаковую длину и разное положение.</p>
<h2>2. Угол и мера</h2><p>Угол образован двумя лучами с общим началом. Мера угла — числовая характеристика. В стандартной евклидовой градусной мере прямой угол равен 90°, развёрнутый — 180°. Переход от равенства геометрических углов к равенству мер зависит от определения меры.</p>
<h2>3. Конгруэнтность</h2><div class="definition"><div class="box-label">Конгруэнтность</div>Отношение равенства геометрических фигур при соответствующем сопоставлении элементов. Для отрезков оно связано с равенством длины; для треугольников — с совпадением соответствующих сторон и углов.</div>
<p>В синтетической геометрии конгруэнтность может быть первичным отношением с аксиомами. В метрической или координатной модели она часто задаётся через равенство расстояний и угловых мер. Эти подходы не нужно отождествлять без проверки.</p>
<h2>4. Измерение и доказательство</h2><p>Измерение на экране помогает сформулировать гипотезу и обнаружить вероятную ошибку. Но измерения имеют погрешность, а конкретное совпадение величин не доказывает универсальную теорему. В интерактивной геометрии положение объектов меняется, поэтому важно проверять, сохраняется ли свойство при допустимых движениях.</p>
<div class="warning"><div class="box-label">Не подменяй смысл</div>Перед применением правила назови, что доказывается: идентичность точек, равенство длин, равенство углов, конгруэнтность фигур или перпендикулярность прямых.</div>`, 'Два отрезка имеют одинаковую длину. Обязательно ли они совпадают?', ['Да','Нет, они могут находиться в разных местах плоскости','Только если одинаково названы'],1,'Длина — числовая величина; совпадение геометрических множеств требует дополнительных условий.','Почему измерение на чертеже не заменяет доказательство?', 'Оно относится к конкретному вычисленному состоянию и содержит численную погрешность. Теорема должна выводиться из общих условий для всех допустимых конфигураций.');
add('m4','Треугольники: признаки равенства и подобия','Признаки равенства и подобия — теоремы о достаточности условий; порядок вершин фиксирует соответствие сторон и углов.',`
<h2>1. Соответствие вершин</h2><p>Запись △ABC ≅ △DEF задаёт соответствие A↔D, B↔E, C↔F. Это означает AB↔DE, BC↔EF, AC↔DF и аналогичное соответствие углов. Перестановка букв меняет соответствие и может сделать применение следующей теоремы неверным.</p>
<div class="table-wrap"><table><thead><tr><th>Признак</th><th>Достаточные данные</th><th>Критическая оговорка</th></tr></thead><tbody><tr><td>SSS</td><td>Три соответствующие стороны равны</td><td>Пары сторон сопоставлены правильно</td></tr><tr><td>SAS</td><td>Две стороны и угол между ними</td><td>Угол именно включённый</td></tr><tr><td>ASA</td><td>Сторона и два прилежащих угла</td><td>Сторона между углами</td></tr><tr><td>AAS</td><td>Два угла и соответствующая сторона</td><td>Третий угол определяется суммой</td></tr><tr><td>HL</td><td>Гипотенуза и катет</td><td>Оба треугольника прямоугольные</td></tr></tbody></table></div>
<h2>2. SSA — не общий признак</h2><p>Две стороны и невключённый угол в общем случае не определяют треугольник однозначно. Возможны две разные конфигурации или отсутствие конфигурации. Поэтому SSA нельзя выдавать за SAS.</p>
<h2>3. CPCTC</h2><p>После доказательства конгруэнтности соответствующие части равных треугольников равны (CPCTC). Это следствие установленного соответствия, а не способ доказать саму конгруэнтность.</p>
<h2>4. Подобие</h2><p>Подобные треугольники имеют равные соответствующие углы и пропорциональные соответствующие стороны. Критерии подобия AA, SSS и SAS строятся на этих условиях. Коэффициент подобия связывает длины соответствующих сторон одним положительным множителем.</p>
<div class="chain"><div class="chain-title">Скелет доказательства по SAS</div><div class="chain-row"><div class="n">1</div><div><div class="claim">AB = DE, AC = DF</div><div class="reason">Дано: две соответствующие стороны.</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">∠BAC = ∠EDF</div><div class="reason">Дан угол между этими сторонами.</div></div></div><div class="chain-row goal"><div class="n">3</div><div><div class="claim">△ABC ≅ △DEF</div><div class="reason">Признак SAS при соответствующем порядке вершин.</div></div></div><div class="chain-row"><div class="n">4</div><div><div class="claim">BC = EF</div><div class="reason">CPCTC.</div></div></div></div>`, 'Что отличает SAS от SSA?', ['В SAS угол между двумя сравниваемыми сторонами','SAS использует только углы','SSA означает три стороны'],0,'Включённый угол — существенная часть SAS.','Почему CPCTC применяют после конгруэнтности?', 'Пока не установлено соответствие треугольников, равенство оставшихся соответствующих частей не обосновано. CPCTC является следствием конгруэнтности.');
add('m4','Параллельные прямые, углы и окружности','Теоремы о параллельных и окружностях демонстрируют, как определения, аксиомы и признаки равенства связываются в длинные доказательства.',`
<h2>1. Углы при секущей</h2><p>Если две прямые пересечены секущей, возникают накрест лежащие, соответственные и односторонние внутренние углы. При параллельных прямых накрест лежащие и соответственные углы равны, а сумма односторонних внутренних составляет 180°. Обратные утверждения при стандартных условиях позволяют доказать параллельность.</p>
<h2>2. Сумма углов треугольника</h2><div class="formula">∠A + ∠B + ∠C = 180°<small>Для треугольника евклидовой плоскости.</small></div><p>Классическое доказательство проводит через вершину прямую, параллельную противоположной стороне, и использует равенство накрест лежащих углов. Следовательно, теорема опирается на евклидову аксиому параллельных.</p>
<h2>3. Окружность</h2><div class="definition"><div class="box-label">Определение</div>Окружность с центром O и радиусом r > 0 — множество точек P, для которых OP = r.</div>
<p>Хорда соединяет две точки окружности. Диаметр — хорда, проходящая через центр. Секущая пересекает окружность в двух различных точках; касательная имеет с ней одну общую точку.</p>
<h2>4. Основные теоремы</h2><ul><li>Вписанный угол, опирающийся на диаметр, прямой.</li><li>Центральный угол, опирающийся на ту же дугу, вдвое больше вписанного.</li><li>Радиус, проведённый в точку касания, перпендикулярен касательной.</li><li>Отрезки касательных из одной внешней точки равны.</li><li>Для двух хорд, пересекающихся внутри окружности, произведения отрезков равны.</li></ul>
<div class="formula">PA · PB = PC · PD<small>Две хорды AB и CD одной окружности пересекаются внутри в P.</small></div>
<div class="warning"><div class="box-label">GeoProof</div>Теоремы об окружностях есть в каталоге приложения, но их присутствие в каталоге не означает, что валидатор проверяет каждую геометрическую предпосылку. Большинство таких оснований требует содержательной проверки.</div>`, 'Что используется в стандартном доказательстве суммы углов треугольника?', ['Только определение окружности','Параллельная через вершину прямая и свойства углов при секущей','Только измерение углов на экране'],1,'Доказательство использует свойства параллельных прямых, то есть евклидово основание.','Почему теорема о пересекающихся хордах требует одной окружности?', 'Равенство произведений следует из подобия треугольников, связанных с одной окружностью. Для произвольных пересекающихся отрезков такое равенство неверно.');
add('m5','Планирование доказательства: цель и предпосылки','Поиск доказательства совмещает движение от данных вперёд и анализ цели назад; эти направления нельзя путать с окончательным порядком вывода.',`
<h2>1. Две перспективы</h2><p>Прямой ход спрашивает: что можно получить из уже установленных фактов? Обратный ход спрашивает: какие условия были бы достаточны для цели? Обратный ход помогает придумать стратегию, но не разрешает использовать цель как готовую посылку.</p>
<h2>2. Анализ формы цели</h2><div class="table-wrap"><table><thead><tr><th>Цель</th><th>Естественный план</th></tr></thead><tbody><tr><td>P ∧ Q</td><td>Доказать обе части отдельно</td></tr><tr><td>P ∨ Q</td><td>Доказать один удобный дизъюнкт</td></tr><tr><td>P → Q</td><td>Предположить P и вывести Q</td></tr><tr><td>¬P</td><td>Предположить P и получить противоречие</td></tr><tr><td>∀x P(x)</td><td>Взять произвольный объект x</td></tr><tr><td>∃x P(x)</td><td>Построить конкретный свидетель</td></tr><tr><td>A = B</td><td>Найти определение или критерий равенства</td></tr></tbody></table></div>
<h2>3. Промежуточные леммы</h2><p>Если цель — равенство двух отрезков, возможно, проще показать равенство треугольников, где эти отрезки соответствуют друг другу. Промежуточная лемма соединяет набор исходных данных с целевым результатом и делит длинное доказательство на управляемые фрагменты.</p>
<h2>4. Рабочая процедура</h2><ol><li>Выпиши все данные и цель отдельно.</li><li>Разложи составную цель по логической форме.</li><li>Для каждого правила вывода выпиши необходимые посылки.</li><li>Выдели недостающие факты и сформулируй леммы.</li><li>Проверь, что ни одна цель не используется как собственная предпосылка.</li><li>Запиши итоговую цепочку от исходных посылок к заключению.</li></ol>
<div class="insight"><div class="box-label">Рабочая привычка</div>Сначала найди структуру аргумента на черновике. Только после этого переноси шаги в GeoProof. Это уменьшает риск, что редакторская форма начнёт диктовать математическую идею.</div>`, 'Если цель имеет форму P ∧ Q, какой план корректен?', ['Доказать любую одну часть','Получить обе части','Предположить ¬P и остановиться'],1,'Конъюнкция вводится только после получения обеих частей.','Почему обратный ход нельзя напрямую записывать в итоговую цепочку?', 'Потому что он определяет необходимые или достаточные условия для плана, но не доказывает их. В итоговом доказательстве каждое такое условие должно быть выведено из доступных посылок.');
add('m5','Прямое доказательство, контрапозиция и от противного','Разные формы доказательства отвечают на разные логические структуры цели; их нужно выбирать осознанно.',`
<h2>1. Прямое доказательство</h2><p>Для теоремы P → Q прямое доказательство начинает с предположения P и последовательно выводит Q. Это естественный метод, когда из условий можно строить цепочку определений, лемм и теорем.</p>
<h2>2. Контрапозиция</h2><p>В классической логике P → Q эквивалентно ¬Q → ¬P. Иногда проще предположить отрицание заключения Q и вывести отрицание условия P. Это не «доказательство от противного» в смысле RAA, а доказательство логически эквивалентной импликации.</p>
<div class="formula">(P → Q)  ⇔  (¬Q → ¬P)<small>Эквивалентность контрапозиции в классической логике.</small></div>
<h2>3. Доказательство от противного (RAA)</h2><p>Для доказательства P классическим методом временно предполагают ¬P и выводят противоречие ⊥. Из невозможности ¬P заключают P. Этот метод отличается от введения отрицания, где предполагают P и доказывают ¬P.</p>
<h2>4. Когда метод полезен</h2><ul><li>Контрапозиция удобна, когда отрицание следствия даёт более сильные ограничения.</li><li>RAA полезно, когда предположение противоположного результата приводит к явному противоречию.</li><li>Прямое доказательство предпочтительно, когда из данных можно конструктивно построить требуемый объект или равенство.</li></ul>
<div class="warning"><div class="box-label">Классическая зависимость</div>RAA в общей форме использует классический принцип. Если задача формализуется конструктивно, нужно проверить, можно ли заменить его явной конструкцией или контрапозицией.</div>`, 'Что предполагают при классическом RAA для доказательства P?', ['P','¬P','P ∧ Q'],1,'Предполагается отрицание цели; получение противоречия позволяет заключить P.','Чем контрапозиция отличается от RAA?', 'Контрапозиция доказывает эквивалентную импликацию ¬Q → ¬P. RAA начинает с отрицания самой цели P и снимает его после противоречия.');
add('m5','Доказательство по случаям и разбиение задачи','Разбор случаев позволяет получить один общий результат из нескольких исчерпывающих альтернатив.',`
<h2>1. Логическая схема</h2><p>Если доказано P ∨ Q, а из P следует R и из Q следует R, то можно заключить R. Правило называется устранением дизъюнкции. Оно требует, чтобы альтернативы были именно частями исходной дизъюнкции.</p>
<div class="chain"><div class="chain-title">∨E — дерево по случаям</div><div class="chain-row"><div class="n">Основание</div><div><div class="claim">P ∨ Q</div><div class="reason">По крайней мере одна из двух альтернатив выполнена.</div></div></div><div class="chain-row"><div class="n">Случай 1</div><div><div class="claim">[P] … R</div><div class="reason">Доказываем R при предположении P.</div></div></div><div class="chain-row"><div class="n">Случай 2</div><div><div class="claim">[Q] … R</div><div class="reason">Доказываем R при предположении Q.</div></div></div><div class="chain-row goal"><div class="n">Вывод</div><div><div class="claim">R</div><div class="reason">Оба локальных предположения сняты.</div></div></div></div>
<h2>2. Исчерпывающие случаи</h2><p>В задачах часто разбивают область на случаи по знаку числа, взаимному положению прямых или расположению точки относительно окружности. Нужно обосновать, что случаи покрывают все возможности и не пропускают конфигурацию.</p>
<h2>3. Независимость ветвей</h2><p>Каждая ветвь должна опираться на исходные внешние данные и своё локальное предположение. Нельзя переносить шаг из одной ветви в другую. Также нельзя получить в ветвях разные заключения и объединить их без дополнительного правила.</p>
<h2>4. Реализация в GeoProof</h2><p>Редактор хранит отдельные контексты случаев, предположения, выводы ветвей и итоговый шаг ∨E. При удалении одного из ключевых элементов парная структура должна быть удалена или пересобрана, чтобы не оставлять осиротевший доказательный контекст.</p>`, 'Что необходимо проверить при доказательстве по случаям?', ['Что каждый случай начинается с соответствующей альтернативы и все ветви приводят к одному R','Что в каждой ветви используется одна и та же нумерация шагов','Что достаточно доказать только первую ветвь'],0,'Именно так обеспечивается корректность устранения дизъюнкции.','Почему нельзя взять шаг из первой ветви и использовать во второй?', 'Он выведен под локальным предположением первой ветви. Во второй ветви это предположение недоступно, поэтому ссылка нарушает область действия контекста.');
add('m5','Существование, построение и единственность','Существование, конструктивность и единственность — разные требования, которые часто объединяются в одной геометрической задаче.',`
<h2>1. Существование</h2><p>Утверждение ∃x P(x) говорит о наличии хотя бы одного подходящего объекта. Конструктивное доказательство предъявляет конкретный свидетель a и доказывает P(a). Неконструктивное доказательство может устанавливать существование без явного способа построения.</p>
<h2>2. Единственность</h2><p>Чтобы доказать, что существует ровно один объект с свойством P, нужно установить существование и показать, что любые два объекта с P совпадают.</p>
<div class="formula">∃!x P(x)  ≡  (∃x P(x)) ∧ ∀x∀y((P(x) ∧ P(y)) → x=y)<small>Разложение существования с единственностью.</small></div>
<h2>3. Геометрические примеры</h2><ul><li>Прямая через две различные точки: существование и единственность.</li><li>Середина отрезка: требуется точка, принадлежащая отрезку и делящая его на равные части; отдельно доказывается единственность.</li><li>Пересечение прямых: для единственной точки нужно исключить параллельный и совпадающий случаи.</li></ul>
<h2>4. Построение не равно доказательству</h2><p>Интерактивное построение демонстрирует один способ получить объект. Но программа может показать конкретное состояние, не доказывая, что объект существует для всех допустимых входных данных и что он единственный.</p>
<div class="insight"><div class="box-label">Формализация</div>В Lean доказательство Exists обычно содержит свидетель и доказательство свойства. Единственность требует отдельного аргумента о любых двух свидетелях — одного конструктора существования недостаточно.</div>`, 'Что требуется для доказательства единственности?', ['Показать один построенный пример','Доказать существование и совпадение любых двух подходящих объектов','Измерить расстояние на рисунке'],1,'Единственность — универсальное утверждение о любых двух свидетелях.','Почему построение середины на чертеже не доказывает её единственность?', 'Оно показывает один кандидат. Для единственности нужно взять любую другую точку, удовлетворяющую определению середины, и доказать её совпадение с первой.');
add('m5','Контрпримеры, необходимые условия и индукция','Контрпример опровергает универсальное утверждение; необходимость и достаточность фиксируют направление импликации; индукция доказывает бесконечное семейство случаев.',`
<h2>1. Контрпример</h2><div class="definition"><div class="box-label">Определение</div>Контрпример к универсальному утверждению — объект, удовлетворяющий его предпосылкам, но нарушающий заключение. Одного корректного контрпримера достаточно для опровержения утверждения вида ∀x P(x).</div>
<h2>2. Необходимость и достаточность</h2><div class="table-wrap"><table><thead><tr><th>Фраза</th><th>Формула</th><th>Значение</th></tr></thead><tbody><tr><td>P достаточно для Q</td><td>P → Q</td><td>P гарантирует Q</td></tr><tr><td>P необходимо для Q</td><td>Q → P</td><td>Без P невозможно Q</td></tr><tr><td>P тогда и только тогда, когда Q</td><td>P ↔ Q</td><td>Оба направления</td></tr></tbody></table></div>
<h2>3. Математическая индукция</h2><p>Для утверждения P(n) на натуральных числах доказывают базу P(0) и переход P(n) → P(n+1). Внутри перехода P(n) временно предполагается. Только после получения P(n+1) применяется принцип индукции.</p>
<div class="chain"><div class="chain-title">Структура индукции</div><div class="chain-row"><div class="n">1</div><div><div class="claim">P(0)</div><div class="reason">База.</div></div></div><div class="chain-row"><div class="n">2</div><div><div class="claim">Предположим P(n)</div><div class="reason">Индукционное предположение.</div></div></div><div class="chain-row"><div class="n">3</div><div><div class="claim">Вывести P(n+1)</div><div class="reason">Индукционный переход.</div></div></div><div class="chain-row goal"><div class="n">4</div><div><div class="claim">∀n∈ℕ P(n)</div><div class="reason">По принципу индукции.</div></div></div></div>
<h2>4. Сильная индукция и рекурсия</h2><p>Сильная индукция позволяет использовать все ранее доказанные случаи P(k) для k&lt;n. Она полезна, когда новый случай зависит сразу от нескольких меньших. Индукция тесно связана с рекурсивными определениями натуральных чисел, списков и деревьев; в Lean она реализуется через структурный разбор индуктивного типа.</p>
<div class="warning"><div class="box-label">Проверяй базу</div>Если утверждение начинается с n ≥ 1, база должна быть P(1). Если переход использует P(n−1), нельзя применять его к n=0 без отдельного обоснования.</div>`, 'Что требуется для обычной индукции?', ['Проверить несколько первых чисел','Доказать базу и переход P(n) → P(n+1)','Привести контрпример'],1,'Конечная проверка примеров не заменяет переход для всех n.','Почему обратное к P → Q утверждение Q → P нужно доказывать отдельно?', 'Импликация односторонняя. Истинность следствия может иметь другие причины, не связанные с P. Контрпримером может быть случай, когда Q истинно, а P ложно.');
add('m6','Архитектура приложения: интерфейс, модель и доказательный редактор','GeoProof — не один алгоритм. В приложении взаимодействуют геометрическая модель, состояние доказательства, каталог правил, процедуры аудита и пользовательский интерфейс.',`
<h2>1. Организация репозитория</h2><p>В основной структуре проекта index.html задаёт интерфейс приложения, app.js содержит основную логику, CSS-файлы отвечают за представление, guides.html содержит практическое руководство, а GeLogLean_tutorial.html — отдельный теоретический курс. Файлы KaTeX относятся к отображению математического текста и не являются математическим ядром GeoProof.</p>
<h2>2. Основные слои</h2><div class="table-wrap"><table><thead><tr><th>Слой</th><th>Ответственность</th><th>Не следует смешивать с</th></tr></thead><tbody><tr><td>Геометрическая модель</td><td>Объекты, ограничения и зависимости</td><td>Доказательством теорем</td></tr><tr><td>Proof editor</td><td>Шаги, основания, ссылки и контексты</td><td>Автоматической истинностью свободного текста</td></tr><tr><td>Каталог правил</td><td>Описание аксиом, определений, теорем и правил логики</td><td>Полной реализацией проверяющего алгоритма</td></tr><tr><td>Аудит</td><td>Структурные проверки и поддерживаемые схемы</td><td>Универсальным автоматическим доказателем</td></tr><tr><td>Интерфейс</td><td>Ввод, отображение и навигация</td><td>Источником математической корректности</td></tr></tbody></table></div>
<h2>3. Почему разделение важно</h2><p>Перемещение точки может пересчитать зависимые геометрические объекты. Изменение ссылки в доказательстве запускает другую проверку: доступен ли источник, не нарушена ли область действия, совпадает ли схема правила. Эти операции используют разные состояния и отвечают на разные вопросы.</p>
<h2>4. Как читать исходный код</h2><p>При исследовании конкретной возможности начинай с точки входа интерфейса, проследи обработчик события, структуру данных и функцию проверки. Не делай вывод о поведении программы только из текста кнопки или описания правила в каталоге.</p>
<div class="insight"><div class="box-label">Принцип сопровождения</div>Документация должна соответствовать текущему main. Реальная функция, математическая теория и предлагаемое расширение — три разные категории и должны быть обозначены явно.</div>`, 'Какой слой отвечает за истину геометрической теоремы?', ['Пользовательский интерфейс','Ни один слой сам по себе: требуется математическое доказательство относительно оснований','CSS и подсветка шага'],1,'Интерфейс отображает состояние, а валидатор проверяет только реализованные классы условий. Истинность общего утверждения требует математического обоснования.','Почему нельзя судить о возможностях приложения только по каталогу правил?', 'Каталог может содержать формулировку и подсказки, даже если точный проверяющий алгоритм для данного геометрического правила не реализован. Проверять нужно фактический путь аудита в app.js.' );
add('m6','Геометрическая модель: зависимости, ограничения и вырождения','Динамический чертёж GeoProof — вычисляемая модель связанных объектов; её корректность требует согласованности ссылок и зависимостей.',`
<h2>1. Типы объектов</h2><p>Модель содержит точки, отрезки, окружности, углы и дополнительные геометрические ограничения. Точки могут быть свободными либо зависеть от других объектов: принадлежать отрезку, окружности, быть точками пересечения или удовлетворять нескольким связям одновременно.</p>
<h2>2. Ориентированный граф зависимостей</h2><div class="definition"><div class="box-label">Граф зависимостей</div>Ориентированный граф, в котором ребро A → B означает, что положение или вычисление B зависит от A. Корректный пересчёт требует отсутствия циклов.</div><p>При перемещении родителя нужно пересчитать потомков в корректном порядке. Если точка пересечения зависит от двух окружностей, то изменение центра или радиуса любой из них может изменить число или положение точек пересечения.</p>
<h2>3. Ограничения</h2><p>В модели поддерживаются ограничения параллельности, перпендикулярности, равенства длин и равенства углов. Их проверка опирается на геометрические вычисления по координатам. Для равенства направлений используются отношения между векторами; для перпендикулярности — скалярное произведение; для равенства длин — сравнение норм.</p>
<h2>4. Вырождения</h2><ul><li>Нулевой отрезок, у которого совпали концы.</li><li>Окружность с нулевым или некорректным радиусом.</li><li>Параллельные прямые без единственной конечной точки пересечения.</li><li>Совпадающие прямые с бесконечным множеством общих точек.</li><li>Касание окружностей, при котором имеется одна различная точка пересечения.</li></ul>
<div class="warning"><div class="box-label">Численный допуск</div>Координаты вычисляются численно. Проверка вида «остаток меньше ε» зависит от допуска и текущего состояния. Она не является доказательством общего тождества для всех конфигураций.</div>`, 'Что означает цикл в графе зависимостей?', ['Объект прямо или косвенно зависит от самого себя','Все точки лежат на одной прямой','Равны две длины'],0,'Цикл не задаёт конечный порядок пересчёта объектов.','Почему численная проверка перпендикулярности не доказывает теорему?', 'Она проверяет конкретные координаты с выбранным допуском. Теорема должна следовать из условий для всех допустимых конфигураций, а не только в одном состоянии модели.');
add('m6','Контексты доказательства, ссылки и снятие предположений','Редактор доказательства хранит не только шаги, но и область действия гипотез, от которой зависит законность использования каждого факта.',`
<h2>1. Шаг доказательства</h2><p>Шаг содержит формулировку, основание, ссылки на источники, при необходимости структурированное утверждение и сведения о контексте. Предположение отличается от доказанного факта: оно введено временно и доступно только в локальном поддоказательстве.</p>
<h2>2. Область действия</h2><div class="definition"><div class="box-label">Контекст</div>Локальная область рассуждения, в которой доступны временное предположение и шаги, полученные с его использованием. При закрытии контекста наружу может выйти только заключение соответствующего правила.</div>
<div class="table-wrap"><table><thead><tr><th>Правило</th><th>Временное предположение</th><th>Заключение снаружи</th></tr></thead><tbody><tr><td>→I</td><td>P</td><td>P → Q</td></tr><tr><td>¬I</td><td>P</td><td>¬P после получения ⊥</td></tr><tr><td>RAA</td><td>¬P</td><td>P в классической логике</td></tr><tr><td>∨E</td><td>P и Q в двух ветвях</td><td>Общее R</td></tr><tr><td>∃E</td><td>P(c) со свежим c</td><td>R, не зависящее от c</td></tr></tbody></table></div>
<h2>3. Проверка ссылок</h2><p>Аудитор проверяет, что источник существует, доступен в текущем контексте и не был удалён. Для специальных правил снятия предположений допускаются контролируемые ссылки на локальную гипотезу и заключение закрываемой ветви. Это не разрешает свободно использовать внутренний шаг за пределами его области действия.</p>
<h2>4. Разбор случаев и существование</h2><p>Для ∨E приложение хранит группу из двух отдельных случаев. Для ∃E — группу устранения существования со свежей константой. Если удалить один из опорных элементов группы, связанные шаги и контексты могут стать некорректными, поэтому редактор должен сохранять структурную целостность.</p>
<div class="insight"><div class="box-label">Что нельзя делать</div>Нельзя переносить локальную гипотезу в глобальный список фактов только потому, что её шаг уже отображён или имеет зелёную подсветку. Статус предположения определяется формальной областью действия.</div>`, 'Что становится доступным после закрытия →I?', ['Все внутренние шаги как глобальные факты','Только импликация P → Q','Временная гипотеза P'],1,'Правило импликации снимает P и оставляет доказанное условное утверждение.','Почему внутренний шаг нельзя использовать за пределами его контекста?', 'Потому что он мог зависеть от временного предположения. Вне этого предположения его обоснование недоступно; наружу выводится только заключение правила снятия.');
add('m6','Структура формулы GeoProof и зависимости от источников','Внутренняя формула редактора связывает логический AST с геометрическими объектами и источниками шагов доказательства.',`
<h2>1. Атомы и составные формулы</h2><p>Атом содержит предикат и список термов. Составная формула хранит оператор и дочерние формулы. В приложении представлены and, or, implies, not, forall, exists и bottom. Кванторы дополнительно хранят имя связываемой переменной.</p>
<div class="table-wrap"><table><thead><tr><th>Узел</th><th>Структура</th><th>Проверяемое свойство</th></tr></thead><tbody><tr><td>atom</td><td>predicate + terms</td><td>Предикат и подходящие аргументы</td></tr><tr><td>and / or</td><td>args: [P,Q]</td><td>Две подформулы</td></tr><tr><td>implies</td><td>args: [P,Q]</td><td>Антецедент и консеквент</td></tr><tr><td>not</td><td>args: [P]</td><td>Одна подформула</td></tr><tr><td>forall / exists</td><td>variable + body</td><td>Связывание переменной</td></tr></tbody></table></div>
<h2>2. Формула из источников</h2><p>Часть логических формул строится из ранее введённых шагов. В таком случае редактор хранит идентификаторы исходных шагов. Если исходный шаг удалён, формула может потерять источник. Это должно обнаруживаться как структурная проблема, а не скрываться сохранением старого отображаемого текста.</p>
<h2>3. Нормализация термов</h2><p>Для сравнения формул приложение нормализует некоторые геометрические термы. Например, отрезок может представляться парой концов без зависимости от их порядка. Для симметричных отношений порядок аргументов может быть несущественным. Углы и другие объекты нормализуются с учётом их геометрического определения.</p>
<h2>4. Граница нормализации</h2><p>Нормализация отвечает на вопрос, являются ли два сохранённых выражения одним и тем же объектом в принятом представлении. Она не доказывает геометрическую теорему и не заменяет универсальную алгебраическую нормализацию. В частности, сравнение двух формул не означает, что программа доказала истинность их атомов.</p>
<div class="insight"><div class="box-label">Смысл AST</div>Дерево сохраняет структуру логического выражения; ссылки сохраняют происхождение его частей; нормализация делает сравнение устойчивым к несущественным различиям записи.</div>`, 'Зачем формуле может понадобиться ссылка на исходный шаг?', ['Чтобы сохранить происхождение подформулы и обнаружить удаление источника','Чтобы увеличить размер шрифта','Чтобы автоматически доказать все теоремы'],0,'Источник нужен для целостности и трассируемости формального выражения.','Почему нормализация отрезка не равносильна доказательству равенства длин?', 'Она стабилизирует представление объекта, например не зависит от порядка его концов. Равенство длин — математическое утверждение о величинах, требующее отдельного основания.');
add('m6','Аудит доказательства: правила, статусы и область охвата','Аудитор GeoProof проверяет определённые структурные схемы и целостность ссылок; его статус не следует трактовать как универсальную оценку истинности.',`
<h2>1. Три результата аудита</h2><div class="table-wrap"><table><thead><tr><th>Статус</th><th>Смысл</th><th>Чего не означает</th></tr></thead><tbody><tr><td>checked</td><td>Поддерживаемая схема правила совпала со структурой посылок и заключения</td><td>Что внешние геометрические посылки истинны</td></tr><tr><td>invalid</td><td>Обнаружено структурное нарушение, неправильная ссылка или форма правила</td><td>Что исходная математическая формула обязательно ложна</td></tr><tr><td>review</td><td>Нужна содержательная проверка человеком либо схема пока не проверяется точно</td><td>Что шаг автоматически доказан</td></tr></tbody></table></div>
<h2>2. Какие логические схемы проверяются</h2><p>В app.js реализован отдельный обработчик evaluateLogicalRule. Он проверяет число посылок, корневой оператор AST и совпадение подформул. Например, ∧I требует две посылки и заключение, состоящее ровно из них; modus ponens требует P → Q и P, а заключением должно быть Q.</p>
<p>Также структурно проверяются разбор случаев ∨E, противоречие из пары P и ¬P, введение отрицания, классическое RAA, двойное отрицание, симметрия и транзитивность равенства, правила кванторов и условия свежести.</p>
<h2>3. Геометрические схемы</h2><p>Отдельная функция evaluateAxiomRule содержит точные проверки для ограниченного набора аксиоматических схем, включая единственность прямой через две различные точки, равенство прямых углов, транзитивность равенства и сложение равных величин. Для большинства других геометрических записей каталога аудитор сообщает, что они требуют содержательной проверки.</p>
<h2>4. Что значит «схема совпала»</h2><p>Если форма modus ponens совпала, аудитор установил, что логический переход записан корректно. Но он не доказывает истинность P → Q как внешней посылки. В геометрическом доказательстве посылки могут зависеть от теорем, определений или чертёжных условий, которые требуют самостоятельного обоснования.</p>
<div class="warning"><div class="box-label">Правило доверия</div>Нельзя объединять статусы модели и доказательства. Корректный чертёж не доказывает вывод; корректная форма вывода не доказывает истинность исходных предпосылок.</div>`, 'Что означает checked для логического шага?', ['Весь математический аргумент проверен ядром Lean','Структура поддерживаемой схемы совпала с формулой и ссылками','Все геометрические предпосылки автоматически доказаны'],1,'checked относится к внутренней проверке GeoProof, а не к запуску Lean kernel.','Почему правило из каталога может иметь статус review?', 'Потому что каталог хранит описание и рекомендуемые условия, но валидатор может не иметь точного алгоритма сопоставления всех геометрических предпосылок и заключения.');
add('m7','Lean 4: язык, среда, проект и ядро','Lean 4 — язык программирования и интерактивный помощник доказательств на основе зависимой теории типов.',`
<h2>1. Что делает Lean</h2><p>В Lean определения, математические утверждения и доказательства выражаются формальными объектами. Пользователь может строить доказательство тактиками, но в конечном счёте результат должен быть термом, который имеет заявленный тип. Ядро проверяет это соответствие.</p>
