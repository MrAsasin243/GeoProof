<h2>2. Компоненты среды</h2><div class="table-wrap"><table><thead><tr><th>Компонент</th><th>Ответственность</th></tr></thead><tbody><tr><td>Kernel</td><td>Проверяет тип доказательного терма</td></tr><tr><td>Elaborator</td><td>Разрешает перегрузки, неявные аргументы и тактический синтаксис</td></tr><tr><td>Tactics</td><td>Помогают строить доказательные термы</td></tr><tr><td>Compiler</td><td>Компилирует Lean-код</td></tr><tr><td>Lake</td><td>Управляет сборкой проекта и зависимостями</td></tr><tr><td>Mathlib</td><td>Библиотека математических определений и доказанных теорем</td></tr></tbody></table></div>
<h2>3. Первый файл</h2><pre class="code">theorem identity (P : Prop) : P → P := by
  intro hP
  exact hP</pre><p>Параметр P является пропозицией. Цель — импликация P → P. Тактика intro вводит предположение hP : P, после чего цель P закрывается термом hP.</p>
<h2>4. Проект и воспроизводимость</h2><p>В проекте Lean обычно фиксируют toolchain в файле lean-toolchain, зависимости описывают через Lake, а библиотечные версии фиксируют в конфигурации проекта. Без версии компилятора и зависимостей повторная сборка может стать непредсказуемой.</p>
<div class="warning"><div class="box-label">Текущее состояние GeoProof</div>В исследованной ветке main не было Lean-проекта, конфигурации Lake, файла lean-toolchain, запуска ядра Lean и автоматического экспорта доказательств. Lean в этом учебнике рассматривается как отдельная система и возможное направление интеграции, а не как уже существующая функция приложения.</div>`, 'Какую задачу выполняет ядро Lean?', ['Рисует точки и окружности','Проверяет, что доказательный терм имеет заявленный тип','Автоматически придумывает теорему'],1,'Ядро является критически важной проверяющей частью системы типов.','Зачем фиксировать версию Lean и Mathlib?', 'Изменения языка и библиотек могут влиять на синтаксис, доступные определения и успешность сборки. Фиксация версий обеспечивает воспроизводимость проверки.');
add('m7','Prop, Type и соответствие Карри — Ховарда','Основная идея Lean: пропозиция трактуется как тип, а доказательство — как терм этого типа.',`
<h2>1. Prop — тип пропозиций</h2><p>Запись P : Prop означает, что P является логическим утверждением. Но это не означает, что P уже доказано. Для доказательства нужно предъявить терм h : P. Такое различие между формулой и её доказательством принципиально для формальной верификации.</p>
<h2>2. Соответствие Карри — Ховарда</h2><div class="table-wrap"><table><thead><tr><th>Логическое понятие</th><th>Типовая интерпретация</th><th>Форма доказательства</th></tr></thead><tbody><tr><td>P → Q</td><td>Функция P → Q</td><td>Преобразовать доказательство P в доказательство Q</td></tr><tr><td>P ∧ Q</td><td>And P Q</td><td>Пара доказательств</td></tr><tr><td>P ∨ Q</td><td>Or P Q</td><td>Один из двух конструкторов</td></tr><tr><td>∀ x, P x</td><td>Зависимая функция</td><td>Доказательство для произвольного x</td></tr><tr><td>∃ x, P x</td><td>Exists</td><td>Свидетель и доказательство свойства</td></tr></tbody></table></div>
<h2>3. Импликация как функция</h2><pre class="code">theorem keepLeft (P Q : Prop) : P → Q → P := by
  intro hP
  intro hQ
  exact hP</pre><p>После двух intro в локальном контексте находятся доказательства hP : P и hQ : Q. Цель — P. Доказательство просто возвращает первый аргумент. В логическом прочтении это правило, что из P и Q следует P; в типовом прочтении — функция, возвращающая первый аргумент.</p>
<h2>4. Prop и Type</h2><p>Type используется для типов объектов, функций и структур данных. Prop предназначен для пропозиций. Зависимая теория типов позволяет строить типы, зависящие от значений, что делает возможным формализовать утверждения о конкретных объектах и их свойствах.</p>
<div class="insight"><div class="box-label">Ключевой принцип</div>Тактика может быть сложной и автоматизированной, но доверие опирается на проверку итогового терма ядром, а не на доверие к каждой эвристике тактики.</div>`, 'Что означает P : Prop?', ['P уже доказано','P является пропозицией','P — точка плоскости'],1,'Тип Prop фиксирует категорию утверждения; доказательство — отдельный терм этого типа.','Как прочитать P → Q через Карри — Ховарда?', 'Как функцию, которая принимает терм типа P и возвращает терм типа Q. Тактика intro вводит аргумент этой функции в контекст.');
add('m7','Тактики Lean: intro, exact, apply, constructor и have','Тактики управляют состоянием целей и помогают построить доказательный терм; каждая подцель должна быть закрыта.',`
<h2>1. Цель и контекст</h2><p>В тактическом режиме Lean показывает локальные гипотезы и текущую цель. Например, для P → Q тактика intro вводит новое предположение P и меняет цель на Q. Тактики не добавляют истинность из ничего: они преобразуют задачу доказательства.</p>
<div class="table-wrap"><table><thead><tr><th>Тактика</th><th>Назначение</th><th>Когда полезна</th></tr></thead><tbody><tr><td>intro h</td><td>Вводит предположение или аргумент квантора</td><td>Цель P → Q или ∀ x, P x</td></tr><tr><td>exact h</td><td>Закрывает цель готовым термом</td><td>Есть гипотеза h : P и цель P</td></tr><tr><td>apply thm</td><td>Применяет теорему к текущей цели</td><td>Заключение теоремы совпадает с целью</td></tr><tr><td>constructor</td><td>Разбирает цель по конструкторам</td><td>Например, P ∧ Q</td></tr><tr><td>assumption</td><td>Ищет гипотезу, совпадающую с целью</td><td>Нужный факт уже в контексте</td></tr><tr><td>have h : P := ...</td><td>Вводит промежуточную лемму</td><td>Нужно явно установить вспомогательный факт</td></tr></tbody></table></div>
<h2>2. Конъюнкция</h2><pre class="code">example (P Q : Prop) (hP : P) (hQ : Q) : P ∧ Q := by
  constructor
  · exact hP
  · exact hQ</pre><p>После constructor появляются две цели: доказать P и доказать Q. Точка в тактическом блоке начинает отдельную ветвь.</p>
<h2>3. Равенство</h2><pre class="code">example (a b : Nat) (h : a = b) : b = a := by
  exact h.symm

example (a b : Nat) (h : a = b) : a + 1 = b + 1 := by
  rw [h]</pre><p>rfl закрывает равенство, которое сводится к рефлексивности после вычислительного упрощения. rw [h] переписывает выражение с использованием уже имеющегося равенства. После переписывания может остаться новая цель.</p>
<div class="warning"><div class="box-label">Отладка</div>Если тактика закрывает цель, проверь, почему именно. Если она создаёт подцели, выпиши, что каждая из них означает. Механическое применение тактик без понимания состояния цели затрудняет поиск ошибки.</div>`, 'Какая тактика вводит предположение из P → Q?', ['exact','intro','rfl'],1,'intro вводит аргумент функции-импликации и оставляет цель Q.','Чем apply отличается от exact?', 'exact предъявляет готовый терм целиком. apply применяет теорему к цели и обычно создаёт подцели, соответствующие её предпосылкам.');
add('m7','Логические связки и разбор случаев в Lean','Конструкторы логических типов соответствуют правилам введения; разбор конструктора соответствует правилам устранения.',`
<h2>1. And</h2><pre class="code">example (P Q : Prop) (hP : P) (hQ : Q) : P ∧ Q := by
  exact And.intro hP hQ

example (h : P ∧ Q) : P := by
  exact h.left</pre><p>Конъюнкция содержит два доказательства; из неё можно извлечь каждую часть.</p>
<h2>2. Or и разбор случаев</h2><pre class="code">example (P Q R : Prop) (h : P ∨ Q)
    (hp : P → R) (hq : Q → R) : R := by
  cases h with
  | inl hP => exact hp hP
  | inr hQ => exact hq hQ</pre><p>Дизъюнкция имеет два конструктора. Разбор cases создаёт ветви: в первой доступно доказательство P, во второй — доказательство Q. Обе ветви обязаны закрыть цель R.</p>
<h2>3. Отрицание</h2><p>Not P в Lean эквивалентно функции P → False. Чтобы доказать ¬P, нужно взять гипотезу hP : P и вывести False. Из False можно устранить противоречие и получить цель любого типа.</p>
<h2>4. Классические принципы</h2><p>В Lean конструктивные доказательства не должны без необходимости обращаться к Classical. Для закона исключённого третьего, классического двойного отрицания и некоторых форм доказательства от противного используются явные классические инструменты. Так становится понятно, какая логическая сила нужна теореме.</p>
<div class="insight"><div class="box-label">Соответствие</div>And.intro напоминает ∧I, извлечение left/right — ∧E, Or.inl/inr — ∨I, а разбор cases для Or — ∨E. Но Lean всё равно проверяет итоговый терм в своей системе типов.</div>`, 'Как из hP : P построить P ∨ Q?', ['Or.inl hP','And.intro hP hQ','False.elim hP'],0,'Or.inl — конструктор, который вводит левую сторону дизъюнкции.','Почему из P ∨ Q нельзя получить P без разбора случаев?', 'Потому что имеющееся доказательство могло быть построено правым конструктором, то есть из Q. Без дополнительных условий P не следует.');
add('m7','Кванторы, равенство, структуры и Mathlib','Кванторы и равенство в Lean имеют типовую структуру; пользовательские определения следует согласовывать с уже существующей математической библиотекой.',`
<h2>1. Всеобщность</h2><pre class="code">example {α : Type} (P Q : α → Prop)
    (h : ∀ x, P x → Q x) : ∀ x, P x → Q x := by
  intro x hx
  exact h x hx</pre><p>Для доказательства всеобщности вводится произвольный x. После этого доказывается частный экземпляр P x → Q x.</p>
<h2>2. Существование</h2><pre class="code">example {α : Type} (P : α → Prop)
    (a : α) (ha : P a) : ∃ x, P x := by
  exact ⟨a, ha⟩</pre><p>Свидетель a и доказательство ha образуют доказательство существования.</p>
<h2>3. Определения и структуры</h2><p>def вводит определение; theorem — утверждение с доказательством; structure задаёт тип с именованными полями; namespace группирует имена; import подключает модуль. Структура может включать данные и поля, выражающие доказательства математических свойств.</p>
<pre class="code">structure SegmentData where
  start : Nat
  finish : Nat

def span (s : SegmentData) : Nat :=
  s.finish - s.start</pre><p>Это пример синтаксиса структур, а не геометрическая теория отрезков: тип Nat и вычитание натуральных чисел имеют собственный смысл, который нельзя автоматически считать евклидовой длиной.</p>
<h2>4. Mathlib</h2><p>Mathlib — большая библиотека математических определений и теорем. Перед введением собственного понятия полезно искать существующее, иначе можно создать похожий, но несовместимый тип. При этом наличие Mathlib не означает, что любая конкретная аксиоматика GeoProof уже формализована в нужном виде.</p>
<div class="warning"><div class="box-label">Организация проекта</div>Разделяй определения объектов, аксиомы структуры, вспомогательные леммы и главные теоремы. Чем яснее интерфейсы модулей, тем проще проверить, какие основания использует каждый результат.</div>`, 'Что требуется для доказательства ∃ x, P x в конструктивной форме?', ['Только имя переменной x','Свидетель a и доказательство P(a)','Таблица истинности'],1,'Существование строится парой свидетеля и доказательства его свойства.','Почему перед собственным определением полезно искать соответствующее понятие в Mathlib?', 'Готовое определение уже связано с библиотечными теоремами и типовыми соглашениями. Дублирующее определение может оказаться несовместимым и усложнить повторное использование доказательств.');
add('m8','Формализация геометрии: координатный и аксиоматический подходы','Прежде чем доказывать геометрическую теорему в Lean, нужно определить объекты, отношения и аксиомы выбранной геометрии.',`
<h2>1. Координатная модель</h2><p>Можно определить точку как пару вещественных чисел, прямую — через уравнение, расстояние — через евклидову метрику, а принадлежность — через выполнение уравнения. Такой подход позволяет использовать алгебру и анализ. Однако синтетическое утверждение затем может потребовать доказательства через координатные определения.</p>
<h2>2. Абстрактная аксиоматика</h2><p>Другой путь — ввести типы Point и Line, отношение LiesOn и аксиомы инцидентности. Затем добавляются порядок, конгруэнтность, параллельность и другие необходимые свойства. Теорема доказывается относительно этих параметров и аксиом.</p>
<pre class="code">structure IncidencePlane where
  Point : Type
  Line : Type
  LiesOn : Point → Line → Prop
  two_points_determine_line :
    ∀ A B : Point, A ≠ B →
      ∃ l : Line, LiesOn A l ∧ LiesOn B l</pre>
<p>Это лишь учебный фрагмент сигнатуры и аксиомы существования прямой. Для полной аксиомы требуется также единственность. Для полноценной евклидовой плоскости этого поля недостаточно: нужны остальные группы аксиом.</p>
<h2>3. Теоремы и минимальные предположения</h2><p>Если теорема использует лишь инцидентность, её желательно формулировать относительно минимальной структуры. Если она опирается на аксиому параллельных, это должно быть отражено в типе или контексте. Так Lean помогает увидеть, какие предпосылки действительно необходимы.</p>
<h2>4. Проверка модели</h2><p>Координатную реализацию можно использовать как пример модели абстрактной системы. Если все аксиомы выполняются в конкретной интерпретации, это демонстрирует совместимость этих аксиом с исходной теорией, на которой построена модель. Но модель не заменяет синтетическое доказательство каждого общего утверждения.</p>
<div class="warning"><div class="box-label">Не объявляй каркас полной теорией</div>Наличие Point, Line и LiesOn не означает, что формализована геометрия Евклида. Без аксиом порядка, конгруэнтности и параллельности многие привычные теоремы просто не имеют достаточного основания.</div>`, 'Что необходимо для формализации теоремы о параллельных?', ['Только тип Point','Типы объектов, отношение параллельности и необходимые аксиомы','Только готовый рисунок'],1,'Теорема имеет смысл относительно сигнатуры и аксиоматических оснований.','Чем отличается модель геометрии от абстрактной аксиоматики?', 'Аксиоматика описывает класс структур, удовлетворяющих определённым условиям. Модель — конкретная структура, в которой эти условия выполнены.');
add('m8','Перенос GeoProof → Lean: соответствие и потери информации','Перенос рассуждения между GeoProof и Lean требует согласовать объекты, формулы, типы, контексты и основания; текстового копирования недостаточно.',`
<h2>1. Сопоставление представлений</h2><div class="table-wrap"><table><thead><tr><th>Слой</th><th>GeoProof</th><th>Lean</th></tr></thead><tbody><tr><td>Геометрическая точка</td><td>Объект JS-модели с идентификатором</td><td>Элемент типа Point</td></tr><tr><td>Отношение</td><td>Атом AST с предикатом и термами</td><td>Функция в Prop</td></tr><tr><td>Связка</td><td>Узел AST и схема аудита</td><td>Конструктор пропозиции</td></tr><tr><td>Временное предположение</td><td>Контекст доказательства</td><td>Локальная гипотеза или аргумент функции</td></tr><tr><td>Ссылка на шаг</td><td>Идентификатор шага</td><td>Имя леммы или терма</td></tr><tr><td>Каталоговое правило</td><td>Описание основания и метаданные</td><td>Теорема/аксиома с формальной типовой сигнатурой</td></tr></tbody></table></div>
<h2>2. Смысл перевода</h2><p>Имя точки A должно стать элементом правильного типа. Утверждение «A лежит на l» должно стать пропозицией, например LiesOn A l. Если в GeoProof шаг хранит только свободный текст, его нельзя автоматически считать готовой формулой Lean: сначала нужно определить структуру утверждения и типы аргументов.</p>
<h2>3. Контексты</h2><p>Поддоказательство GeoProof, в котором временно принято P, концептуально соответствует доказательству функции P → Q или ветви разбора. Однако конкретные форматы и правила снятия контекста различаются. Автоматический перенос должен сохранять, какие шаги зависят от предположения и где оно закрывается.</p>
<h2>4. Разные гарантии</h2><p>Статус checked в GeoProof означает, что собственная проверка приложения распознала поддерживаемую схему. Он не является термом Lean. Чтобы получить гарантию Lean, нужно сформировать корректный Lean-код и успешно провести проверку ядром в заданном проекте.</p>
<div class="warning"><div class="box-label">Состояние проекта</div>В изученной версии GeoProof нет автоматического экспорта AST в Lean и нет вызова Lean kernel. Описываемый мост является методикой будущей интеграции, а не уже работающей функцией приложения.</div>`, 'Можно ли использовать статус checked GeoProof как готовый результат Lean?', ['Да, это одно и то же','Нет, Lean должен проверить свой собственный терм доказательства','Только если в доказательстве есть треугольник'],1,'Внутренний аудит GeoProof и проверка ядром Lean — разные процедуры.','Почему для экспорта нужно знать типы геометрических объектов?', 'Lean проверяет корректность типов. Текстовая ссылка на точку, отрезок или угол не сообщает, какому формальному типу принадлежит объект и какие отношения для него допустимы.');
add('m8','Практика формализации: от математического текста к Lean-коду','Надёжная формализация начинается с точной постановки, а не с попытки сразу подобрать тактику.',`
<h2>1. Сначала сформулируй математическое утверждение</h2><p>Укажи тип каждого объекта, предпосылки и цель. Например, в логической модели утверждение «из P и Q следует P» можно записать так:</p>
<pre class="code">example (P Q : Prop) (hP : P) (hQ : Q) : P := by
  exact hP</pre>
<p>До тактики важно понять, что означает каждый аргумент. P и Q — пропозиции, hP и hQ — доказательства этих пропозиций, цель — вернуть доказательство P.</p>
<h2>2. Разложи доказательство на леммы</h2><p>Большую теорему стоит разбить на промежуточные утверждения, каждое из которых имеет чёткий смысл. Леммы могут выражать свойства модели, результаты об отношениях инцидентности или равенство вспомогательных величин. Это уменьшает сложность целей и делает зависимости проверяемыми.</p>
<h2>3. Строить по одному обязательству</h2><p>После intro, apply или constructor читай каждую новую цель. Если goal содержит переменную другого типа, чем ожидалось, это обычно указывает на ошибку формулировки или на пропущенный аргумент. Не следует подавлять ошибку чрезмерным упрощением.</p>
<h2>4. Сравнение с GeoProof</h2><p>В GeoProof пользователь вручную связывает шаг с основанием и предыдущими шагами. В Lean формальный терм непосредственно выражает эти зависимости. Хороший перенос должен сохранять логическую структуру, а не просто повторять последовательность строк редактора.</p>
<h2>5. Минимальный цикл</h2><ol><li>Сформулировать типы и предикаты.</li><li>Записать теорему с явными параметрами.</li><li>Открыть предположения и разложить цель.</li><li>Ввести промежуточные леммы с понятными именами.</li><li>Закрыть все подцели.</li><li>Собрать проект и проверить терм ядром.</li></ol>`, 'Что лучше сделать до выбора тактик?', ['Сначала точно описать типы объектов, предпосылки и цель','Скопировать весь текст доказательства в одну строку','Удалить все гипотезы из контекста'],0,'Без точной постановки тактики работают с неверно определённой целью.','Зачем разбивать длинное доказательство на леммы?', 'Леммы локализуют обязательства, уменьшают сложность каждой цели и делают зависимости явными. Это облегчает чтение, повторное использование и диагностику.');
add('m8','Доверие к доказательствам: корректность, тестирование и аудит','Машинная проверка усиливает доверие к доказательству, но лишь в пределах формализованной теории и доверенной базы.',`
<h2>1. Что именно проверяет машина</h2><p>Для формальной системы необходимо различать корректность формулы, корректность структуры вывода, истинность исходных аксиом в предполагаемой модели и корректность работы самого проверяющего механизма. Ядро Lean проверяет терм относительно правил теории типов; оно не решает за пользователя, соответствует ли формальная модель реальному математическому замыслу.</p>
<h2>2. Доверенная база</h2><p>Доверенная база включает ядро, реализацию elaboration и используемые аксиоматические допущения в пределах установленной архитектуры. Тактики могут быть сложными: если они строят неверный терм, ядро должно его отвергнуть. Однако добавление непроверенных аксиом или внешних допущений меняет, что именно доказано.</p>
<h2>3. Тестирование формализации</h2><ul><li>Проверяй граничные случаи: совпадающие точки, вырожденные отрезки, касание и отсутствие пересечения.</li><li>Ищи контрмодели к неверным формулировкам.</li><li>Проверяй, что теорема не зависит от скрытой аксиомы.</li><li>Используй независимые модели и отдельные формулировки ключевых лемм, если это полезно.</li><li>Пересобирай проект после изменения определений и библиотек.</li></ul>
<h2>4. Ошибка в формализации против ошибки в доказательстве</h2><p>Lean может успешно доказать теорему, которая неверно отражает исходную задачу: например, условие перепутано или область квантификации слишком узкая. Формальная проверка подтверждает вывод из записанных предпосылок, а не правильность перевода человеческого намерения в формулу.</p>
<div class="warning"><div class="box-label">Граница ответственности</div>Машинная проверка не отменяет необходимость правильно выбрать определения, аксиомы, модель и формулировку цели. Она делает вывод проверяемым относительно этих решений.</div>`, 'Что гарантирует успешная проверка терма Lean?', ['Что математик правильно перевёл задачу на формальный язык во всех отношениях','Что терм имеет заявленный тип в рамках используемой системы и допущений','Что формальная система описывает физическую реальность'],1,'Ядро проверяет формальную корректность терма относительно заданной теории.','Почему даже полностью проверенное доказательство может не отвечать исходной задаче?', 'Потому что сама формализация могла неверно выразить намерение: например, потерять предпосылку, изменить область квантификации или задать слишком слабую цель.');
add('m8','Воспроизводимость, документация и дальнейший маршрут','Качественное доказательство должно быть воспроизводимым: другой человек должен восстановить задачу, основания, зависимости и версию формальной среды.',`
<h2>1. Что фиксировать</h2><ul><li>Исходную постановку задачи без неявных условий.</li><li>Выбранную аксиоматику и типы объектов.</li><li>Определения и используемые библиотечные модули.</li><li>Промежуточные леммы и зависимости между ними.</li><li>Версии Lean и Mathlib, настройки проекта и способ сборки.</li><li>Контрпримеры и граничные случаи, которые проверялись.</li></ul>
<h2>2. Документация — часть математической работы</h2><p>Для каждого определения полезно указать, зачем оно вводится, какие свойства обеспечивает и какие результаты от него зависят. Для теоремы — перечислить предпосылки, точное заключение, доказательную стратегию и связанные леммы. Для программного валидатора — описать конкретный охват тестов и ограничения.</p>
<h2>3. Первоисточники и справочники</h2><ul><li><a href="https://lean-lang.org/doc/reference/latest/" target="_blank" rel="noopener">The Lean Language Reference</a> — справочник языка Lean.</li><li><a href="https://docs.lean-lang.org/theorem_proving_in_lean4/" target="_blank" rel="noopener">Theorem Proving in Lean 4</a> — последовательное введение в формальные доказательства.</li><li><a href="https://leanprover-community.github.io/mathlib4_docs/" target="_blank" rel="noopener">Mathlib documentation</a> — поиск математических определений и теорем.</li><li><a href="https://www.euclids-elements.org/elements/books/bookI/" target="_blank" rel="noopener">Евклид, Начала, Книга I</a> — исходный материал классической геометрии.</li><li><a href="https://plato.stanford.edu/entries/natural-deduction/" target="_blank" rel="noopener">Stanford Encyclopedia: Natural Deduction</a> — философские и формальные основы натурального вывода.</li></ul>
<h2>4. Маршрут углубления</h2><p>После курса полезно перейти от чтения к самостоятельной работе: сформулировать небольшую аксиоматическую структуру, доказать несколько свойств равенства и инцидентности, реализовать логические связки в Lean, а затем формализовать одну несложную геометрическую теорему. В GeoProof параллельно можно проверить, какие именно шаги редактор аудирует структурно, а какие остаются на содержательной проверке.</p>
<div class="insight"><div class="box-label">Итоговый критерий</div>Доказательство считается качественно оформленным, когда постановка, основания, переходы, формальные типы и воспроизводимая проверка не требуют догадок со стороны читателя.</div>`, 'Что нужно сохранить для воспроизводимости Lean-проекта?', ['Только название теоремы','Версии Lean и библиотек, определения, зависимости и конфигурацию сборки','Только скриншот итоговой цели'],1,'Без версии инструментария и зависимостей нельзя надёжно повторить проверку.','Почему документация программного валидатора должна описывать ограничения?', 'Иначе пользователь может принять статус частичной структурной проверки за доказательство более широкого математического утверждения. Документация должна точно отражать реально реализованный охват.');

add("m6","Инструмент «Выбор»: перемещение независимых и зависимых точек","Режим выбора работает с существующей моделью. Движение свободной и зависимой точки принципиально различается.","<h2>1. Что делает этот инструмент или метод</h2><p>Выбор выделяет объект для перемещения и изменения. Свободная точка имеет независимые координаты; зависимая должна сохранять заданную связь с родителем.</p><h2>2. Рабочая последовательность</h2><ol><li>Переключись на «Выбор», затем щёлкни по свободной точке и перетащи её.</li><li>Создай точку на отрезке и попробуй сдвинуть её. Она должна оставаться на отрезке.</li><li>Создай точку на окружности и перемести её вдоль границы.</li><li>Передвигай родителя зависимой точки и наблюдай пересчёт положения.</li><li>При неожиданном поведении открой список объектов и посмотри тип и родительские связи.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>Создай свободные A и B, отрезок AB и точку P на AB. При переносе A точка P останется на новом AB. Положение P не свободно: оно ограничено её зависимостью.</div><h2>4. Контрольный список</h2><ul><li>Свободная точка двигается по плоскости.</li><li>Точка на отрезке остаётся на нём.</li><li>Точка на окружности остаётся на окружности.</li><li>Перемещение родителя обновляет потомков.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Перетаскивать объект не в режиме выбора.</li><li>Считать вычисляемую точку независимой.</li><li>Игнорировать родительские связи.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Как ведёт себя точка, прикреплённая к отрезку?",["Свободно уходит с отрезка", "Остаётся на отрезке", "Автоматически удаляет отрезок"],1,"Зависимая точка должна удовлетворять отношению инцидентности после изменения родителей.","Объясни, чем свободная точка отличается от точки пересечения.","Свободная точка имеет независимое положение. Точка пересечения вычисляется по двум родителям; она существует только когда эти объекты имеют действительное пересечение.");
add("m6","Инструмент «Группа»: перенос связной конфигурации","Группа перемещает связанную часть геометрической модели, а не только один объект.","<h2>1. Что делает этот инструмент или метод</h2><p>Связная компонента объединяет объекты через общие точки, зависимости и активные ограничения. Перенос группы позволяет сохранять форму конфигурации.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай треугольник ABC и добавь точку M на AB.</li><li>Включи режим «Группа». Щёлкни по части связной конфигурации и перетащи её.</li><li>Проверь, что зависимые точки пересчитались, а отношения внутри группы сохранились.</li><li>Создай отдельную несвязанную точку D и проверь, что она не перемещается с группой.</li><li>Сравни результат с режимом «Рука»: тот перемещает область просмотра, а не геометрию.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>Перенеси треугольник с точкой середины стороны. Отрезки и середина должны двигаться как одна связная конфигурация. Независимая точка в стороне останется на месте.</div><h2>4. Контрольный список</h2><ul><li>В группу попали только связанные объекты.</li><li>Внутренние отношения не изменились.</li><li>Несвязанные объекты не смещаются.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Путать группу с выделением произвольных объектов.</li><li>Использовать группу для панорамирования.</li><li>Ожидать переноса визуально близких, но независимых объектов.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что определяет состав группы?",["Расстояние между элементами на экране", "Связи объектов и ограничения модели", "Цвет объектов"],1,"Группировка основана на математической связности, а не на визуальном расстоянии.","Почему два рядом стоящих объекта могут не входить в одну группу?","Потому что они могут не иметь общих точек, зависимостей или ограничений. Их близость на экране не создаёт связь в модели.");
add("m6","Инструмент «Рука»: камера, панорамирование и масштаб","Панорамирование и масштабирование меняют вид доски, не меняя геометрическую модель.","<h2>1. Что делает этот инструмент или метод</h2><p>Рука предназначена для навигации по рабочей поверхности. Координаты математических объектов независимы от положения камеры и экранных пикселей.</p><h2>2. Рабочая последовательность</h2><ol><li>Выбери «Рука» и перетащи пустую область доски.</li><li>Измени масштаб колёсиком или кнопками +/−.</li><li>Нажми сброс вида, чтобы восстановить положение и масштаб камеры.</li><li>На компьютере проверь Space+перетаскивание, если фокус не в поле ввода; поддерживаются также средняя/правая кнопки мыши.</li><li>После панорамирования выбери точку и сравни отношения с соседними объектами.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>Построй отрезок AB. Запомни его длину в модели, затем увеличь масштаб и сдвинь доску. Отрезок будет занимать больше пикселей и окажется в другой части экрана, но его математическая длина останется прежней.</div><h2>4. Контрольный список</h2><ul><li>Геометрические координаты не меняются.</li><li>Масштаб меняет экранное изображение.</li><li>Сброс вида не удаляет объекты.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Перемещать точку вместо камеры.</li><li>Считать пиксели единицами длины.</li><li>Искать сброс вида в меню удаления объектов.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Изменяет ли «Рука» координаты точек модели?",["Да, сдвигает точки", "Нет, меняет только видимую область", "Удаляет зависимые точки"],1,"Рука управляет камерой, а не геометрическими объектами.","Почему нужно разделять координаты модели и экрана?","Экранное отображение зависит от разрешения, масштаба и панорамирования. Математическая модель должна сохранять свойства при любом размере окна и положении камеры.");
add("m6","Инструмент «Точка»: свободное создание и привязка","Точка может быть свободной или зависеть от отрезка/окружности. Повторное использование существующей точки создаёт связи, а не дубликаты.","<h2>1. Что делает этот инструмент или метод</h2><p>Инструмент «Точка» работает контекстно: щелчок в пустом месте создаёт свободную точку, щелчок по объекту — зависимую, а выбор существующей точки позволяет добавить связь.</p><h2>2. Рабочая последовательность</h2><ol><li>Щёлкни инструментом «Точка» по пустому месту — появится свободная точка.</li><li>Щёлкни по отрезку — появится точка на отрезке; проверь её перемещением родителя.</li><li>Щёлкни по окружности — получишь точку на её границе.</li><li>Чтобы добавить связь существующей точке, сначала выбери точку, затем соответствующий отрезок.</li><li>Для точки на нескольких линиях добавляй связи последовательно и проверяй каждую.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>Создай точку P на AB, затем добавь к P отношение принадлежности CD. Теперь положение P должно одновременно удовлетворять двум условиям. Геометрически это может соответствовать пересечению; если ограничения несовместимы, проверь конфигурацию.</div><h2>4. Контрольный список</h2><ul><li>Свободная точка не имеет родителя.</li><li>Зависимая точка хранит связь с объектом.</li><li>Существующая точка повторно используется, а не дублируется.</li><li>Совместимость всех связей проверена.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ставить новую точку рядом вместо выбора существующей.</li><li>Смешивать точку на окружности с точкой внутри круга.</li><li>Добавлять несовместимые ограничения.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что создаёт щелчок по пустому месту инструментом «Точка»?",["Свободную точку", "Прямую", "Шаг доказательства"],0,"Пустое место создаёт точку с независимыми координатами.","Как понять, что точка зависимая?","Открой список объектов и проверь родительские связи. Затем перемести родителя: если точка пересчитывается, зависимость влияет на её положение.");
add("m6","Инструмент «Отрезок»: общие вершины и сегментная связность","Отрезок соединяет две точки. Общие вершины нужно переиспользовать, иначе геометрически касающиеся линии могут остаться разными объектами.","<h2>1. Что делает этот инструмент или метод</h2><p>Отрезок — объект с двумя концами. Его модель хранит ссылки на точки, поэтому общие концы должны быть именно теми же объектами.</p><h2>2. Рабочая последовательность</h2><ol><li>Выбери «Отрезок» и щёлкни по первой существующей точке.</li><li>Укажи вторую точку. Если щёлкнуть по пустому месту, редактор создаст конечную точку.</li><li>Для ломаной или треугольника при построении следующих сторон выбирай уже существующие вершины.</li><li>Перемести общую вершину и проверь, что все связанные отрезки обновились.</li><li>Открой список объектов и убедись, что дубликаты не появились.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>Создай A, B, C и AB, BC, CA. Получается треугольный контур. Если вместо общей B создать B′ рядом с B, визуально стык будет почти незаметен, но AB и B′C не имеют общей вершины.</div><h2>4. Контрольный список</h2><ul><li>У отрезка две конечные точки.</li><li>Общие вершины переиспользуются.</li><li>Перемещение вершины обновляет все связанные отрезки.</li><li>Нет случайных нулевых отрезков.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Создавать точки с почти одинаковыми координатами.</li><li>Путать пересечение линий с общей вершиной.</li><li>Не проверять список объектов.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Почему одинаковые координаты не гарантируют, что вершины совпадают как объекты?",["У них могут быть разные идентификаторы и зависимости", "Потому что координаты всегда округляются", "Потому что точки не имеют идентификаторов"],0,"Модель использует идентичность объектов и ссылки на них, а не только экранное положение.","Как гарантировать общую вершину для двух отрезков?","При построении второго отрезка выбери ту же существующую точку, а затем проверь ссылки на неё в списке объектов.");
add("m6","Инструмент «Треугольник»: три вершины и невырожденность","Треугольник — не просто три соединённые линии. Для обычного треугольника вершины должны быть различными и неколлинеарными.","<h2>1. Что делает этот инструмент или метод</h2><p>Построение треугольника задаётся тремя точками. Вырождение нужно проверять отдельно: три маркера на экране ещё не гарантируют невырожденную фигуру.</p><h2>2. Рабочая последовательность</h2><ol><li>Выбери «Треугольник» и укажи вершины A, B, C в нужном порядке.</li><li>Используй уже существующие точки, если они должны быть общими с другими объектами.</li><li>Проверь, что все вершины различны.</li><li>Перемести C к прямой AB и посмотри, как конфигурация приближается к вырожденной.</li><li>Не используй теоремы о площади и сумме углов в вырожденной конфигурации без отдельного анализа.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>A=(0,0), B=(4,0), C=(1,3) задают невырожденный треугольник. При C=(2,0) все три точки коллинеарны, площадь равна нулю, и привычный треугольник вырождается.</div><h2>4. Контрольный список</h2><ul><li>Три различные вершины.</li><li>Точки неколлинеарны.</li><li>Порядок вершин соответствует обозначению.</li><li>Используются общие точки модели.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Повторить одну вершину.</li><li>Считать рисунок доказательством невырожденности.</li><li>Путать площадь почти нулевую и точную нулевую из-за округления.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Как определить вырожденный треугольник?",["Его вершины коллинеарны или некоторые совпадают", "Он имеет прямой угол", "У него есть медиана"],0,"Коллинеарные или совпадающие вершины не задают обычную двумерную треугольную область.","Почему условия невырожденности нужно записывать в доказательстве?","Они могут быть предпосылками теорем: ненулевые стороны, существование углов и внутренняя область. Без этих условий формулировка может оказаться неверной или неопределённой.");
add("m6","Инструмент «Окружность»: центр и два способа задания радиуса","Окружность строится от центра, а радиус можно задать числом либо расстоянием до существующей точки.","<h2>1. Что делает этот инструмент или метод</h2><p>Различие между числовым радиусом и точкой, задающей радиус, влияет на то, как окружность будет меняться при редактировании.</p><h2>2. Рабочая последовательность</h2><ol><li>Первый щелчок задаёт центр O.</li><li>Вторым щелчком выбери существующую точку R — радиус равен OR.</li><li>Либо щёлкни по пустому месту: радиус будет задан численно.</li><li>Перемести центр и проверь обновление окружности.</li><li>Для числового радиуса измени размер окружности перетаскиванием её границы; для заданного точкой радиуса перемести R.</li><li>Отличай точку на окружности от точки внутри круга.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div>Сравни два случая: окружность с центром O и радиусом OR; окружность с центром O и числом r=3. В первом случае движение R меняет радиус, во втором — изменяй радиус на самой границе.</div><h2>4. Контрольный список</h2><ul><li>Центр выбран первым.</li><li>Радиус положительный.</li><li>Понятен способ задания радиуса.</li><li>Положение зависимых точек пересчитывается.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Путать окружность и круг.</li><li>Считать точку внутри окружности точкой на границе.</li><li>Использовать нулевой радиус как обычную окружность.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что задаёт первый клик инструмента «Окружность»?",["Центр", "Точку касания", "Угол"],0,"Первый щелчок задаёт центр, второй — числовой радиус или точку на радиусе.","Почему OnCircle(P,c) не равносильно «P внутри круга»?","Для окружности расстояние от P до центра равно радиусу. Для внутренней точки расстояние меньше радиуса. Это разные предикаты и разные условия.");
add("m6","Инструмент «Середина»: зависимая точка и два подотрезка","Как построить середину отрезка и понять, почему она сохраняется при перемещении концов.","<h2>1. Что делает этот инструмент или метод</h2><p>Середина M отрезка AB определяется равенствами AM = MB и принадлежностью M отрезку AB. В GeoProof операция не просто ставит маркер посередине на экране: она создаёт точку типа midpoint, чьё положение вычисляется из концов родительского отрезка. Модель автоматически добавляет два подотрезка от A до M и от M до B. Поэтому при изменении AB середина перемещается вместе с ним.</p><h2>2. Рабочая последовательность</h2><ol><li>Сначала создай точки A и B и соедини их инструментом «Отрезок». Убедись, что в списке объектов есть исходный отрезок AB.</li><li>Выбери инструмент «Середина».</li><li>Щёлкни по самому отрезку AB, а не рядом с ним и не по одной из его конечных точек.</li><li>Дождись появления точки M. В списке объектов проверь, что создана зависимая середина и два подотрезка.</li><li>Вернись к инструменту «Выбор» и перетащи A или B. Наблюдай, как M остаётся серединой, а не сохраняет старые экранные координаты.</li><li>Проверь результат численно или геометрически: M должна лежать между A и B, а отрезки AM и MB должны иметь одинаковую длину.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Построй AB, затем создай M как середину. Перетащи B вправо и вверх. Если длина и направление AB изменились, M должна оказаться в середине нового положения AB. Это проверяет не красоту картинки, а наличие зависимости M от A и B.</p><p>Математически, если A=(x₁,y₁), B=(x₂,y₂), то M=((x₁+x₂)/2,(y₁+y₂)/2). Средняя точка получается вычислением, а не отдельным произвольным выбором координат.</p></div><h2>4. Контрольный список</h2><ul><li>M создана инструментом «Середина», а не поставлена вручную.</li><li>В списке видны исходный отрезок и два подотрезка.</li><li>После перемещения любого конца M всё ещё делит отрезок пополам.</li><li>Понимаешь разницу между созданием объекта и доказательством равенства AM=MB.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Создать свободную точку около визуального центра и принять её за середину.</li><li>Забыть, что M зависит от исходного отрезка, и пытаться перемещать её как свободную точку.</li><li>Принять автоматическое построение середины за завершённое доказательство геометрической теоремы.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что является главным математическим свойством объекта, созданного инструментом «Середина»?",["Это точка с фиксированными экранными координатами.", "Это точка, вычисляемая как середина родительского отрезка.", "Это свободная точка, которая лишь выглядит центральной.", "Это доказательство теоремы о медиане."],1,"Верно: объект связан с концами отрезка, и его положение пересчитывается.","Если точка действительно вычисляется из концов, то изменение исходного отрезка автоматически переносит и её. Именно это отличает зависимый объект от свободной точки.","Координатная формула середины и зависимый характер объекта делают построение устойчивым к перемещению концов. Но утверждение о середине в доказательстве всё равно требует корректного основания и логического шага.");
add("m6","Инструмент «Открепить»: управление зависимостями точки","Снятие одной связи точки с отрезком без удаления самой точки и остальных её связей.","<h2>1. Что делает этот инструмент или метод</h2><p>Зависимая точка может принадлежать одному или нескольким отрезкам. Инструмент «Открепить» нужен, когда требуется снять конкретную связь. Важно не путать удаление точки и снятие отношения: точка должна остаться, а прочие связи сохраняются. Это действие меняет геометрическую модель, поэтому после него нужно проверить список зависимостей.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай свободную точку P и несколько отрезков, проходящих через неё, либо привяжи P к двум отрезкам инструментом «Точка / связи».</li><li>Выбери инструмент «Открепить».</li><li>Укажи точку P и затем тот отрезок, связь с которым требуется снять. Если несколько отрезков проходят через маркер, повторный выбор точки помогает обратиться к следующей связи.</li><li>Проверь список объектов и связей: P не должна исчезнуть, а не затронутые зависимости должны остаться.</li><li>Перемести родительский отрезок, от которого точку открепили, и наблюдай: P больше не обязана двигаться вместе с ним.</li><li>Затем проверь, что оставшиеся связи продолжают ограничивать положение P.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Пусть P была общей точкой двух линий l и m. Сними связь P с m, сохранив связь с l. После этого перемещение l по-прежнему влияет на допустимое положение P, а m уже не должна удерживать P на себе. Так можно понять, что меняется именно отношение принадлежности, а не сама точка.</p></div><h2>4. Контрольный список</h2><ul><li>Точка P осталась в модели.</li><li>Снята только выбранная связь.</li><li>Оставшиеся связи перечислены и ведут себя ожидаемо.</li><li>Понимаешь, чем «открепить» отличается от «удалить».</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ожидать, что точка исчезнет: инструмент не предназначен для удаления объекта.</li><li>Снять не ту связь, потому что несколько объектов визуально перекрываются.</li><li>После операции не проверить, какие зависимости сохранились.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что должно произойти при снятии одной связи точки с отрезком?",["Удаляется сама точка и все её связи.", "Точка остаётся, выбранная связь снимается, другие связи сохраняются.", "Отрезок обязательно удаляется.", "Все связи точки превращаются в визуальные отметки."],1,"Верно: операция адресована одной зависимости и сохраняет остальные элементы.","Модель нужно мыслить как сеть объектов и отношений. Изменение одного ребра этой сети не тождественно удалению узла.","Инструмент позволяет менять структуру зависимостей локально. После редактирования проверь связность модели и доступность точки.");
add("m6","Инструмент «Параллельность»: активное геометрическое ограничение","Создание связи между двумя отрезками, при которой целевой отрезок сохраняет параллельное направление.","<h2>1. Что делает этот инструмент или метод</h2><p>Параллельность в GeoProof — не только знак на чертеже. При работе инструментом выбирается сначала исходный отрезок, затем целевой. Конец целевого отрезка становится зависимым, поэтому при изменении исходной геометрии направление цели согласуется с направлением источника. Это ограничение влияет на построение, но не заменяет доказательство того, что нужные прямые параллельны в математической задаче.</p><h2>2. Рабочая последовательность</h2><ol><li>Построй два отрезка AB и CD с разными направлениями. Оставь достаточно свободного места, чтобы видеть оба.</li><li>Выбери инструмент «Параллельность».</li><li>Щёлкни по исходному отрезку AB. Он задаёт направление-образец.</li><li>Щёлкни по целевому отрезку CD. Порядок выбора важен: второй отрезок будет изменён под условие.</li><li>Перетащи независимые точки исходного отрезка и наблюдай за поведением цели.</li><li>Открой список объектов и проверь наличие активного ограничения. Не делай вывод о доказанности теоремы только по параллельному виду.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>AB направлен вправо-вверх, CD — вправо-вниз. Примени инструмент, выбрав AB первым, CD вторым. После операции измени наклон AB. Целевой CD должен перестраиваться так, чтобы его направление оставалось параллельным AB. Если перепутать порядок, источником станет другой отрезок.</p></div><h2>4. Контрольный список</h2><ul><li>Сначала выбран источник, затем цель.</li><li>Целевой отрезок изменён ограничением, а не только нарисованной отметкой.</li><li>После перемещения источника направление цели обновляется.</li><li>Различаешь активное ограничение и доказательство параллельности.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Выбирать отрезки в обратном порядке и удивляться, какой из них изменился.</li><li>Считать графический маркер параллельности самостоятельным доказательством.</li><li>Игнорировать то, что конец целевого отрезка может быть зависимым.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","В каком порядке выбирают отрезки для ограничения параллельности?",["Сначала целевой, затем исходный.", "Сначала исходный, затем целевой.", "Порядок не важен, программа сама выбирает.", "Нужно указать три точки."],1,"Верно: первый объект задаёт направление, второй подчиняется ограничению.","Механизм «источник → цель» задаёт направленную зависимость. Понимание роли каждого объекта помогает избежать неожиданного изменения не того отрезка.","Параллельность — отношение между направлениями. В редакторе оно активно поддерживается геометрической моделью, а в доказательстве должно отдельно следовать из посылок и аксиом.");
add("m6","Инструмент «Перпендикулярность»: прямой угол как ограничение","Как зафиксировать прямой угол между исходным и целевым отрезками и проверить поведение зависимости.","<h2>1. Что делает этот инструмент или метод</h2><p>Перпендикулярные прямые образуют угол 90°. В GeoProof операция выбирает исходный отрезок, затем целевой. Целевой конец становится зависимым, чтобы отношение прямого угла сохранялось при перестроении. Это удобный способ получить конфигурацию для исследования, но он не доказывает автоматически теорему о перпендикулярности.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай отрезки AB и CD, которые не образуют прямой угол.</li><li>Выбери инструмент «Перпендикулярность».</li><li>Укажи AB как исходный отрезок.</li><li>Укажи CD как целевой. Посмотри, как меняется направление целевого отрезка.</li><li>Измени положение исходного отрезка, перемещая его независимые концы. Целевой должен адаптироваться, сохраняя прямой угол.</li><li>Проверь результат измерением угла или перпендикулярной отметкой и отдельно подумай, какое утверждение понадобится в доказательстве.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>После ограничения перетащи точку B так, чтобы AB повернулся. Целевой CD должен оставаться под прямым углом к AB. Если целевой отрезок нельзя свободно перемещать как раньше, это ожидаемо: его конец управляется ограничением.</p></div><h2>4. Контрольный список</h2><ul><li>Выбор сделан в правильном порядке.</li><li>Прямой угол сохраняется при движении исходного отрезка.</li><li>Целевой конец понимается как зависимый.</li><li>В доказательстве перпендикулярность записывается отдельным утверждением с основанием.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Путать визуальную отметку прямого угла с активным ограничением.</li><li>Перемещать зависимый конец в надежде, что он останется свободным.</li><li>Думать, что созданное ограничение доказывает условие задачи независимо от его основания.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какое поведение ожидается от целевого отрезка после применения перпендикулярности?",["Он сохраняет исходное направление навсегда.", "Его направление перестраивается, чтобы оставаться перпендикулярным источнику.", "Он удаляется.", "Он становится окружностью."],1,"Верно: целевой сегмент подчинён геометрическому ограничению и обновляется при изменении источника.","Активное ограничение задаёт поведение модели во времени. В математическом доказательстве нужно обосновать, почему именно рассматриваемые объекты перпендикулярны.","Построение прямого угла и доказательство прямого угла — разные задачи. Первое управляет конфигурацией, второе объясняет её математическую необходимость.");
add("m6","Инструмент «Равная длина»: перенос длины между отрезками","Активная связь длин двух отрезков при сохранении направления целевого сегмента.","<h2>1. Что делает этот инструмент или метод</h2><p>Инструмент равной длины переносит численную длину исходного отрезка на целевой. Сначала выбирается источник, затем цель. Целевой конец становится зависимым: его положение перестраивается так, чтобы длины совпадали, при этом направление целевого отрезка сохраняется. Не следует путать равную длину с совпадением самих отрезков: они могут находиться в разных местах и иметь разные направления.</p><h2>2. Рабочая последовательность</h2><ol><li>Построй два отрезка AB и CD разной длины.</li><li>Выбери инструмент «Равная длина».</li><li>Укажи отрезок AB первым: это образец длины.</li><li>Укажи CD вторым: он станет целевым.</li><li>Измени длину AB, переместив один из его независимых концов.</li><li>Наблюдай, как CD меняет длину, сохраняя собственное направление. Измерь оба отрезка и сравни значения.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>AB имеет длину 5 условных единиц, CD — 2. Выбери AB, затем CD. После наложения ограничения целевой сегмент должен стать длиной 5. Поверни AB или удлини его: CD должен отслеживать новую длину, но не обязан занимать то же место или иметь то же направление.</p></div><h2>4. Контрольный список</h2><ul><li>Выбран источник, затем цель.</li><li>Длины совпадают после ограничения.</li><li>После изменения источника длина цели обновляется.</li><li>Понимаешь, что равенство длин не означает совпадение отрезков.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Перепутать равенство длин с равенством координат концов.</li><li>Ожидать, что целевой отрезок изменит направление.</li><li>Забыть, что целевой конец может стать зависимым от ограничения.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что означает активное ограничение равной длины?",["Два отрезка занимают одно и то же место.", "Целевая длина следует за длиной исходного отрезка.", "Отрезки обязаны быть параллельными.", "Программа доказала равенство любых связанных отрезков."],1,"Верно: поддерживается равенство меры длины, а не совпадение расположения.","Равенство геометрических величин — отношение между измерениями объектов. Оно не означает равенства самих объектов как точечных множеств.","После операции сравнивай численные длины и отдельно исследуй направление. В доказательстве выбери соответствующее определение или теорему и укажи посылки.");
add("m6","Инструмент «Пересечение»: построение общих точек объектов","Поиск пересечений двух отрезков и/или окружностей и понимание зависимых точек пересечения.","<h2>1. Что делает этот инструмент или метод</h2><p>Пересечение — объект, который определяется одновременно двумя родителями. Для выбранных пар инструмент создаёт все действительные общие точки. Для двух отрезков вычисления используют несущие прямые, поэтому точка пересечения может лежать на продолжении отрезков, за пределами их видимых частей. Если после перемещения родители перестают пересекаться, зависимая точка может временно стать недоступной и скрыться вместе с зависимыми построениями.</p><h2>2. Рабочая последовательность</h2><ol><li>Построй два непараллельных отрезка AB и CD, пересекающихся внутри видимой области.</li><li>Выбери инструмент «Пересечение».</li><li>Последовательно укажи первый и второй объект. Для отрезков и окружностей выбирай именно их контуры.</li><li>Проверь, создалась ли одна или несколько точек пересечения. Если объектов несколько, убедись, что выбрана нужная пара.</li><li>Перемещай родительские точки. Следи за тем, как точка пересечения перемещается вслед за обоими родителями.</li><li>Раздвинь объекты так, чтобы пересечение исчезло, затем верни его. Наблюдай за временной недоступностью и восстановлением зависимой точки.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Две несущие прямые могут пересекаться в точке X, хотя сам отрезок AB заканчивается раньше X. Это не ошибка вычисления: редактор использует бесконечные прямые, содержащие отрезки. Поэтому при решении задачи обязательно проверь, требуется ли пересечение именно отрезков или прямых.</p><p>Вторая демонстрация: две окружности могут иметь две общие точки, одну точку касания или не иметь общих точек. Количество точек меняется при перемещении центров и радиусов.</p></div><h2>4. Контрольный список</h2><ul><li>Пара объектов выбрана правильно.</li><li>Проверено число действительных пересечений.</li><li>Учтено различие между отрезком и несущей прямой.</li><li>Понимаешь, что точка пересечения зависит от обоих родителей и может исчезнуть.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Считать, что пересечение несущих прямых всегда лежит внутри обоих отрезков.</li><li>Пытаться свободно перемещать точку пересечения независимо от родителей.</li><li>Принимать временно скрытое пересечение за удалённую свободную точку.</li><li>Не проверять касание и отсутствие пересечения окружностей.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Почему точка пересечения двух отрезков иногда появляется за пределами видимых отрезков?",["Это всегда баг отрисовки.", "Потому что пересечение может вычисляться для несущих прямых, содержащих отрезки.", "Потому что точка создаётся свободной.", "Потому что окружность автоматически продлевает отрезок."],1,"Верно: используемая геометрическая операция находит пересечение несущих прямых; оно не обязано лежать на самих отрезках.","Математически отрезок AB — ограниченная часть прямой. Прямая — бесконечный объект. Пересечение прямых и пересечение отрезков — разные задачи.","При построении и доказательстве всегда фиксируй область объекта: точка на несущей прямой не автоматически принадлежит отрезку. В задачах это различие часто является существенным.");
add("m6","Инструмент «Угол»: вершина, лучи и меньшая величина","Построение угла по трём точкам и чтение порядка вершин.","<h2>1. Что делает этот инструмент или метод</h2><p>Угол ABC задаётся двумя лучами BA и BC с общей вершиной B. Поэтому порядок точек принципиален: первая и третья точки задают стороны, средняя — вершину. GeoProof показывает величину меньшего угла в градусах. Измеренное значение помогает исследовать рисунок, но само по себе не доказывает равенство или конкретную величину угла.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай три неколлинеарные точки A, B и C так, чтобы B находилась между концами двух лучей по смыслу построения угла.</li><li>Выбери инструмент «Угол».</li><li>Щёлкни точки строго в порядке A, затем B, затем C.</li><li>Проверь, что вершина обозначена как B и отображаемый угол образован лучами BA и BC.</li><li>Перемещай A или C и наблюдай изменение величины. Перемести B и проверь, что угол строится от новой вершины.</li><li>Запиши отдельно геометрическое утверждение, которое можно было бы доказывать: например, ∠ABC = ∠DEF.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Точки расположены так: A слева, B в центре, C выше и справа. Тройка A–B–C задаёт угол при B. Если выбрать B–A–C, вершиной окажется A, то есть получится уже другой угол. Сравни два порядка и объясни, почему совпадение буквенных наборов не означает одинаковую вершину.</p></div><h2>4. Контрольный список</h2><ul><li>Средняя точка выбрана как вершина.</li><li>Понимаешь, что стороны — лучи из вершины к двум другим точкам.</li><li>Знаешь, что показывается меньший угол.</li><li>Не используешь измерение как единственное основание доказательства.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Выбирать точки в случайном порядке.</li><li>Считать первой точкой вершину.</li><li>Путать меньший угол с ориентированным углом или рефлексным углом.</li><li>Принимать показание в градусах за формальное доказательство.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","В тройке A, B, C какая точка является вершиной угла ABC?",["A", "B", "C", "Все три одновременно"],1,"Верно: средняя буква обозначает вершину угла.","Название угла фиксирует его структуру: две стороны BA и BC встречаются в точке B.","При чтении обозначений угла всегда находи среднюю букву. Это предотвращает путаницу при создании отношений равенства углов.");
add("m6","Инструмент «Равные углы»: перенос угловой величины","Как связать два угла и понять, почему у целевого угла изменяется луч.","<h2>1. Что делает этот инструмент или метод</h2><p>Для первого угла указываются три точки A,B,C, для второго — D,E,F. Средние точки B и E являются вершинами. GeoProof создаёт активное ограничение: конечный луч второго угла становится зависимым, его длина сохраняется, а величина угла следует за первым. Значит, цель перестраивается относительно источника. Равенство углов не означает, что их стороны совпадают или параллельны.</p><h2>2. Рабочая последовательность</h2><ol><li>Построй две тройки точек A,B,C и D,E,F, образующие углы разной величины.</li><li>Выбери инструмент «Равные углы».</li><li>Укажи три точки первого угла в порядке A, B, C. Точка B — вершина.</li><li>Укажи три точки второго угла в порядке D, E, F. Точка E — вершина целевого угла.</li><li>Проверь, как изменилось направление конечного луча второго угла. Его длина должна сохраняться, а величина — согласовываться с первым углом.</li><li>Измени первый угол и наблюдай за вторым. Проверь, что отношение поддерживается динамически.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Сделай ∠ABC равным примерно 40°, а ∠DEF — примерно 80°. Примени ограничение, указав сначала ABC, затем DEF. После этого измени ABC до 60°. Целевой угол должен перестроиться, сохраняя длину своего конечного луча.</p></div><h2>4. Контрольный список</h2><ul><li>Порядок первого и второго трёхточечного угла соблюдён.</li><li>Средняя точка каждой тройки — вершина.</li><li>Изменяется именно целевой луч второго угла.</li><li>Понимаешь, что равные углы могут иметь разные положения и направления.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Путать вершины B и E с концами лучей.</li><li>Переставить порядок углов: тогда изменится источник и цель.</li><li>Ожидать совпадения сторон или положения углов.</li><li>Считать созданное ограничение доказательством внешнего утверждения.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какая часть второго угла становится зависимой при создании ограничения равенства углов?",["Вершина E обязательно переносится в B.", "Конечный луч второго угла перестраивается, а его длина сохраняется.", "Первый угол удаляется.", "Оба угла должны занять одно и то же место."],1,"Верно: целевой луч приспосабливается к величине исходного угла, не требуя совпадения расположения.","Ограничение переносит скалярную угловую величину, сохраняя длину целевого луча. Геометрическое расположение углов остаётся отдельным вопросом.","Экспериментируй с разными ориентациями. После этого формулируй математическое равенство углов и подбирай основание доказательства, а не ссылайся на факт применения инструмента.");
add("m6","Инструмент «Биссектриса»: деление угла на две равные части","Пошаговое построение биссектрисы и понимание роли точки пересечения со стороной.","<h2>1. Что делает этот инструмент или метод</h2><p>Биссектриса угла — луч, выходящий из вершины и делящий угол на два равных угла. GeoProof просит три точки A, B, C в порядке сторон угла ABC: B является вершиной. Инструмент создаёт биссектрису и точку её пересечения со стороной AC. Поэтому до построения удобно иметь треугольник или хотя бы две стороны угла.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай точки A, B и C так, чтобы лучи BA и BC образовывали угол.</li><li>Выбери инструмент «Биссектриса».</li><li>Укажи точку A, затем вершину B, затем точку C.</li><li>Проверь, что появился отрезок или луч из B и точка пересечения с AC.</li><li>Измерь углы по обе стороны биссектрисы: они должны совпадать.</li><li>Перемести A или C. Наблюдай, как биссектриса и её пересечение с AC перестраиваются.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Пусть ∠ABC равен 80°. После построения биссектрисы BD ожидается ∠ABD = ∠DBC = 40°. Точка D лежит на стороне AC в типичном треугольном расположении. Если угол тупой или геометрия устроена иначе, следи за фактической точкой пересечения, а не предполагай её положение заранее.</p></div><h2>4. Контрольный список</h2><ul><li>Точки выбраны в порядке A–B–C.</li><li>B распознана как вершина исходного угла.</li><li>Создана точка пересечения биссектрисы со стороной AC.</li><li>Проверено равенство половин угла.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ставить вершину первой или третьей точкой.</li><li>Путать биссектрису с медианой или высотой.</li><li>Предполагать, что любая линия из вершины делит угол пополам.</li><li>Игнорировать случай, когда продолжение или пересечение геометрически недоступно.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какое свойство определяет биссектрису угла?",["Она делит противоположную сторону пополам.", "Она делит угол на два равных угла.", "Она перпендикулярна противоположной стороне во всех треугольниках.", "Она всегда проходит через центр описанной окружности."],1,"Верно: биссектриса делит величину угла на две равные части.","Медиана делит сторону, высота задаёт перпендикуляр, а биссектриса делит угол. Названия похожи по месту применения, но определения различны.","После построения подпиши полученные углы и сформулируй равенство. Для доказательства проверь определение биссектрисы и порядок объектов.");
add("m6","Инструмент «Медиана»: вершина и середина противоположной стороны","Как построить медиану и не спутать её с биссектрисой или высотой.","<h2>1. Что делает этот инструмент или метод</h2><p>Медиана треугольника соединяет вершину с серединой противоположной стороны. GeoProof просит выбрать вершину, затем противоположную сторону. Затем создаётся середина этой стороны и отрезок медианы. Медиана не обязана быть перпендикулярной стороне и не обязана делить угол пополам.</p><h2>2. Рабочая последовательность</h2><ol><li>Построй невырожденный треугольник ABC.</li><li>Выбери инструмент «Медиана».</li><li>Щёлкни по вершине A.</li><li>Щёлкни по противоположной стороне BC. Не выбирай сторону AB или AC.</li><li>Проверь появление середины M на BC и отрезка AM.</li><li>Измени форму треугольника. Проверь, что M остаётся серединой BC и медиана соединяет именно её с A.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Для треугольника ABC медиана из A — это AM, где M является серединой BC. Следовательно, BM = MC и M принадлежит BC. При этом AM может наклоняться под любым углом к BC: требование перпендикулярности отсутствует.</p></div><h2>4. Контрольный список</h2><ul><li>Выбрана вершина треугольника.</li><li>Выбрана сторона, не содержащая эту вершину.</li><li>Точка M является серединой выбранной стороны.</li><li>Понимаешь, почему медиана отличается от высоты и биссектрисы.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Выбирать сторону, прилегающую к вершине, вместо противоположной.</li><li>Считать медиану обязательно перпендикулярной стороне.</li><li>Путать «делит сторону пополам» с «делит угол пополам».</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что обязательно верно для медианы AM треугольника ABC?",["AM ⟂ BC.", "M — середина BC.", "∠BAM = ∠MAC.", "AM равно BC."],1,"Верно: медиана соединяет вершину с серединой противоположной стороны.","Определение медианы содержит условие о середине стороны и не требует прямого угла или равенства углов.","Для любой задачи сначала выпиши определение. Оно сразу показывает, какие данные нужно построить и что можно использовать в доказательстве.");
add("m6","Инструмент «Высота»: перпендикуляр и основание на продолжении стороны","Построение высоты и понимание того, почему основание иногда находится вне треугольника.","<h2>1. Что делает этот инструмент или метод</h2><p>Высота треугольника — перпендикуляр, опущенный из вершины на прямую, содержащую противоположную сторону. Основание высоты не всегда лежит на самом отрезке стороны: в тупоугольном треугольнике оно может лежать на продолжении. GeoProof позволяет выбрать вершину, затем отрезок, задающий основание; вычисленная точка проекции может находиться вне его видимого диапазона.</p><h2>2. Рабочая последовательность</h2><ol><li>Построй треугольник ABC. Сначала выбери остроугольную форму, чтобы увидеть привычный случай.</li><li>Выбери инструмент «Высота».</li><li>Укажи вершину A, затем противоположную сторону BC.</li><li>Проверь точку H основания и отрезок AH: он должен быть перпендикулярен несущей прямой BC.</li><li>Измени форму треугольника так, чтобы угол B или C стал тупым. Повтори или перестрой высоту из подходящей вершины.</li><li>Наблюдай, что H может оказаться на продолжении BC. Это не ошибка: высота проводится к прямой, а не обязательно к ограниченному отрезку.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>В остроугольном треугольнике основание высоты из A часто находится внутри BC. В тупоугольном треугольнике высота из одной из острых вершин может падать на продолжение противоположной стороны. Проверь перпендикулярность к несущей прямой и не делай вывод о принадлежности отрезку BC только из того, что это основание высоты.</p></div><h2>4. Контрольный список</h2><ul><li>Выбрана вершина и противоположная сторона.</li><li>Проверено условие перпендикулярности.</li><li>Различаешь прямую, содержащую сторону, и сам отрезок стороны.</li><li>Можешь объяснить случай внешнего основания высоты.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Путать высоту с медианой или биссектрисой.</li><li>Считать, что основание высоты всегда находится внутри треугольника.</li><li>Проверять прямой угол только на глаз.</li><li>Не учитывать продолжение стороны.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","В каком случае основание высоты может лежать вне отрезка противоположной стороны?",["Никогда.", "В тупоугольном треугольнике для некоторых высот.", "Только в равностороннем треугольнике.", "Только если сторона равна нулю."],1,"Верно: высота проводится к несущей прямой стороны; основание может оказаться на продолжении.","Отрезок BC — ограниченная часть прямой. Перпендикуляр из A может встретить прямую за пределами отрезка BC.","В задачах с высотами аккуратно различай принадлежность прямой и принадлежность отрезку. Многие ошибочные доказательства незаметно подменяют одно другим.");
add("m6","Инструмент «Удалить»: безопасное изменение геометрической модели","Удаление объекта, влияние на зависимые объекты и проверка результата.","<h2>1. Что делает этот инструмент или метод</h2><p>Удаление отличается от перемещения и открепления. При выборе точки, отрезка или окружности редактор должен удалить объект и обработать связанные ограничения и зависимости. Если объект был родителем других, производные объекты могут стать недействительными или быть удалены/освобождены в зависимости от вида связи. Перед удалением полезно понять роль объекта в конфигурации.</p><h2>2. Рабочая последовательность</h2><ol><li>Сохрани текущий проект перед экспериментом, если в нём есть важная работа. Используй Ctrl+S, чтобы скачать JSON.</li><li>Создай небольшую конфигурацию: две точки, отрезок между ними и зависимую точку-середину.</li><li>Выбери инструмент «Удалить».</li><li>Щёлкни по объекту, который требуется удалить. Начни с вспомогательного отрезка в отдельном тестовом построении.</li><li>Проверь список объектов, геометрическое отображение и диагностику модели.</li><li>Отмени действие через Ctrl+Z, если результат был экспериментальным и нужно вернуть исходную конфигурацию.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Создай AB и середину M. Удаление исходного объекта может затронуть зависимую конструкцию. Поэтому сначала попробуй удалить несущественный объект в тестовой копии и посмотри, какие элементы исчезли или изменили состояние. В рабочей задаче до удаления выясни, какие доказательные шаги ссылаются на этот объект.</p></div><h2>4. Контрольный список</h2><ul><li>Перед рискованным удалением сохранена копия проекта.</li><li>Понимаешь, какой объект выбран.</li><li>Проверены зависимые построения и ограничения.</li><li>Знаешь сочетание Ctrl+Z для отмены последнего действия.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Удалять ключевую точку, не проверив зависимые объекты.</li><li>Путать удаление с откреплением одной связи.</li><li>Считать, что удаление геометрического объекта автоматически удаляет или исправляет текст доказательства.</li><li>Не сохранять проект до рискованного экспериментирования.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что следует проверить после удаления объекта, который использовался в зависимых построениях?",["Ничего: остальные объекты гарантированно не затронуты.", "Список объектов, зависимые построения, ограничения и связанные доказательные шаги.", "Только цвет фона.", "Только масштаб камеры."],1,"Верно: удаление родителя может повлиять на всю цепочку зависимостей, а доказательная структура является отдельной частью проекта.","Геометрическая модель — граф объектов и связей. Удаление узла может изменить доступность всех объектов, которые от него зависят. Доказательные шаги не тождественны геометрическим объектам.","Для безопасной работы используй резервную копию и отмену действия. После удаления проверь и геометрию, и доказательство, поскольку они не обязаны автоматически синхронизироваться по смыслу.");
add("m6","Рабочее пространство доказательства: условие, цель и порядок работы","Первое занятие в редакторе доказательств: как превратить текст задачи в план рассуждения.","<h2>1. Что делает этот инструмент или метод</h2><p>Доказательство начинается не с нажатия кнопки «Добавить шаг», а с точного разделения исходных данных и того, что требуется получить. Условие — набор принятых посылок. Цель — конкретное утверждение, которое нужно вывести. Чертёж помогает назвать объекты и исследовать отношения, но не является автоматически списком истинных посылок. В GeoProof условие и цель можно задать независимо от наличия геометрических построений.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой рабочее пространство и перейди в выдвижное меню доказательства.</li><li>Выбери редактирование условия задачи. Запиши дано обычным ясным текстом: имена объектов и отношения между ними. Не добавляй свойства, которые лишь выглядят верными на чертеже.</li><li>Заполни поле цели одним точным математическим утверждением. Например, «BM = MC», если требуется доказать, что M — середина BC (при наличии принадлежности M∈BC в данных или отдельном шаге).</li><li>До добавления вывода выпиши промежуточные факты, которые могут понадобиться. Расположи их в порядке зависимости: посылки → определения/теоремы → промежуточные выводы → цель.</li><li>При необходимости построй геометрическую конфигурацию. Проверь, что имена и отношения совпадают с текстом задачи.</li><li>Открой вкладку с доказательством и начинай добавлять шаги только после того, как можешь объяснить, откуда должен появиться каждый факт.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Задача: «M — середина AB. Докажите, что AM = MB». В условии нужно явно указать, что M — середина AB. Цель — AM=MB. Из определения середины следует сразу два свойства: M принадлежит AB и AM=MB. Поэтому доказательство может состоять из одного содержательного шага, основанного на определении середины.</p><p>Обрати внимание: если в условии написано только «M лежит на AB», равенство AM=MB из этого не следует. Это пример того, почему нельзя подменять посылку красивым рисунком.</p></div><h2>4. Контрольный список</h2><ul><li>Условие содержит только данные задачи.</li><li>Цель записана отдельно и однозначно.</li><li>Имена точек совпадают с чертежом.</li><li>Каждый планируемый шаг имеет предполагаемое основание.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Вписывать требуемую цель в условие, а затем считать её доказанной.</li><li>Делать вывод из того, что рисунок выглядит симметричным.</li><li>Записывать цель расплывчато: например, «доказать свойства треугольника».</li><li>Добавлять шаги до понимания, какие зависимости они должны иметь.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Почему условие задачи и цель нужно записывать отдельно?",["Чтобы увеличить количество строк интерфейса.", "Чтобы отличить принятые посылки от утверждения, которое ещё требуется вывести.", "Потому что цель всегда истинна по построению.", "Потому что геометрический чертёж не может содержать точек."],1,"Верно: условие — входные данные рассуждения, цель — его требуемый результат.","Если не разделить данные и заключение, доказательство становится круговым: искомый факт незаметно принимается как уже известный.","Хорошее доказательство начинается с формальной постановки задачи. До вывода цели проверь, что она не была внесена как посылка и что все дополнительные гипотезы действительно даны.");
