add("m6","Редактор шага: утверждение, основание, пояснение и ссылки","Пошаговое заполнение формы доказательства и смысл каждого поля.","<h2>1. Что делает этот инструмент или метод</h2><p>Каждый шаг рассуждения — это не просто строка текста. Важны четыре элемента: утверждение (что установлено), основание (почему это допустимо), ссылки (какие предыдущие факты используются) и пояснение (как конкретно правило применено). Отметка «цель» помогает обозначить заключение, но не заменяет проверку его вывода. Порядок шагов должен отражать математическую зависимость.</p><h2>2. Рабочая последовательность</h2><ol><li>Нажми «Добавить шаг» в доказательном редакторе.</li><li>Сформулируй утверждение как короткое математическое предложение: например, «AM = MB». Не добавляй в одну строку сразу несколько независимых выводов.</li><li>Выбери тип основания: условие, определение, аксиома, теорема, ранее доказанный факт, построение, логическое правило или временное предположение.</li><li>В каталоге выбери конкретное правило, если оно применимо. Внимательно прочитай его предусловия и заключение.</li><li>В списке предыдущих шагов отметь ровно те посылки, которые используются. Не добавляй ссылки «на всякий случай».</li><li>В пояснении назови, какая часть основания даёт нужное заключение. При необходимости отметь шаг как целевой и сохрани его.</li><li>После сохранения раскрой подробности шага и проверь, не потерялся ли смысл основания или ссылки.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Пусть шаг 1: «M — середина AB» (дано). Шаг 2: «AM = MB» (определение середины, ссылка на шаг 1). Для второго шага объяснение должно называть определение, а не повторять фразу «потому что это верно». Этот пример показывает, как одна строка превращается в структуру «факт + основание + зависимость».</p></div><h2>4. Контрольный список</h2><ul><li>Утверждение выражает один математический факт.</li><li>Тип и конкретное основание соответствуют содержанию.</li><li>Ссылки ведут на доступные и нужные шаги.</li><li>Пояснение говорит, почему основание подходит.</li><li>Не спутана отметка цели с автоматической истинностью.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ставить ссылку на заключение, которое ещё не было получено.</li><li>Выбирать теорему по названию, не сверяя её условия.</li><li>Писать в основании «очевидно» вместо реального правила.</li><li>Добавлять множество неиспользуемых ссылок.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что именно объясняет поле «основание» шага?",["Цвет и расположение строки в интерфейсе.", "Почему данное утверждение допустимо получить из известных фактов или исходных правил.", "Как программа рисует геометрический объект.", "Где сохранён HTML-файл."],1,"Верно: основание указывает математический источник перехода.","Шаг доказательства обоснован не потому, что он записан после предыдущего шага. Нужна конкретная логическая или геометрическая причина.","Для каждой строки проверяй цепочку: что утверждаю → на каком основании → из каких доступных посылок → почему условия правила выполнены.");
add("m6","Конструктор типизированных утверждений: объекты, шаблоны и AST","Когда выбирать готовый математический шаблон, а когда свободный текст.","<h2>1. Что делает этот инструмент или метод</h2><p>GeoProof позволяет формировать некоторые утверждения структурированно: выбрать тип отношения или свойства, затем указать геометрические объекты. Такой шаблон хранит не только надпись, но и предикат с термами нужных типов. Это отличается от свободного текста: фраза «AB равно CD» сама по себе не сообщает программе, какие символы являются отрезками и какое отношение задано. Однако типизированная запись всё равно не доказывает автоматически математическую истинность утверждения.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой редактор шага и найди блок «Сформировать утверждение».</li><li>Посмотри список типов: отношения отрезков и точек, углов, окружностей; свойства треугольников; логические связки.</li><li>Найди нужный шаблон поиском, например «равенство отрезков» или «середина».</li><li>Выбери объекты в указанном порядке. Сверь типы: нельзя подставить окружность туда, где ожидается точка.</li><li>Прочитай предпросмотр сформированной формулы. Убедись, что порядок вершин и обозначения правильны.</li><li>Сохрани утверждение как шаг, затем отдельно укажи основание и предыдущие посылки.</li><li>Если нужного математического выражения нет в списке, используй свободный текст, но считай его непрозрачным для автоматической семантической проверки.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Чтобы записать «M — середина AB», недостаточно ввести произвольную строку. Выбери шаблон отношения «точка — середина отрезка», затем точку M и отрезок AB. Предпросмотр должен отражать именно эту пару объектов. Теперь структура может отличать точку от отрезка, хотя правильность применения основания всё ещё проверяется отдельно.</p></div><h2>4. Контрольный список</h2><ul><li>Выбран шаблон, соответствующий смыслу утверждения.</li><li>Все обязательные объекты заданы в правильном порядке.</li><li>Их типы подходят аргументам шаблона.</li><li>Предпросмотр совпадает с предполагаемым математическим утверждением.</li><li>Основание и ссылки добавлены независимо от шаблона.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Считать красивую формулу доказанной только потому, что она создана конструктором.</li><li>Перепутать порядок вершин треугольника или точки — отрезка.</li><li>Полагать, что произвольная фраза автоматически превращается в AST.</li><li>Заполнять шаблон объектами неверного типа.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что даёт типизированный конструктор утверждений?",["Полную автоматическую проверку истины любого математического факта.", "Структурированную запись предиката и аргументов с заданными типами объектов.", "Автоматический выбор всех недостающих теорем.", "Автоматическое преобразование всего свободного текста в формулы."],1,"Верно: конструктор делает структуру формулы явной, но не доказывает истинность её содержания.","В AST предикат и его аргументы разделены. Это позволяет проверять типы и структуру, не пытаясь угадывать смысл произвольного текста.","Учись различать три вопроса: правильно ли записана формула, корректно ли применено правило, истинны ли геометрические предпосылки. Это три независимых уровня.");
add("m6","Каталог математической базы: аксиомы, определения, теоремы и логика","Как искать основание вывода и читать его условия, заключение и диапазон посылок.","<h2>1. Что делает этот инструмент или метод</h2><p>Каталог математической базы объединяет разные типы источников. Аксиомы и постулаты принимаются в рамках выбранной теории; определения задают значение терминов; теоремы являются доказанными утверждениями; логические правила задают допустимые переходы между формулами. У записи каталога есть описание предусловий, заключения и пояснение, но приложение не сопоставляет за пользователя все геометрические объекты с математическими условиями теоремы.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой вкладку «Математическая база» в рабочем пространстве доказательства.</li><li>Просмотри категории: исходные данные, построения, аксиомы и постулаты, определения, теоремы, логические правила.</li><li>Используй поиск по ключевому слову: например «середина», «равнобедренный», «Пифагор» или «транзитивность».</li><li>Открой карточку правила и прочитай, какие условия требуются. Перепиши их в виде списка «нужно знать».</li><li>Сравни условие задачи и доступные шаги с этим списком. Если хотя бы одно обязательное условие не установлено, пока нельзя применять теорему.</li><li>Только после этого выбери карточку как основание шага и укажи конкретные ссылки на посылки.</li><li>Если правило лишь похоже по названию, но не совпадает по предпосылкам, не используй его. Вернись к плану и найди промежуточную лемму.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Теорема о равных углах при основании равнобедренного треугольника требует, чтобы две стороны треугольника были равны. Сам факт, что треугольник на экране выглядит равнобедренным, не является предпосылкой. Нужно либо получить равенство сторон из условия или предыдущего доказательства, либо выбрать другой путь.</p></div><h2>4. Контрольный список</h2><ul><li>Различаешь аксиому, определение, теорему и логическое правило.</li><li>Умеешь найти нужную запись поиском.</li><li>Можешь своими словами перечислить её предпосылки.</li><li>Проверяешь каждую предпосылку до выбора теоремы.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Выбирать карточку по одному только совпадающему названию.</li><li>Принимать каталог как автоматический геометрический решатель.</li><li>Путать определение, которое вводит понятие, с теоремой, которую нужно доказывать.</li><li>Игнорировать обязательную предпосылку.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что нужно сделать перед применением теоремы из каталога?",["Выбрать её, потому что она упоминает нужный объект.", "Проверить, что все её предпосылки уже известны или доказаны.", "Нарисовать фигуру как можно точнее.", "Поставить галочку «Цель»."],1,"Верно: теорема применима только при выполнении всех условий.","Правило вывода имеет форму «если P₁,…,Pₙ, то Q». Пропуск хотя бы одной посылки делает переход необоснованным.","Каталог помогает находить теоретический источник, но математическую проверку условий выполняет пользователь. Это особенно важно для геометрических теорем.");
add("m6","Основания и ссылки: как не допустить логический разрыв","Практика построения цепочки зависимостей, где каждый вывод имеет явные предпосылки.","<h2>1. Что делает этот инструмент или метод</h2><p>Ссылки на предыдущие шаги показывают локальную зависимость вывода. Если строка использует два равенства, в неё должны быть включены ссылки на оба равенства. Если теорема требует равенства двух сторон и общий угол, должны быть доступны именно эти три предпосылки. Наличие ссылки само по себе не доказывает, что выбранные посылки математически подходят: нужно сверить содержание формул с условиями правила.</p><h2>2. Рабочая последовательность</h2><ol><li>Возьми короткую задачу с несколькими посылками. Сформулируй каждую отдельно.</li><li>Построй предполагаемую цепочку на бумаге: какие факты нужны для первого промежуточного вывода, какие — для второго.</li><li>Добавь исходные факты в GeoProof как шаги с основанием «условие задачи».</li><li>Для каждого нового утверждения выбери конкретное правило и отметь только используемые ссылки.</li><li>Раскрой зависимости шага и проверь, что они ведут к тем утверждениям, которые перечислены в доказательстве правила.</li><li>Попробуй убрать одну ссылку. Объясни, какое условие правила стало недоступно. Затем верни ссылку.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Дано: AB = AC и ∠B = ∠C. Требуется, например, установить соответствующее свойство треугольника. Для применения конкретного правила равенства треугольников недостаточно просто выбрать три «похожие» строки: необходимо указать обе пары соответствующих сторон и соответствующий угол именно в правильном порядке. Прежде чем нажимать «Сохранить», выпиши соответствие вершин.</p></div><h2>4. Контрольный список</h2><ul><li>Каждая посылка представлена отдельным шагом или явно указана как данное.</li><li>Для вывода выбрано правило с подходящей схемой.</li><li>Ссылки содержат все нужные посылки и не содержат лишних.</li><li>Порядок объектов соответствует формулировке правила.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ссылаться на визуальный объект вместо шага, подтверждающего математический факт.</li><li>Считать, что приложение проверяет семантическое соответствие посылок автоматически.</li><li>Смешивать порядок вершин двух треугольников.</li><li>Пропускать промежуточную лемму, на которую опирается основное правило.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что подтверждает ссылка из одного шага доказательства на другой?",["Что программа независимо доказала истинность обоих шагов.", "Что один шаг объявляет другой своим источником/зависимостью; математическую применимость ещё нужно проверить.", "Что чертёж является точным масштабным изображением.", "Что все шаги вне текущего контекста доступны."],1,"Верно: ссылка фиксирует зависимость, но не отменяет проверки содержания.","Структурный граф доказательства отвечает на вопрос «откуда шаг берёт посылки?», а не на вопрос «истинны ли все геометрические утверждения?»","Всегда делай два прохода: сначала проверяй граф ссылок, затем независимо сверяй математическую схему вывода с содержанием каждой формулы.");
add("m6","Временные предположения и поддоказательства: идея локального контекста","Как доказывать импликацию и отрицание с помощью временного предположения.","<h2>1. Что делает этот инструмент или метод</h2><p>Иногда нужный вывод нельзя получить напрямую из исходных посылок. Тогда мы временно принимаем дополнительное предположение, выводим из него результат, а затем снимаем предположение по специальному правилу. Такое рассуждение ограничено контекстом: формулы, полученные внутри поддоказательства, не становятся автоматически доступными снаружи. При введении импликации снимается предпосылка P; при введении отрицания предположение P приводит к противоречию ⊥.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой доказательство с условием и целью. Выбери задачу, где нужно получить P → Q.</li><li>Нажми начало поддоказательства для введения импликации и введи временное предположение P.</li><li>Убедись, что интерфейс обозначил вложенный контекст и последующие шаги относятся к нему.</li><li>Внутри контекста докажи Q, используя P и разрешённые внешние посылки.</li><li>Нажми закрытие поддоказательства. Новый шаг P → Q должен ссылаться на поддоказательство и снимать предположение P.</li><li>Повтори схему для отрицания: предположи P, внутри выведи противоречие ⊥, затем закрой контекст правилом ¬I.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Пример схемы: из P и импликации P → Q нужно вывести Q. Но для тренировки →I начни с условного доказательства: «предположим P; по условной теореме из P получаем Q; следовательно, P → Q». Предположение P — не глобально доказанный факт, а временная гипотеза, которую снимает правило введения импликации.</p></div><h2>4. Контрольный список</h2><ul><li>Временное предположение создано через инструмент начала поддоказательства.</li><li>Внутренние шаги находятся в соответствующем контексте.</li><li>Закрытие снимает именно ту гипотезу, которая была открыта.</li><li>Внешний вывод не использует внутреннюю формулу как безусловную посылку.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Добавлять гипотезу обычным шагом вне контекста.</li><li>Использовать локальный вывод после закрытия так, будто гипотеза всё ещё доступна.</li><li>Закрывать поддоказательство до вывода требуемого последствия.</li><li>Путать →I и ¬I: для отрицания требуется получить противоречие.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что происходит с предположением P при применении правила →I?",["Оно становится постоянной исходной аксиомой.", "Оно временно принимается, внутри выводится Q, а затем снимается при выводе P → Q.", "Оно удаляется вместе со всеми внешними посылками.", "Его не нужно явно обозначать."],1,"Верно: импликация вводится посредством временного предположения антецедента и вывода консеквента.","Смысл правила →I — показать, что при условии P следует Q. Это не то же самое, что уже знать P вне рассуждения.","Поддоказательства превращают неформальное «предположим...» в строгую структуру областей действия. Проверяй границы контекстов так же внимательно, как ссылки на формулы.");
add("m6","Доказательство по случаям (∨E): один вывод из двух ветвей","Полный сценарий разбора дизъюнкции с двумя поддоказательствами.","<h2>1. Что делает этот инструмент или метод</h2><p>Из P ∨ Q и двух условных рассуждений — P ⟹ R и Q ⟹ R — можно вывести R. Главное требование: обе ветви должны приводить к одному и тому же заключению. Недостаточно доказать разные полезные факты, или рассмотреть только один из случаев. GeoProof создаёт два контекста, чтобы можно было явно построить обе ветви и затем закрыть их общим результатом.</p><h2>2. Рабочая последовательность</h2><ol><li>Убедись, что в предыдущих шагах есть дизъюнкция P ∨ Q. Если она ещё не доказана, её нельзя использовать как исходную посылку.</li><li>Запусти инструмент разбора случаев и выбери исходный шаг с дизъюнкцией.</li><li>В первой ветви прими P как временное предположение. Используя его и доступные внешние факты, докажи R.</li><li>Закрой первый случай. Интерфейс должен перейти ко второй ветви.</li><li>Во второй ветви прими Q и отдельно докажи то же самое R. Не копируй вывод первой ветви без обоснования.</li><li>Закрой второй случай и заверши вывод по ∨E. Проверь, что источником является исходная дизъюнкция, обе ветви закрыты и заключения совпадают.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Пусть известно P ∨ Q, и нужно доказать R. У нас есть отдельные факты P → R и Q → R. В ветви P используем P и P → R по modus ponens. В ветви Q используем Q и Q → R. В обеих ветвях получаем R, значит, по ∨E получаем R без знания того, какой именно дизъюнкт истинен.</p></div><h2>4. Контрольный список</h2><ul><li>Выбрана существующая формула P ∨ Q.</li><li>В первой ветви предположение P, во второй Q.</li><li>Обе ветви приводят к одной формуле R.</li><li>Обе ветви закрыты.</li><li>Внешний вывод снимает обе локальные гипотезы.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Рассматривать только один случай.</li><li>Получить R в первой ветви, а S во второй.</li><li>Считать P и Q одновременно истинными вместо анализа альтернатив.</li><li>Оставить ветвь открытой или сослаться на внутренний шаг после выхода из контекста.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какое условие обязательно для применения ∨E?",["Доказать P и Q одновременно.", "Из каждого дизъюнкта отдельно получить одно и то же R в соответствующей ветви.", "Выбрать только более вероятный случай.", "В одной ветви получить R, а в другой любой другой факт."],1,"Верно: общее заключение должно следовать из каждого случая.","Если истинна хотя бы одна из частей P∨Q, а обе части по отдельности влекут R, то R следует независимо от выбора ветви.","Правило ∨E формализует разбор всех возможных случаев. Не забудь ни одну ветвь и не используй временные предположения за пределами их области действия.");
add("m6","Кванторы в GeoProof: ∀I, ∀E, ∃I и ∃E на практике","Пошаговая работа с всеобщностью и существованием, включая условия свежести параметра.","<h2>1. Что делает этот инструмент или метод</h2><p>Квантор всеобщности ∀ означает, что свойство верно для каждого объекта заданной области. Квантор существования ∃ означает, что есть хотя бы один объект с данным свойством. Правила кванторов требуют аккуратной подстановки и контроля переменных. Для ∀I нужно доказать свойство произвольного объекта, не опираясь на особые свойства этого имени. Для ∃I уже известный экземпляр служит свидетелем. Для ∃E вводится свежий параметр c; итоговое заключение не должно зависеть от его имени.</p><h2>2. Рабочая последовательность</h2><ol><li>Начни с различия: ∀x P(x) содержит утверждение для любого x; ∃x P(x) утверждает наличие хотя бы одного свидетеля.</li><li>Для ∀E выбери формулу ∀x P(x), затем допустимый терм t и получи экземпляр P(t).</li><li>Для ∃I выбери уже доказанный экземпляр P(t) и укажи шаблон P(x), чтобы получить ∃x P(x).</li><li>Для ∀I возьми произвольный параметр a, докажи P(a), проверь, что a не свободен во внешних незакрытых предположениях, и только затем обобщай.</li><li>Для ∃E выбери источник ∃x P(x). Начни отдельное поддоказательство с новым параметром c и гипотезой P(c).</li><li>Докажи внутри контекста требуемое Q. При закрытии убедись, что Q не содержит c и что внешние предположения не зависят от c.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Из ∀x (Человек(x) → Смертен(x)) и Человек(Сократ) получаем Смертен(Сократ) через ∀E, затем →E. Здесь подстановка конкретного терма корректна. Обратное обобщение «раз Сократ смертен, то все смертны» неверно: один экземпляр не доказывает всеобщность.</p><p>Для существования: если уже доказано Смертен(Сократ), можно вывести ∃x Смертен(x) через ∃I, используя Сократа как свидетеля.</p></div><h2>4. Контрольный список</h2><ul><li>При ∀E подстановка берётся из области допустимых термов.</li><li>При ∃I указан конкретный свидетель.</li><li>При ∀I параметр произволен и не зависит от не снятых предположений.</li><li>При ∃E параметр свежий и не выходит в итоговую формулу.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Обобщать один частный пример до всеобщего утверждения.</li><li>При ∀I выбирать параметр, уже связанный с особыми условиями.</li><li>При ∃E использовать имя свидетеля во внешнем заключении.</li><li>Перепутать ∀E и ∃I: правила направлены в разные стороны.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что требуется при устранении существования (∃E)?",["Взять произвольное имя, которое уже встречалось в условии.", "Ввести свежий параметр-свидетель, получить общее заключение и не допустить зависимости заключения от этого параметра.", "Объявить существование доказанным по рисунку.", "Подставить любое выражение в квантор всеобщности."],1,"Верно: свежесть параметра защищает от незаконного переноса свойств конкретного свидетеля на общий вывод.","Если бы итоговый вывод зависел от имени c, он мог бы быть верен только для выбранного свидетеля, а не для произвольного случая, гарантированного ∃x P(x).","Кванторные правила требуют большего, чем простая замена символов. Главная дисциплина — отслеживать свободные переменные, связанные переменные и зависимости от временных предположений.");
add("m6","Статусы проверки: что значит checked, invalid и review","Как читать результат аудита и почему он не является универсальным сертификатом истины.","<h2>1. Что делает этот инструмент или метод</h2><p>Проверка в GeoProof различает несколько уровней. `invalid` означает, что найдена структурная или формальная проблема в поддерживаемой проверке: например, недоступная ссылка, неверная область действия или некорректная схема правила. `checked` означает, что шаг прошёл доступные структурные проверки. `review` обозначает случай, который нельзя полностью подтвердить автоматическими правилами и который требует содержательной проверки человеком. Ни один из этих статусов не заменяет проверку истинности всех геометрических предпосылок.</p><h2>2. Рабочая последовательность</h2><ol><li>После построения доказательства открой подробности проверки каждого шага.</li><li>Если видишь invalid, прочитай конкретную ошибку: ссылка может указывать на недоступный шаг, контекст может быть открыт, или форма вывода не совпадает с правилом.</li><li>Исправляй первопричину, а не скрывай предупреждение. Уточни формулу, порядок посылок, область действия или правило.</li><li>Если шаг помечен checked, проверь математически, что его предпосылки истинны и теорема действительно применима.</li><li>Если шаг помечен review, найди то, что автоматике неизвестно: смысл свободного текста, семантика геометрического предиката, полнота предпосылок теоремы или корректность содержательного рассуждения.</li><li>Для каждого шага оставь отдельный человеческий аргумент. Финальный аудит должен включать и машинную, и математическую проверку.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Шаг «AB = AC» может пройти структурную проверку, если оформлен допустимым шаблоном и ссылками. Но если исходные данные не утверждают равенство AB и AC, и никакой теоремы это не выводит, математически шаг неверен. Статус checked не делает ложную посылку истинной: он означает только, что проверенные структурные условия выполнены.</p></div><h2>4. Контрольный список</h2><ul><li>Можешь объяснить значение каждого статуса.</li><li>Для invalid находишь первопричину в структуре.</li><li>Для checked проверяешь внешние математические предпосылки.</li><li>Для review явно указываешь, какая проверка остаётся человеческой.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Считать checked полным доказательством истины.</li><li>Игнорировать review как несущественный статус.</li><li>Исправлять invalid случайными ссылками, не читая диагностику.</li><li>Путать структурную корректность и математическую истинность.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что в действительности означает статус checked?",["Любая формула и все её геометрические предпосылки доказаны универсальным решателем.", "Шаг прошёл доступные структурные проверки GeoProof, но его математическое содержание ещё может требовать проверки.", "Шаг гарантированно является аксиомой.", "Программа нашла доказательство теоремы автоматически."],1,"Верно: статус относится только к возможностям реализованной проверки.","Проверить правильность структуры ссылки и допустимость формальной схемы — не то же самое, что доказать геометрическую истинность произвольного утверждения.","Относись к статусам как к диагностике редактора. Полноценное математическое доказательство требует истинных исходных данных, корректных теорем и осмысленной цепочки переходов.");
add("m6","Граф доказательства, пошаговая демонстрация и представление результата","Как читать граф ссылок и использовать демонстрацию для проверки собственного понимания.","<h2>1. Что делает этот инструмент или метод</h2><p>Граф зависимостей показывает, какие шаги используются другими шагами. Он помогает увидеть разветвление, общие посылки, лишние строки и локальные поддоказательства. Но граф показывает структуру ссылок, а не семантическую истинность. Режим демонстрации позволяет предъявлять ход доказательства последовательно; текстовое представление и печать помогают вынести работу за пределы редактора.</p><h2>2. Рабочая последовательность</h2><ol><li>После построения нескольких шагов открой граф зависимостей.</li><li>Найди вершины-источники: условие и исходные факты обычно не имеют входящих зависимостей от предыдущих выводов.</li><li>Проследи стрелки от посылок к заключениям. Убедись, что целевой шаг имеет путь от нужных исходных фактов.</li><li>Ищи шаги без использования: возможно, они лишние. Проверь и обратную ситуацию — нет ли важной строки, на которую никто не ссылается, хотя она должна быть частью вывода.</li><li>Запусти демонстрацию. Для каждого шага проговори вслух: что известно, какое правило применяется, почему посылки подходят.</li><li>Скопируй или распечатай представление. Проверь обозначения, пояснения, порядок формул и корректность ссылок после экспорта.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Если шаг 4 использует шаги 1 и 2, а шаг 5 использует шаг 4 и шаг 3, граф должен показать цепочку зависимостей к шагу 5. Если шаг 3 никак не ведёт к цели, спроси себя, нужен ли он. Если шаг 5 обозначен целью, это ещё не означает, что путь к нему корректен — проверь содержание каждого ребра.</p></div><h2>4. Контрольный список</h2><ul><li>Понимаешь направление зависимостей.</li><li>Можешь проследить путь от посылок к цели.</li><li>Выявляешь неиспользуемые или отсутствующие ссылки.</li><li>Во время демонстрации можешь объяснить каждый переход без чтения готового текста.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Считать, что стрелка в графе автоматически подтверждает теорему.</li><li>Путать порядок отображения строк и логическое направление вывода.</li><li>Печатать доказательство без проверки длинных формул и пояснений.</li><li>Использовать демонстрацию как замену изучению основания.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что показывает граф доказательства GeoProof?",["Полную семантическую истинность каждого геометрического утверждения.", "Зависимости между шагами и используемые ссылки.", "Численные координаты всех точек.", "Список всех локальных файлов пользователя."],1,"Верно: граф визуализирует структуру ссылок между шагами.","Граф — визуальная модель того, на какие выводы опираются следующие выводы. Он не является отдельным математическим доказательством.","Используй граф как средство аудита логической архитектуры. Содержательную корректность проверяй отдельно, читая каждую посылку и правило.");
add("m6","Файлы проекта: сохранение, загрузка и резервные копии","Как сохранить геометрическую модель и доказательство в одном проекте и восстановить работу позднее.","<h2>1. Что делает этот инструмент или метод</h2><p>GeoProof работает на стороне клиента и сохраняет проект в виде JSON-файла, который скачивается на компьютер. Это не облачная синхронизация и не автоматическое резервное копирование: файл нужно хранить самостоятельно. При загрузке JSON редактор восстанавливает структуру проекта. Поэтому важно сохранять контрольную копию перед экспериментами и не редактировать JSON вручную без понимания его формата.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай тестовую геометрическую конфигурацию и добавь к ней несколько шагов доказательства.</li><li>Нажми «Сохранить проект» или используй Ctrl+S. Браузер скачает файл с расширением .geoproof.json.</li><li>Перемести точку и добавь временный объект, чтобы состояние стало отличаться от сохранённого.</li><li>Нажми «Открыть проект», выбери ранее скачанный JSON и подтверди загрузку.</li><li>Сравни восстановленные объекты, зависимости, условие, цель и доказательные шаги с сохранённой версией.</li><li>Перед крупными изменениями сохраняй отдельные версии с понятными именами и датами. Не рассчитывай на автосохранение: его нет.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Сохрани проект после создания треугольника ABC и шага «AB = AC». Затем измени геометрию, добавь новый шаг и загрузить старый файл. Ожидаемый результат — возврат к сохранённому состоянию, включая состав проекта на момент сохранения. Изменения после сохранения не должны считаться частью старого файла.</p></div><h2>4. Контрольный список</h2><ul><li>Файл действительно скачан и существует в выбранной папке.</li><li>Проверено повторное открытие проекта.</li><li>Восстановлены и чертёж, и доказательная часть.</li><li>Понимаешь, что сохранение — отдельное действие, а не облачная синхронизация.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Закрывать вкладку, полагаясь на автосохранение проекта.</li><li>Считать локальный прогресс уроков резервной копией проекта.</li><li>Перезаписывать единственную копию файла до проверки новой.</li><li>Пытаться открыть произвольный JSON как полноценный проект.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Как GeoProof сохраняет математический проект?",["Постоянно отправляет его на облачный сервер.", "Скачивает файл проекта в формате JSON по команде пользователя.", "Сохраняет только скриншот чертежа.", "Хранит единственную копию только в памяти вкладки."],1,"Верно: нужно скачать файл и самостоятельно хранить его в надёжном месте.","Локальная работа без сервера означает, что сохранность проекта зависит от скачанного файла и действий пользователя.","Сделай правило: сохраняй перед экспериментом, после значимого этапа и перед завершением сессии. Проверяй открытие резервной копии, а не только факт загрузки файла.");
add("m6","История изменений: Undo, Redo и безопасный эксперимент","Как пользоваться отменой и повтором, понимать границы истории действий.","<h2>1. Что делает этот инструмент или метод</h2><p>История действий позволяет вернуться к предыдущему состоянию после ошибочного построения или редактирования. В GeoProof поддерживаются Ctrl+Z для отмены и Ctrl+Y или Ctrl+Shift+Z для повтора. История ограничена конечным количеством снимков модели, поэтому она не заменяет файл проекта. Хороший рабочий процесс — пробовать операцию, проверять её последствия и отменять, если модель изменилась не так, как ожидалось.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай две точки и отрезок между ними.</li><li>Добавь ещё одну точку — это будет отдельное действие.</li><li>Нажми Ctrl+Z и проверь, что последнее действие отменено.</li><li>Нажми Ctrl+Y или Ctrl+Shift+Z и проверь восстановление действия.</li><li>Повтори эксперимент с активным ограничением: после его применения измени исходную точку, затем отмени перемещение и убедись, что модель возвращается к предыдущему снимку.</li><li>Не используй историю вместо сохранения: при закрытии вкладки рассчитывай на файл проекта, а не на список Undo.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Создай свободную точку D. Отмени действие: D исчезает. Выполни повтор: D появляется снова. Затем выполни новое действие после отмены. Обрати внимание: новая ветка истории обычно заменяет возможность повторить старую отменённую последовательность.</p></div><h2>4. Контрольный список</h2><ul><li>Знаешь сочетания отмены и повтора.</li><li>Проверил эффект на простом объекте.</li><li>Понимаешь, что новое действие после Undo меняет историю Redo.</li><li>Не путаешь историю вкладки с резервной копией файла.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Нажимать Ctrl+Z, когда фокус находится в поле ввода, не проверив область действия клавиши.</li><li>Ожидать бесконечную историю изменений.</li><li>Считать, что отмена гарантирует восстановление после закрытия браузера.</li><li>Не сохранять важный этап перед рискованной серией действий.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какой набор сочетаний используется для отмены и повтора?",["Ctrl+Z — отмена; Ctrl+Y или Ctrl+Shift+Z — повтор.", "Ctrl+Y — отмена; Ctrl+Z — повтор.", "Alt+F4 — повтор.", "Ctrl+S — отмена."],0,"Верно: стандартная пара — Ctrl+Z и Ctrl+Y (или Ctrl+Shift+Z).","Undo и Redo перемещают состояние по истории изменений в пределах текущей рабочей сессии. Сохранение файла решает другую задачу — долговременное хранение.","Используй Undo/Redo для короткого цикла эксперимента, а JSON — для резервирования этапов работы.");
add("m6","Вкладки, примеры и демонстрация: ориентирование в рабочем процессе","Как использовать примеры GeoProof для обучения и не принимать шаблон за доказанный результат.","<h2>1. Что делает этот инструмент или метод</h2><p>Доказательная рабочая область содержит несколько представлений: собственно доказательство, математическую базу и примеры доказательств. Примеры полезны, чтобы увидеть структуру задачи и ожидаемую форму шагов. Их нужно не только загрузить, но и разобрать: установить, какие посылки используются, почему подходит правило, какие выводы являются временными и какие ограничения проверки остаются. Демонстрация по шагам помогает воспроизвести ход рассуждения.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой вкладку «Примеры доказательств».</li><li>Найди небольшой пример, суть которого уже знакома: равенство, аксиома инцидентности или простая логическая схема.</li><li>Открой пример и прочитай условие с целью. Прежде чем смотреть все шаги, попробуй самостоятельно предсказать первый вывод.</li><li>Раскрой каждый шаг: назови утверждение, источник, правило и ссылки. Объясни, какие условия позволяют применить правило.</li><li>Открой граф и демонстрацию, если они доступны для этого примера. Проследи цепочку от исходных данных до заключения.</li><li>Измени формулировку задачи или исходную посылку и спроси себя, сохранится ли доказательство. Если нет — объясни, какое звено зависит от изменённого факта.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>В примере «транзитивность равенства» даны AB=CD и CD=EF. Заключение AB=EF получается из общего промежуточного члена CD. Чтобы понять пример, нужно назвать не только «транзитивность», но и сопоставить левую и правую части обеих посылок.</p></div><h2>4. Контрольный список</h2><ul><li>Пример читается как цепочка зависимостей, а не как готовый ответ.</li><li>Каждый шаг имеет названное основание.</li><li>Можешь предсказать следующий шаг до просмотра готового вывода.</li><li>Знаешь, какие утверждения приложение проверяет структурно, а какие требуют проверки человеком.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Загружать примеры и не пытаться объяснить каждый шаг.</li><li>Считать, что успешная загрузка означает универсальную доказанность.</li><li>Копировать ссылки, не понимая смысла общей посылки.</li><li>Не проверять, меняется ли доказательство при изменении условия.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Как лучше использовать встроенный пример?",["Скопировать вывод и не разбирать его.", "Предсказать шаги, объяснить основания и затем изменить условие, чтобы проверить понимание.", "Считать, что любой пример можно применить к другой задаче с похожим рисунком.", "Удалить все посылки и оставить только заключение."],1,"Верно: пример должен стать учебным материалом для самостоятельного воспроизведения.","Навык строить доказательства формируется через объяснение причин каждого перехода и перенос метода на слегка изменённую задачу.","После разбора закрой пример и воспроизведи доказательство с нуля. Если не можешь объяснить выбор каждой ссылки, возвращайся к определениям и правилу каталога.");
add("m6","Полный лабораторный сценарий: построить, исследовать, сформулировать и доказать","Объединение геометрической доски и доказательной области в одном учебном проекте.","<h2>1. Что делает этот инструмент или метод</h2><p>Этот практикум связывает два режима GeoProof, которые нельзя смешивать. В первой части создаётся геометрическая конфигурация и изучаются её зависимости. Во второй формулируются математические факты, выбираются основания и строится цепочка доказательства. Перетаскивание может показать, какие свойства поддерживает модель, но для доказательства требуется независимая логическая аргументация.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай треугольник ABC. Построй середину M стороны BC инструментом «Середина» или «Медиана».</li><li>Перемещай A, B и C по очереди. Запиши, какие объекты зависимы, а какие являются управляющими.</li><li>Сформулируй точное утверждение: «M — середина BC», и выпиши его следствия по определению: M∈BC и BM=MC.</li><li>Перейди в доказательную область и запиши условие так, чтобы оно отражало реальную задачу. Если M была построена инструментом, отдельно проверь, как именно трактуется построение в конкретной задаче.</li><li>Добавь утверждения о принадлежности и равенстве, выбери соответствующие определения/построения и укажи ссылки.</li><li>Проверь каждый шаг и затем объясни, почему он математически корректен. Если опираешься на свойство инструмента, сформулируй это как точное математическое основание, а не как «программа нарисовала».</li><li>Сохрани проект JSON и напиши короткий вывод: какие свойства получены из построения, а какие — из доказательства.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Важная тонкость: «M создана инструментом середины» и «M — середина BC» — связанные, но разные уровни описания. В рамках пользовательского чертежа инструмент обеспечивает зависимое построение. В математическом тексте нужно явно сформулировать, какие свойства построения разрешено использовать как данные. Не подменяй это ссылкой на визуальный вид.</p></div><h2>4. Контрольный список</h2><ul><li>Выполнено построение с зависимыми объектами.</li><li>Разделены наблюдение, определение и доказательство.</li><li>Каждый логический шаг имеет источник.</li><li>Файл проекта сохранён и может быть открыт повторно.</li><li>Можешь устно объяснить весь путь от условия к цели.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Делать вывод из движения объектов без точной формулировки.</li><li>Считать сам факт наличия середины на доске достаточным доказательством любой теоремы о медиане.</li><li>Переносить техническое ограничение редактора в математическую аксиому.</li><li>Не сохранять работу после завершения.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какое утверждение лучше всего описывает правильное использование GeoProof?",["Сначала построить рисунок, а затем принять все видимые свойства за доказанные.", "Использовать геометрию для построения и исследования, а доказательную область — для явного обоснования математических выводов.", "Достаточно поставить отметку на чертеже, чтобы доказать теорему.", "Граф зависимостей заменяет аксиомы геометрии."],1,"Верно: модель и доказательство дополняют друг друга, но имеют разные функции.","Геометрическая модель задаёт объекты и их поведение. Доказательство устанавливает, какие утверждения следуют из условий и правил теории.","Этот сценарий — базовая рабочая привычка для всех сложных задач: сначала уточнить объект и задачу, затем формализовать данные и только после этого доказывать.");
add("m6","Темы интерфейса, масштаб и панорамирование: управлять видом, не меняя геометрию","Различие между геометрическими координатами и камерой, переключение тем и управление доской.","<h2>1. Что делает этот инструмент или метод</h2><p>Экранное представление — это не сама математическая модель. Масштабирование и панорамирование меняют то, как мы видим доску, но не должны менять длины, углы или зависимости внутри чертежа. GeoProof поддерживает темы dark, light и graphite; масштабирование колесом и кнопками, панорамирование инструментом «Рука», а также перетаскивание с Space или поддерживаемыми кнопками мыши. Это отделение камеры от геометрии важно для корректной работы с объектами.</p><h2>2. Рабочая последовательность</h2><ol><li>Переключи тему через палитру. Выбери dark, light и graphite и проверь контраст текста, панели и доски.</li><li>Создай небольшой чертёж и зафиксируй, какие объекты в нём есть.</li><li>Измени масштаб колесом или кнопками +/−, затем нажми «Сброс». Координаты объектов не должны изменяться из-за одного масштабирования.</li><li>Выбери «Рука» и перетащи доску. После панорамирования взаимное расположение объектов должно остаться прежним.</li><li>Вернись к «Выбор» и перемести точку: в отличие от камеры, это уже изменяет геометрическую модель.</li><li>Сравни два действия: сдвиг доски и сдвиг точки. Убедись, что знаешь, какое из них меняет математическое состояние.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Представь, что на доске нарисован прямоугольный треугольник. При масштабировании он становится крупнее на экране, но его углы и отношения сторон не меняются. При перемещении одной вершины треугольник изменяется математически. Если перепутать эти действия, можно ошибочно считать, что панорамирование изменяет координаты или длины.</p></div><h2>4. Контрольный список</h2><ul><li>После зума конфигурация сохраняет свои отношения.</li><li>После панорамирования объекты остаются связанными как прежде.</li><li>При перемещении точки меняется именно геометрическая модель.</li><li>Пользователь выбирает тему, не меняя математический проект.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Пытаться перетаскивать объект, находясь в режиме «Рука».</li><li>Путать сдвиг камеры с групповым перемещением геометрии.</li><li>Считать тему оформления частью доказательства.</li><li>Оценивать длину по экранным пикселям после изменения масштаба.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что происходит при панорамировании доски?",["Меняются математические координаты всех точек.", "Меняется положение области просмотра, но взаимная геометрия объектов сохраняется.", "Все ограничения удаляются.", "Все точки становятся свободными."],1,"Верно: панорамирование перемещает камеру, а не саму конфигурацию.","Система хранит геометрию отдельно от SVG-камеры. Это позволяет перемещать и масштабировать изображение без изменения математических объектов.","Всегда различай действия представления и действия модели. Это базовый принцип любого интерактивного геометрического редактора.");
add("m4","Разобранное доказательство: углы при основании равнобедренного треугольника","От определения равнобедренного треугольника к равенству двух углов.","<h2>1. Что делает этот инструмент или метод</h2><p>Теорема утверждает: если AB = AC, то углы при основании BC равны, то есть ∠ABC = ∠BCA. Классический способ — провести биссектрису угла A. Она делит угол на две равные части; вместе с общей стороной AD и равными сторонами AB, AC можно получить равенство треугольников ABD и ACD по SAS (сторона–угол–сторона), а затем соответствующие углы при основании равны. Важно явно назвать соответствие вершин.</p><h2>2. Рабочая последовательность</h2><ol><li>Перепиши условие: треугольник ABC, AB = AC. Цель: ∠ABC = ∠BCA.</li><li>Проведи биссектрису AD угла A. По определению биссектрисы ∠BAD = ∠DAC.</li><li>Сравни треугольники ABD и ACD: AB = AC (дано), AD = AD (общая сторона), ∠BAD = ∠DAC (построение/определение биссектрисы).</li><li>Примени признак равенства треугольников SAS. Проверь, что равные стороны заключают равные углы и порядок соответствия A↔A, B↔C, D↔D.</li><li>Из равенства треугольников получи равенство соответствующих углов при основании по соответствующим частям равных треугольников.</li><li>Перепроверь, что заключение соответствует исходной цели, а не перепутанным углам.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>План рассуждения: AB=AC; AD — общая сторона; AD делит угол A пополам. Следовательно, △ABD ≅ △ACD по SAS. Из соответствия треугольников следует ∠ABD = ∠ACD, то есть ∠ABC = ∠BCA.</p><p>Разбери, почему AD необходимо вводить именно как биссектрису: без равенства углов BAD и DAC третий элемент для SAS отсутствует.</p></div><h2>4. Контрольный список</h2><ul><li>Точно записаны условие и цель.</li><li>Вспомогательная линия имеет обоснование.</li><li>Перечислены три пары равных элементов для SAS.</li><li>Соответствие вершин согласовано во всех формулах.</li><li>Заключение получено как соответствующие части равных треугольников.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Применять SAS, не установив равенство заключённых углов.</li><li>Сравнивать △ABD и △ACD без указания соответствия.</li><li>Считать биссектрису автоматически медианой до завершения доказательства.</li><li>Писать «треугольники равны», не уточняя порядок вершин.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какое дополнительное построение помогает доказать равенство углов при основании?",["Высота из B.", "Биссектриса AD угла A.", "Окружность с центром B.", "Медиана из C."],1,"Верно: биссектриса создаёт равные углы при вершине A, необходимые для SAS.","Равенство сторон AB и AC даёт один элемент, общая сторона AD — второй, а биссектриса — равенство заключённых углов.","Это типичный пример поиска вспомогательного построения: цель не получается напрямую, поэтому мы добавляем объект, создающий недостающее условие теоремы.");
add("m4","Разобранное доказательство: вертикальные углы равны","Как перейти от смежности и развёрнутого угла к равенству вертикальных углов.","<h2>1. Что делает этот инструмент или метод</h2><p>Если две прямые пересекаются, образуются две пары вертикальных углов. Для доказательства равенства одной пары используем смежные углы: сумма каждой смежной пары равна 180°. Если оба искомых угла дополняют один и тот же угол до 180°, они равны. Это доказательство показывает, как вычитать общую часть из равенств и использовать определение смежных углов.</p><h2>2. Рабочая последовательность</h2><ol><li>Обозначь пересечение прямых в точке O, а лучи — OA, OB, OC, OD так, чтобы OA и OC были противоположными, OB и OD — тоже.</li><li>Выбери одну пару вертикальных углов, например ∠AOB и ∠COD.</li><li>Запиши смежные пары: ∠AOB и ∠BOC; ∠COD и ∠BOC.</li><li>По свойству смежных углов запиши ∠AOB + ∠BOC = 180° и ∠COD + ∠BOC = 180°.</li><li>Сравни равенства, вычти общую величину ∠BOC из обеих частей и получи ∠AOB = ∠COD.</li><li>Убедись, что выбранные углы действительно являются вертикальными, а общая часть — один и тот же угол.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Пусть x = ∠AOB, y = ∠BOC, z = ∠COD. Из смежности имеем x+y=180° и z+y=180°. Тогда x+y=z+y, значит x=z. Важно: одинаковая сумма справа позволяет приравнять и затем вычесть общий y.</p></div><h2>4. Контрольный список</h2><ul><li>Правильно определены противоположные лучи.</li><li>Обе пары действительно смежные.</li><li>Использована одна и та же общая величина.</li><li>Заключение относится к вертикальной паре углов.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Путать вертикальные углы со смежными.</li><li>Считать, что вертикальные углы равны просто по виду рисунка.</li><li>Сложить несмежные углы и необоснованно приравнять сумму 180°.</li><li>Выбирать разные общие углы в двух равенствах.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какая идея является ключевой в доказательстве равенства вертикальных углов через смежность?",["Каждый угол равен 90°.", "Оба искомых угла дополняют один и тот же угол до 180°.", "Все углы при пересечении прямых равны 45°.", "Вертикальные углы образуют одну прямую."],1,"Верно: общий смежный угол позволяет сравнить два дополнения до 180°.","Если x+y=180° и z+y=180°, то x=z. Это общий алгебраический принцип вычитания равных величин.","Полезно сначала доказать теорему в числах или формулах, а затем перевести каждый символ в геометрическое утверждение.");
add("m4","Признак равенства треугольников: порядок соответствия SSS и SAS","Как правильно сопоставлять вершины треугольников и применять признак без перепутанных сторон.","<h2>1. Что делает этот инструмент или метод</h2><p>Запись △ABC ≅ △DEF означает соответствие A↔D, B↔E, C↔F. Поэтому AB соответствует DE, BC — EF, CA — FD. При SSS нужны три пары соответствующих равных сторон. При SAS нужны две пары соответствующих равных сторон и равные углы между ними. Само наличие трёх равенств где-то в чертеже недостаточно: элементы должны соответствовать одному и тому же порядку вершин.</p><h2>2. Рабочая последовательность</h2><ol><li>Запиши два треугольника в фиксированном порядке вершин: △ABC и △DEF.</li><li>Составь таблицу соответствия вершин: A–D, B–E, C–F.</li><li>Переведи её в соответствие сторон: AB–DE, BC–EF, CA–FD.</li><li>Для SSS найди три пары равных соответствующих сторон.</li><li>Для SAS выбери две пары равных сторон и проверь, что углы расположены между этими сторонами в обоих треугольниках.</li><li>После вывода конгруэнтности используй только соответствующие части треугольников; не переставляй индексы произвольно.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Если AB=DE, BC=EF и CA=FD, то △ABC ≅ △DEF по SSS. Из этого следует, например, ∠A=∠D. Если же известно AB=DE, AC=DF и ∠A=∠D, то применим SAS: угол A заключён между AB и AC, а угол D — между DE и DF.</p></div><h2>4. Контрольный список</h2><ul><li>Сначала записано соответствие вершин.</li><li>Каждая сторона сопоставлена по концам.</li><li>Для SAS угол действительно заключён между выбранными сторонами.</li><li>Итоговые соответствующие углы и стороны выписаны по той же таблице.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Подбирать равные стороны без соблюдения порядка.</li><li>Для SAS использовать угол, не заключённый между двумя известными сторонами.</li><li>Считать, что три произвольных равенства достаточно.</li><li>После конгруэнтности переставлять вершины без объяснения.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","При △ABC ≅ △DEF какая сторона соответствует AC?",["DE", "EF", "DF", "AB"],2,"Верно: A соответствует D, C соответствует F, следовательно AC ↔ DF.","Соответствие фиксируется порядком букв в записи конгруэнтности. Оно определяет все пары соответствующих элементов.","Привычка сначала составлять correspondence table предотвращает большинство технических ошибок в доказательствах равенства треугольников.");
add("m5","Планирование доказательства: двигаться от цели назад и от данных вперёд","Метод поиска промежуточных утверждений и устранения логических разрывов.","<h2>1. Что делает этот инструмент или метод</h2><p>Для сложной задачи полезно вести два направления. Обратный анализ спрашивает: какое утверждение непосредственно дало бы цель? Прямой анализ спрашивает: что уже можно вывести из данных? Решение часто находится в точке пересечения этих двух цепочек. Промежуточное утверждение, соединяющее их, называют леммой или ключевым шагом. Этот метод полезнее, чем хаотично перебирать теоремы из каталога.</p><h2>2. Рабочая последовательность</h2><ol><li>Перепиши цель как точное утверждение. Подчеркни главные объекты и отношение между ними.</li><li>Спроси: какая теорема или определение даёт такое заключение? Выпиши её предпосылки.</li><li>Для каждой предпосылки спроси, известна ли она уже или может быть получена из исходных данных.</li><li>Теперь иди от условия вперёд: выпиши непосредственные следствия определений и аксиом.</li><li>Сопоставь две цепочки. Найди отсутствующий мост — факт, который можно получить с обеих сторон.</li><li>Сформулируй план из трёх–пяти шагов. Для каждого шага укажи основание до того, как вводить его в GeoProof.</li><li>После построения доказательства пройди цепочку в обратном направлении и проверь, что каждый шаг действительно ведёт к цели.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Цель: доказать, что два угла равны. Обратный ход: возможно, они являются соответствующими углами равных треугольников. Тогда нужны равные треугольники. Для их равенства понадобятся стороны и угол. Прямой ход: из условия уже известны две стороны и общий отрезок. Ключевым шагом может оказаться вспомогательная линия, которая создаст третий элемент для SSS или SAS.</p></div><h2>4. Контрольный список</h2><ul><li>Для цели выписан нужный тип заключения.</li><li>Установлены предпосылки возможной теоремы.</li><li>Каждая предпосылка связана с данными или отдельной леммой.</li><li>План не содержит кругового использования цели.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Начинать с самой сложной теоремы, не проверяя условия.</li><li>Подменять недостающую предпосылку тем, что «видно на рисунке».</li><li>Двигаться только вперёд и не проверять, куда ведёт цепочка.</li><li>Считать, что наличие многих промежуточных строк делает доказательство сильнее.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Зачем совмещать обратный анализ цели с прямым анализом данных?",["Чтобы получить больше строк.", "Чтобы найти промежуточный факт, связывающий то, что нужно доказать, с тем, что уже известно.", "Чтобы выбрать теорему случайным образом.", "Чтобы не формулировать цель."],1,"Верно: встреча двух направлений помогает обнаружить ключевую лемму.","Обратный анализ раскрывает, чего не хватает, а прямой — что можно получить. Их пересечение указывает наиболее естественный следующий шаг.","Используй этот алгоритм перед каждой сложной задачей. Он превращает подбор теорем в направленный поиск по условиям и заключениям.");
add("m5","Контрпример и проверка необходимости условий","Как проверить, действительно ли гипотезы теоремы нужны.","<h2>1. Что делает этот инструмент или метод</h2><p>Чтобы понять роль условия, попробуй мысленно убрать его и найти пример, где заключение перестанет быть верным. Такой объект называется контрпримером. Контрпример не доказывает исходную теорему, но показывает, что более сильная формулировка без данного условия неверна. В GeoProof можно исследовать конфигурацию динамически, меняя её форму, но контрпример должен быть описан математически, а не только изображён.</p><h2>2. Рабочая последовательность</h2><ol><li>Запиши исходное утверждение вида «если P, то Q».</li><li>Убери одно условие из P, не меняя заключение Q.</li><li>Попробуй построить простой объект, который удовлетворяет оставшимся условиям, но нарушает Q.</li><li>Проверь конкретные координаты или точные свойства контрпримера, чтобы исключить случайную погрешность рисунка.</li><li>Если контрпример найден, объясни, какое условие было необходимо для исходной теоремы.</li><li>Если контрпример не находится, не делай вывод, что условие избыточно: возможно, нужен более точный поиск или доказательство.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Утверждение: «Если четырёхугольник — квадрат, то его диагонали равны». Уберём условие о прямых углах, оставив только равенство всех сторон: получим ромб, у которого диагонали в общем случае не равны. Например, ромб с углом 60° имеет разные диагонали. Значит, одного равенства сторон недостаточно для вывода о равенстве диагоналей.</p></div><h2>4. Контрольный список</h2><ul><li>Условие изменяется явно и только в одном месте.</li><li>Пример действительно удовлетворяет оставшимся гипотезам.</li><li>Заключение в примере нарушено.</li><li>Из контрпримера сделан вывод только о необходимости убранного условия, а не о ложности исходной теоремы.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Предъявить рисунок, который лишь кажется контрпримером.</li><li>Нарушить сразу все условия и не понять, что именно существенно.</li><li>Считать один контрпример доказательством исходной теоремы.</li><li>Объявлять условие избыточным, потому что контрпример не удалось найти.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что показывает контрпример к утверждению без одного из условий?",["Что исходная теорема обязательно неверна.", "Что упрощённая формулировка без этого условия может быть неверной.", "Что любое условие можно убрать.", "Что рисунок важнее доказательства."],1,"Верно: контрпример показывает, что убранная гипотеза может быть существенной.","Чтобы опровергнуть универсальное утверждение, достаточно одного объекта, для которого все предпосылки выполнены, а заключение — нет.","Навык поиска контрпримеров учит не принимать теоремы на веру и понимать точную роль каждого предположения.");
add("m7","Lean 4: установка, проект, файл и Infoview","Как запустить отдельную среду формальной проверки и отличить её от GeoProof.","<h2>1. Что делает этот инструмент или метод</h2><p>Lean 4 — самостоятельный язык программирования и интерактивный помощник для формальных доказательств. Для работы обычно используют VS Code с официальным расширением Lean 4: оно сопровождает настройку среды, показывает ошибки, типы и текущие цели в панели Infoview. Система версий elan устанавливает нужный Lean toolchain, а Lake управляет проектом и его сборкой. Важно: это отдельный инструмент. Текущий GeoProof не запускает Lean внутри браузерного редактора и не экспортирует автоматически свои доказательства в ядро Lean.</p><h2>2. Рабочая последовательность</h2><ol><li>Установи VS Code, затем открой каталог расширений и найди официальное расширение Lean 4 от leanprover.</li><li>После установки открой руководство настройки расширения (Setup Guide) и выполни шаги для своей операционной системы. Не копируй случайные старые инструкции из блогов, если расширение предлагает актуальный путь.</li><li>Создай самостоятельный Lean-проект через команду расширения Lean 4: Project: Create Standalone Project. Для проекта с Mathlib выбери шаблон, который включает Mathlib.</li><li>Открой именно папку проекта целиком, а не отдельный файл вне проекта. Убедись, что присутствуют файл `lakefile.lean` или `lakefile.toml` и файл `lean-toolchain`.</li><li>Создай или открой файл `.lean`, введи команду `#eval 1 + 1`. Проверь результат в Infoview.</li><li>Введи `#check Nat` и `#check Nat.add`. Перемещай курсор по командам и изучай сообщения Infoview.</li><li>В терминале проекта выполни `lake build`, если проект создан и зависимости загружены. При первой сборке могут потребоваться загрузка toolchain и библиотек.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p>Минимальная проверка файла:</p><pre><code>#eval 1 + 1\n#check Nat\n#check Nat.add</code></pre><p><code>#eval</code> вычисляет выражение. <code>#check</code> сообщает тип имени или выражения. Это диагностические команды, не доказательства теорем.</p><p>Официальная последовательность установки: <a href=\"https://lean-lang.org/getting-started/\" target=\"_blank\" rel=\"noopener\">Getting Started на lean-lang.org</a>; обзор расширения: <a href=\"https://marketplace.visualstudio.com/items?itemName=leanprover.lean4\" target=\"_blank\" rel=\"noopener\">Lean 4 для VS Code</a>.</p></div><h2>4. Контрольный список</h2><ul><li>Lean отвечает на `#eval` и `#check`.</li><li>Файл находится внутри папки проекта.</li><li>Infoview показывает сообщения и состояние цели.</li><li>Понимаешь назначение elan, Lean и Lake.</li><li>Понимаешь, что это не встроенная часть GeoProof.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Открывать одиночный `.lean` файл из случайной папки без toolchain.</li><li>Путать команду `#eval` с формальным доказательством.</li><li>Считать, что Mathlib встроен в любой новый проект.</li><li>Предполагать, что текущая версия GeoProof автоматически передаёт в Lean формулы.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какую роль играет Lake в проекте Lean?",["Он рисует геометрические чертежи.", "Он управляет проектом, зависимостями и сборкой Lean-пакета.", "Он заменяет математическое доказательство.", "Он служит хранилищем локального прогресса GeoProof."],1,"Верно: Lake — инструмент управления сборкой и зависимостями Lean-проекта.","Lean проверяет термы и команды, elan управляет версиями компилятора, а Lake отвечает за пакет проекта и его сборку.","Перед изучением тактик сначала добейся того, чтобы минимальный проект работал и Infoview показывал результат. Это избавит от путаницы между ошибкой установки и ошибкой доказательства.");
add("m7","Lean: типы, Prop, определения и команды #check / #eval","Научиться читать сообщения Lean и понимать, что именно является выражением, типом и утверждением.","<h2>1. Что делает этот инструмент или метод</h2><p>Lean — зависимо типизированный язык. Каждое корректное выражение имеет тип. Тип `Prop` содержит логические утверждения, а доказательство такого утверждения — терм этого типа. Тип `Nat` содержит натуральные числа. Команда `#check` показывает тип, `#eval` вычисляет исполнимое выражение, `def` задаёт определение, а `theorem` объявляет утверждение, для которого требуется предоставить доказательство.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай файл Lean и начни с `#check 7`. Прочитай, какой тип назначен числу.</li><li>Введи `#check Nat` и `#check True`. Заметь, что `Nat` — тип натуральных чисел, а `True` — логическое утверждение.</li><li>Выполни `#eval 3 + 4`. Это вычисление.</li><li>Объяви `def double (n : Nat) : Nat := n + n`. Затем проверь `#check double` и вычисли `#eval double 5`.</li><li>Объяви `def Positive (n : Nat) : Prop := n > 0`. Проверь тип `Positive`.</li><li>Сравни определение свойства и доказательство: `theorem seven_pos : 7 > 0 := by decide`. Здесь Lean не вычисляет результат как обычное число, а проверяет предоставленный терм доказательства.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>#eval 3 + 4\n#check Nat\n#check True\n\ndef double (n : Nat) : Nat := n + n\n#eval double 5\n\ntheorem seven_pos : 7 > 0 := by\n  decide</code></pre><p>Различай три роли: выражение <code>3+4</code>, тип <code>Nat</code> и утверждение <code>7&gt;0</code> типа <code>Prop</code>. Доказательство <code>seven_pos</code> — терм, который имеет требуемый тип.</p></div><h2>4. Контрольный список</h2><ul><li>Можешь прочитать тип простого выражения.</li><li>Различаешь вычисление и доказательство.</li><li>Понимаешь, что `Prop` — тип логических утверждений.</li><li>Создал определение и доказал простое числовое утверждение.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Считать, что `#eval` доказывает математическую теорему.</li><li>Путать имя определения с его значением.</li><li>Думать, что утверждение типа Prop автоматически истинно.</li><li>Игнорировать типы аргументов в объявлении функции.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что сообщает `#check Nat.add`?",["Выполняет сложение двух конкретных чисел.", "Показывает тип и сигнатуру операции сложения натуральных чисел.", "Доказывает коммутативность сложения.", "Создаёт новый проект."],1,"Верно: `#check` исследует тип имени или выражения, а не доказывает теорему.","В Lean тип — часть смысла каждого выражения. Команды проверки помогают увидеть этот контракт и выяснить, какие аргументы ожидает операция.","Привыкай читать типы прежде, чем писать тактики. Большинство первых затруднений Lean связаны с тем, что пользователь не понял, какой именно тип должен построить.");
add("m7","Lean: доказательство через exact, intro и apply","Первые тактики и переход от формулы к состоянию цели.","<h2>1. Что делает этот инструмент или метод</h2><p>В интерактивном доказательстве Lean показывает текущую цель — утверждение, которое требуется доказать. `exact h` завершает её термом h подходящего типа. `intro h` вводит предпосылку из цели-импликации или квантора всеобщности. `apply f` пытается применить утверждение, заключение которого совпадает с целью; его предпосылки становятся новыми подцелями. Тактики не являются магическими словами: каждая меняет состояние доказательства по определённому правилу.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой новый `.lean` файл. Объяви theorem для простой импликации `P → P`.</li><li>Начни доказательство с `by`. Посмотри на Infoview: цель содержит предположение P →? Нет, в исходной цели есть импликация, поэтому нужно ввести её предпосылку.</li><li>Напиши `intro h`. Проверь, что цель изменилась с `P → P` на `P`, а в контексте появился `h : P`.</li><li>Напиши `exact h`. Цель должна закрыться, потому что h имеет ровно требуемый тип.</li><li>Теперь попробуй теорему с `P → Q` и предположением `P`. Примени `apply hPQ`, а затем закрой оставшуюся цель `P` через `exact hP`.</li><li>Сравни `apply` и `exact`: первый строит подцели из предпосылок правила, второй предоставляет готовое доказательство текущей цели.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>example (P : Prop) : P → P := by\n  intro h\n  exact h\n\nexample (P Q : Prop) (hP : P) (hPQ : P → Q) : Q := by\n  apply hPQ\n  exact hP</code></pre><p>Во втором примере `apply hPQ` превращает цель Q в подцель P. Затем `hP` закрывает эту подцель.</p></div><h2>4. Контрольный список</h2><ul><li>Понимаешь состояние цели после intro.</li><li>Можешь объяснить тип гипотезы h.</li><li>Понимаешь, почему exact закрывает цель.</li><li>Можешь предсказать подцель после apply.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Писать `exact h` до того, как проверен тип h.</li><li>Путать цель и гипотезу в контексте.</li><li>Использовать apply, не проверив, совпадает ли заключение правила с целью.</li><li>Пытаться решить новую подцель, не посмотрев на Infoview.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что делает тактика `intro h` для цели `P → Q`?",["Доказывает Q автоматически.", "Вводит P как гипотезу h и меняет цель на Q.", "Удаляет все предположения.", "Подменяет Q на P."],1,"Верно: intro раскрывает условное утверждение и переносит его предпосылку в контекст.","Импликация читается как условное доказательство: предположи P, затем выведи Q. Тактика intro формализует первый шаг.","Наблюдай Infoview после каждой тактики. Успешная формализация начинается с умения предсказывать изменение цели и объяснять, почему тактика допустима.");
add("m7","Lean: конъюнкция, дизъюнкция, случаи и противоречие","Построить доказательства логических связок и увидеть связь с натуральным выводом.","<h2>1. Что делает этот инструмент или метод</h2><p>Доказательство конъюнкции P ∧ Q требует двух частей; `constructor` создаёт обе подцели. Чтобы использовать уже имеющуюся конъюнкцию, можно разобрать её через `rcases` или `cases`. Для дизъюнкции `Or.inl` и `Or.inr` вводят левую или правую часть; `cases` по дизъюнкции создаёт две ветви. Для противоречия Lean использует принцип `False.elim` и подходящие тактики. Эти действия соответствуют знакомым правилам натурального вывода.</p><h2>2. Рабочая последовательность</h2><ol><li>Начни с теоремы: из hP:P и hQ:Q нужно получить P ∧ Q.</li><li>Напиши `constructor`. В Infoview появятся две подцели: P и Q.</li><li>Закрой первую `exact hP`, вторую `exact hQ`.</li><li>Теперь используй `h : P ∧ Q`. Напиши `rcases h with ⟨hp, hq⟩`. Проверь, что появились две гипотезы.</li><li>Для дизъюнкции возьми `h : P ∨ Q` и используй `rcases h with hp | hq`. Lean создаст два случая; в каждом можно опираться на соответствующую гипотезу.</li><li>Не путай создание дизъюнкции из известной ветви с устранением дизъюнкции через разбор обоих случаев.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>example (P Q : Prop) (hP : P) (hQ : Q) : P ∧ Q := by\n  constructor\n  · exact hP\n  · exact hQ\n\nexample (P Q R : Prop) (h : P ∧ Q) : Q ∧ P := by\n  rcases h with ⟨hp, hq⟩\n  constructor\n  · exact hq\n  · exact hp\n\nexample (P Q R : Prop) (h : P ∨ Q)\n    (hp : P → R) (hq : Q → R) : R := by\n  rcases h with hP | hQ\n  · exact hp hP\n  · exact hq hQ</code></pre><p>Каждая точка с маркером `·` — отдельная цель/ветвь. Текст гипотез в каждой ветви различается.</p></div><h2>4. Контрольный список</h2><ul><li>Понимаешь, почему конъюнкция создаёт две цели.</li><li>Можешь разобрать пару из P∧Q.</li><li>Можешь разобрать P∨Q на два случая.</li><li>В каждой ветви используешь только доступную гипотезу.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Использовать только одну половину конъюнкции, когда нужно доказать обе.</li><li>Считать, что из P∨Q можно одновременно получить P и Q.</li><li>Закрыть обе ветви одним фактом, который доступен только в одной.</li><li>Путать `constructor` с `cases`.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что делает `cases h` или `rcases h with hp | hq`, если h : P ∨ Q?",["Утверждает сразу P и Q.", "Создаёт два случая: один с P, другой с Q.", "Удаляет дизъюнкцию без проверки.", "Вычисляет истинность P и Q по таблице истинности."],1,"Верно: разбор дизъюнкции формирует отдельные ветви, соответствующие двум возможностям.","Чтобы получить общее следствие из альтернатив, нужно показать его в каждой ветви. Это тот же логический принцип, что и ∨E в GeoProof.","Изучи соответствие `constructor`/введение конъюнкции и `cases`/устранение связки. Затем решай одинаковые логические задачи в GeoProof и Lean, сравнивая ручные ссылки и формальные цели.");
add("m7","Lean: равенство, переписывание и упрощение","Использовать гипотезы о равенстве в доказательстве, применять rw и simp осмысленно.","<h2>1. Что делает этот инструмент или метод</h2><p>Равенство в Lean — логическое отношение, для которого доступны рефлексивность, симметричность и транзитивность. Если гипотеза h говорит a=b, тактика `rw [h]` переписывает в цели вхождения a на b (или наоборот, если использовать обратную запись). `simp` применяет набор известных упрощающих равенств и правил. Она удобна, но важно понимать, какие выражения преобразуются и почему результат эквивалентен исходному.</p><h2>2. Рабочая последовательность</h2><ol><li>Создай пример, где известно `h : a = b`, а цель содержит выражение `a + 1 = b + 1`.</li><li>Примени `rw [h]`. Посмотри, что Lean заменил в левой части.</li><li>Если обе части теперь совпадают, закрой цель через `rfl`.</li><li>Попробуй доказать `n + 0 = n` с помощью `simp`.</li><li>Сравни результат `rw` и `simp`: первый выполняет выбранную перепись, второй запускает упрощение с набором подходящих правил.</li><li>Перед использованием тактики объясни, какое выражение должно измениться. Не используй `simp` как непонятную «кнопку доказать».</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>example (a b : Nat) (h : a = b) : a + 1 = b + 1 := by\n  rw [h]\n\nexample (n : Nat) : n + 0 = n := by\n  simp</code></pre><p>После <code>rw [h]</code> цель становится равенством одного и того же выражения, которое закрывается рефлексивностью. <code>simp</code> знает стандартное равенство <code>n + 0 = n</code>.</p></div><h2>4. Контрольный список</h2><ul><li>Можешь сказать, что именно переписывает rw.</li><li>Знаешь, в каком направлении действует равенство.</li><li>Понимаешь, что simp использует набор упрощающих правил.</li><li>После каждой тактики смотришь на новую цель.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ожидать, что rw докажет любое утверждение, содержащее равенство.</li><li>Путать замену по h и обратную замену.</li><li>Использовать simp, не выяснив, какие правила сработали.</li><li>Путать равенство выражений с численным совпадением в одном примере.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Чем `rw [h]` отличается от `simp`?",["rw всегда вычисляет числовое значение, а simp строит график.", "rw выполняет указанную перепись по равенству, а simp запускает набор упрощающих правил.", "Обе тактики удаляют гипотезы.", "simp применима только к формулам с кванторами."],1,"Верно: rw — направленная перепись, simp — система упрощения по набору лемм.","Управляемая перепись полезна, когда ты точно знаешь нужное преобразование. Упрощение удобно, когда известны стандартные нормализующие правила.","Научись предсказывать новую форму цели. Если не можешь объяснить, что сделала тактика, разверни шаг и исследуй состояние Infoview.");
