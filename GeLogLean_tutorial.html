add("m7","Lean: кванторы и существование на простых примерах","Практически применять всеобщность, строить свидетеля существования и разбирать экзистенциальную гипотезу.","<h2>1. Что делает этот инструмент или метод</h2><p>Утверждение `∀ n, P n` требует доказательства P для произвольного n. После `intro n` переменная n становится доступной в контексте. Чтобы доказать `∃ n, P n`, нужно предъявить свидетель и доказательство его свойства; синтаксис `⟨n, hn⟩` упаковывает оба компонента. При разборе существования `rcases h with ⟨n, hn⟩` раскрывает неизвестного свидетеля и его свойство внутри текущего доказательства.</p><h2>2. Рабочая последовательность</h2><ol><li>Докажи всеобщность `∀ n : Nat, n = n`: введи n с помощью `intro n`, затем используй `rfl`.</li><li>Рассмотри `h : ∀ n : Nat, P n`. Чтобы получить P 3, примени h к 3 через `exact h 3`.</li><li>Для экзистенциального утверждения выбери конкретный свидетель, например 5, и докажи его свойство.</li><li>Запиши свидетель и доказательство в форме `⟨5, h5⟩`.</li><li>Разбери имеющуюся гипотезу `∃ n, n = 0` через `rcases`. Отдельно проговори, что n — локальное имя свидетеля, а не универсальная переменная.</li><li>Проверь, не используешь ли свойства конкретного свидетеля за пределами доказательства, которое их допускает.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>example : ∀ n : Nat, n = n := by\n  intro n\n  rfl\n\nexample (P : Nat → Prop) (h : ∀ n, P n) : P 3 := by\n  exact h 3\n\nexample (P : Nat → Prop) (h5 : P 5) : ∃ n, P n := by\n  exact ⟨5, h5⟩\n\nexample (h : ∃ n : Nat, n = 0) : True := by\n  rcases h with ⟨n, hn⟩\n  trivial</code></pre><p>Первый пример показывает, что произвольный n вводится и доказывается. Третий явно предоставляет существующий объект и свидетельство его свойства.</p></div><h2>4. Контрольный список</h2><ul><li>Можешь раскрыть ∀ через intro.</li><li>Можешь использовать универсальную гипотезу с конкретным аргументом.</li><li>Для ∃ предъявляешь и объект, и доказательство его свойства.</li><li>Различаешь локального свидетеля и произвольный объект.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Пытаться вывести ∀ из одного частного примера.</li><li>Записывать существование без свидетеля и его свойства.</li><li>Использовать локальное имя свидетеля за пределами его области.</li><li>Путать `intro` и `rcases`: они работают с разными структурами.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что необходимо предоставить, чтобы доказать `∃ n, P n`?",["Только имя переменной n.", "Конкретный свидетель n и доказательство P n.", "Утверждение P для всех n.", "Таблицу истинности."],1,"Верно: существование — это свидетель плюс доказательство требуемого свойства.","Смысл ∃ отличается от ∀: достаточно одного конкретного объекта, но нужно показать, что он действительно подходит.","Проводя формализацию, спрашивай: мне нужно доказать свойство для каждого объекта или предъявить хотя бы один объект? От этого зависит тактика доказательства.");
add("m7","Lean: структура проекта, import Mathlib и работа с библиотекой","Понять, зачем нужны импорты, зависимости, toolchain и воспроизводимая сборка.","<h2>1. Что делает этот инструмент или метод</h2><p>Lean-файл может использовать только те определения и теоремы, которые доступны в его окружении. `import Mathlib` подключает библиотеку Mathlib, если проект настроен с этой зависимостью. Lake хранит конфигурацию пакета и его зависимости, а файл `lean-toolchain` фиксирует версию Lean. Поэтому воспроизводимость требует сохранять не только текст доказательства, но и проектную конфигурацию. Не добавляй Mathlib в одиночный файл без соответствующей настройки проекта.</p><h2>2. Рабочая последовательность</h2><ol><li>Открой папку проекта и изучи `lakefile.lean` или `lakefile.toml`. Найди объявленные зависимости.</li><li>Открой `lean-toolchain` и прочитай закреплённую версию. Не меняй её без причины.</li><li>Если Mathlib подключён, добавь в начало отдельного файла `import Mathlib`.</li><li>Проверь простое утверждение с одной из доступных тактик. Если команда не найдена, проверь, подключён ли Mathlib и открыт ли проект как проект.</li><li>Запусти `lake build`, чтобы проверить сборку всего пакета, а не только фрагмент открытого файла.</li><li>Сохрани конфигурацию вместе с исходниками. При передаче проекта другому человеку сообщай, как восстановить зависимости и запустить сборку.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>import Mathlib\n\nexample (a b : ℤ) : a + b = b + a := by\n  ring</code></pre><p>Этот файл предполагает проект, в котором доступен Mathlib и его тактики. Если Mathlib не подключён, ошибка импорта или неизвестной тактики говорит о настройке проекта, а не о ложности равенства.</p></div><h2>4. Контрольный список</h2><ul><li>Знаешь, что делает import.</li><li>Проверил, что Mathlib действительно является зависимостью.</li><li>Не меняешь toolchain без необходимости.</li><li>Можешь выполнить сборку проекта через Lake.</li><li>Понимаешь связь конфигурации с воспроизводимостью.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Считать, что каждый Lean-файл автоматически импортирует Mathlib.</li><li>Копировать lakefile из другой версии Lean.</li><li>Решать ошибку импорта изменением математической формулы.</li><li>Отправлять один файл без указания зависимостей и версии среды.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Зачем проекту файл lean-toolchain?",["Он хранит список геометрических точек.", "Он фиксирует версию Lean toolchain для проекта.", "Он содержит доказательство главной теоремы.", "Он заменяет Lake."],1,"Верно: зафиксированная версия позволяет воспроизводить среду проверки.","Формальные доказательства чувствительны к версиям библиотек и инструментов. Управление версиями — часть математической воспроизводимости.","Проверяемая формализация должна быть не только корректна сегодня, но и воспроизводима в зафиксированной среде завтра.");
add("m8","Перенос доказательства из GeoProof в Lean: не копировать, а формализовать","Разделить математическую постановку, схему доказательства и синтаксис конкретного помощника.","<h2>1. Что делает этот инструмент или метод</h2><p>GeoProof и Lean представляют доказательства по-разному. GeoProof хранит шаги и их ссылки в своей модели. Lean требует выражение с точным типом и терм-доказательство, проверяемое ядром. Перевод поэтому нельзя свести к копированию текста или экспорту дерева AST: сначала нужно определить область объектов, предикаты и точные предпосылки; затем представить их типами/определениями Lean; затем собрать доказательство из проверяемых термов. В текущей версии GeoProof этот перевод выполняется вручную — автоматической интеграции нет.</p><h2>2. Рабочая последовательность</h2><ol><li>Возьми простую задачу с GeoProof: даны P → Q и P, требуется Q.</li><li>Запиши её абстрактно, не используя геометрические имена: гипотезы hPQ : P → Q, hP : P; цель Q.</li><li>Перенеси структуру в Lean, где P и Q объявлены как параметры типа Prop.</li><li>Построй доказательство термом `hPQ hP` или тактиками `apply hPQ; exact hP`.</li><li>Сравни: в GeoProof ты выбирал правило modus ponens и ссылки; в Lean тот же переход реализуется термом применения функции к доказательству её предпосылки.</li><li>Для геометрической задачи отдельно задай типы точек, определение принадлежности, равенства отрезков и необходимые аксиомы. Не объявляй нужное заключение аксиомой только ради завершения компиляции.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><pre><code>-- Абстрактная схема modus ponens\nexample (P Q : Prop) (hPQ : P → Q) (hP : P) : Q := by\n  exact hPQ hP</code></pre><p>Соответствие: шаг GeoProof «Q, основание modus ponens, ссылки на P→Q и P» ↔ Lean-терм `hPQ hP`. Но для геометрии сперва потребуется формальная модель: что такое точка, отрезок, отношение равенства и какие свойства уже доказаны.</p></div><h2>4. Контрольный список</h2><ul><li>Предпосылки и цель явно записаны в обеих системах.</li><li>Понимаешь, что в Lean нужны типы и формальные определения.</li><li>Не выдаёшь свободный текст GeoProof за формальный терм.</li><li>Не превращаешь недоказанное утверждение в аксиому без осознанного изменения теории.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Ожидать, что формула GeoProof автоматически компилируется в Lean.</li><li>Заменять отсутствующее доказательство объявлением новой аксиомы.</li><li>Не определять область объектов и предикатов.</li><li>Путать проверку синтаксиса и типов с доказательством геометрической истинности исходной модели.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Что нужно сделать при переносе доказательства из GeoProof в Lean?",["Скопировать текст шага без изменений.", "Определить формальные типы, утверждения и предпосылки, а затем построить терм-доказательство Lean.", "Удалить все гипотезы и оставить заключение.", "Считать граф ссылок готовым доказательством Lean."],1,"Верно: перевод требует математической формализации понятий, а не простой замены синтаксиса.","Lean проверяет термы относительно точных типов и аксиом. Если исходная геометрическая семантика не задана, движку нечего интерпретировать.","Практикуй сначала абстрактную логику, затем простые геометрические структуры и только после этого сложные теоремы. Так ты не перепутаешь незаданную математику с ошибками синтаксиса.");
add("m8","Итоговая лабораторная работа: от геометрической гипотезы к независимой проверке","Самостоятельно пройти полный маршрут: постановка задачи, чертёж, доказательство, формализация и аудит.","<h2>1. Что делает этот инструмент или метод</h2><p>В финальном проекте нужно показать не только знание кнопок, но и умение объяснять структуру математической задачи. Сначала сформулируй точные гипотезы и цель. Затем построй модель, отметь зависимости, составь план доказательства и реализуй его в GeoProof. После этого выбери один небольшой логический фрагмент и формализуй его в Lean. В отчёте раздели то, что проверила программа, и то, что ты обосновал математически.</p><h2>2. Рабочая последовательность</h2><ol><li>Выбери задачу из базовой геометрии, например про середину стороны, равенство треугольников или углы при параллельных прямых.</li><li>Запиши условие и цель так, чтобы ни одно требуемое заключение не было скрыто среди исходных данных.</li><li>Построй фигуру в GeoProof. Для каждого зависимого объекта запиши его родительские элементы и ограничение.</li><li>Составь бумажный план: какие определения и теоремы нужны; выпиши все их предпосылки.</li><li>Оформи доказательство в GeoProof по шагам. Используй типизированные утверждения там, где они подходят; каждому выводу назначь основание и ссылки.</li><li>Проверь контексты, ссылки, статусы аудита и граф доказательства. Объясни любой статус review и математические предпосылки, которые не проверяются автоматически.</li><li>Сохрани проект. В независимом файле Lean формализуй хотя бы один логический переход или простую лемму, использованную в доказательстве.</li><li>Напиши краткий отчёт: задача, определения, ключевая идея, доказательство, что проверяет GeoProof, что проверяет Lean, какие предпосылки остались на доверии.</li></ol><h2>3. Разобранный пример</h2><div class=\"example\"><div class=\"box-label\">Выполни и объясни</div><p><b>Минимальный критерий завершения.</b> Другой студент должен открыть твой проект, увидеть условие, цель и последовательность выводов, понять каждое основание, воспроизвести чертёж, а затем запустить Lean-файл и получить успешную проверку выбранной леммы. Нельзя писать, что Lean подтвердил всю геометрию, если формализована только одна логическая часть.</p></div><h2>4. Контрольный список</h2><ul><li>В проекте ясно разделены посылки и цель.</li><li>Чертёж устойчив к ожидаемым изменениям и его зависимости понятны.</li><li>Каждый шаг доказательства имеет содержательное объяснение.</li><li>Проверены ссылки, области действия и статусы.</li><li>Lean-файл самодостаточен для своей маленькой формализованной леммы.</li><li>Границы каждой автоматической проверки явно указаны.</li></ul><h2>5. Типичные ошибки</h2><ul><li>Вносить заключение в условия.</li><li>Использовать картинку в качестве доказательства.</li><li>Считать структурный статус GeoProof полным сертификатом.</li><li>Объявлять недоказанную геометрию аксиомой без раскрытия доверенного допущения.</li><li>Писать в отчёте, что Lean проверил больше, чем реально формализовано.</li></ul><div class=\"proofbox\"><div class=\"box-label\">Критерий освоения</div>Повтори пример без подсказки. Затем измени один исходный объект или условие и объясни, что должно измениться и почему. Если результат непонятен, вернись к определению и проверь зависимости.</div>","Какой результат соответствует полноценной итоговой работе?",["Только красивый чертёж.", "Проект с условиями, объяснённым доказательством, проверенными зависимостями и честно обозначенным объёмом Lean-формализации.", "Список теорем, которые могли бы пригодиться.", "Скриншот с зелёным индикатором проверки."],1,"Верно: итоговая работа должна быть воспроизводимой и честно описывать границы доверия.","Формальная проверка полезна только в пределах явно описанной модели и доказательства. Честная граница доверия — часть математической строгости.","Считай итоговый проект успешным, когда можешь не только показать результат, но и объяснить, почему каждый его компонент корректен и что именно подтверждено инструментами.");

lessons.sort((a,b)=>modules.findIndex(m=>m.id===a.module)-modules.findIndex(m=>m.id===b.module));
const KEY='geoproof-geologlean-academic-v1';

let completed=new Set();

function renderNav(){
 const q=$('#search').value.trim().toLocaleLowerCase('ru');const nav=$('#courseNav');nav.innerHTML='';let shown=0;
 modules.forEach((m,idx)=>{
  const list=moduleLessons(m.id);const visible=list.filter(l=>!q||`${l.title} ${l.lead} ${l.body.replace(/<[^>]*>/g,' ')}`.toLocaleLowerCase('ru').includes(q));
  if(q&&!visible.length)return;shown+=visible.length;
  const section=document.createElement('section');section.className='module';if(q) section.classList.add('open');
  const button=document.createElement('button');button.className='module-button';button.type='button';button.innerHTML=`<span class="module-chevron">▾</span><span class="module-number">${String(idx+1).padStart(2,'0')}</span><span>${esc(m.title)}</span><span class="module-count">${list.filter(l=>completed.has(l.id)).length}/${list.length}</span>`;
  button.addEventListener('click',()=>section.classList.toggle('closed'));
  const items=document.createElement('div');items.className='lesson-list';
  visible.forEach(l=>{const b=document.createElement('button');b.type='button';b.className='lesson-link'+(completed.has(l.id)?' done':'')+(currentLesson===l.id?' active':'');b.textContent=l.title;b.addEventListener('click',()=>openLesson(l.id));items.appendChild(b)});
  section.append(button,items);nav.appendChild(section);
 });
 if(q&&!shown){nav.innerHTML='<p class="search-result">Ничего не найдено. Попробуй другой термин.</p>'}

function overview(){
 currentLesson=null;renderNav();
 const done=completed.size,pct=Math.round(done/lessons.length*100);
 $('#content').innerHTML=`<div class="crumb">Учебная программа · GeoProof</div>
 <section class="overview"><h1>Полный учебный маршрут по GeoProof, геометрии и формальным доказательствам</h1><p>Последовательный курс от математического языка и евклидовой геометрии до работы с инструментами GeoProof, построения доказательств и самостоятельной формализации в Lean 4. Материал рассчитан на начинающего: сначала объясняются понятия и связи, затем показывается алгоритм действий и разбирается пример.</p><p>В расширенных уроках есть пошаговые инструкции для каждого инструмента, контрольные списки, типичные ошибки и практические задачи. Цель — научиться самостоятельно воспроизводить и объяснять результат, а не просто запомнить последовательность щелчков.</p><div class="overview-actions"><button class="primary" id="continueBtn">${done?'Продолжить обучение':'Начать с первого урока'}</button><button class="secondary" id="glossaryInline">Открыть словарь</button><button class="secondary" id="connectionsInline">Карта связей</button></div></section>
 <div class="stats"><div class="stat"><b>${lessons.length}</b><span>подробных уроков</span></div><div class="stat"><b>${modules.length}</b><span>связанных направлений</span></div><div class="stat"><b>${pct}%</b><span>прогресс прохождения</span></div></div>
 <h2 style="font:500 22px Georgia,serif;margin:25px 0 12px">Программа курса</h2><div class="module-grid">${modules.map((m,i)=>`<button class="module-card" data-module="${m.id}"><b>${i+1}. ${esc(m.title)}</b><p>${esc(m.desc)}</p><small>${moduleLessons(m.id).length} уроков · ${moduleLessons(m.id).filter(l=>completed.has(l.id)).length} пройдено</small></button>`).join('')}</div>
 <div class="insight" style="margin-top:23px"><div class="box-label">Как использовать курс</div>Работай по циклу: прочитай объяснение → выполни шаги в GeoProof или Lean → сравни с разобранным примером → пройди самопроверку → запиши выводы и вопросы. Считай инструмент освоенным, когда можешь объяснить, какие объекты и зависимости он создаёт, как изменится модель при перемещении и как диагностировать ошибку. Отметки и заметки сохраняются локально в этом браузере.</div>
 <div class="warning"><div class="box-label">Важное ограничение GeoProof</div>Программа проверяет геометрическую модель и отдельные схемы логического вывода, но большинство геометрических теорем каталога требует содержательной проверки. В текущей версии репозитория нет исполняемой интеграции с Lean 4. Раздел Lean является отдельным учебным курсом, а не описанием уже подключённой функции.</div>
 <p class="footer-note">Самостоятельный офлайн-учебник. Для углубления используй первоисточники и официальную документацию, ссылки приведены в последнем модуле.</p>`;
 $('#continueBtn').addEventListener('click',()=>openLesson(lessons.find(l=>!completed.has(l.id))?.id||lessons[0].id));
 $('#glossaryInline').addEventListener('click',renderGlossary);
 $('#connectionsInline').addEventListener('click',renderConnections);
 document.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>openLesson(moduleLessons(b.dataset.module)[0].id)));
}
function openLesson(id){
 const lesson=lessonById(id);if(!lesson){overview();return}currentLesson=id;renderNav();const m=moduleOf(lesson.module),idx=lessons.indexOf(lesson),within=moduleLessons(m.id),local=within.indexOf(lesson),prev=lessons[idx-1],next=lessons[idx+1];
 $('#content').innerHTML=`<div class="crumb">${esc(m.title)} · Урок ${local+1} из ${within.length}</div><h1 class="page-title">${esc(lesson.title)}</h1><div class="lesson-meta"><span class="pill">${esc(m.title)}</span><span class="pill">Урок ${idx+1} / ${lessons.length}</span><span class="pill">Около 18 минут</span>${completed.has(id)?'<span class="pill" style="color:var(--green)">Пройдено</span>':''}</div><p class="lead">${esc(lesson.lead)}</p><article class="lesson-body">${lesson.body}</article>
 <section class="notes-panel"><h3>Мои заметки к уроку</h3><p>Запиши определение своими словами, пример, вопросы и то, что нужно повторить. Заметки автоматически сохраняются в этом браузере.</p><textarea id="lessonNotes" placeholder="Что я понял? Какой пример могу воспроизвести без подсказки? Где возникла ошибка?">${esc(lessonNotes[id]||'')}</textarea><div class="notes-status" id="notesStatus">Локальные заметки к этому уроку</div></section>
 <section class="exercise"><h3>Практика и самопроверка</h3><p class="question">${esc(lesson.exercise.q)}</p><p class="search-result">Для дополнительного разбора: ${esc(lesson.exercise.reveal)}</p><div class="options" id="options">${lesson.exercise.choices.map((c,i)=>`<button type="button" class="option" data-choice="${i}"><span>${String.fromCharCode(65+i)}.</span><span>${esc(c)}</span></button>`).join('')}</div><div class="feedback" id="feedback" hidden></div><button class="secondary" id="showSolution" style="margin-top:12px">Показать разбор</button><div class="solution" id="solution" hidden><div class="insight"><div class="box-label">Разбор</div>${esc(lesson.solution)}</div></div></section>
 <div class="lesson-footer"><button class="secondary" id="markDone">${completed.has(id)?'Снять отметку':'Отметить урок пройденным'}</button><span class="spacer"></span><button class="secondary" id="backOverview">К программе</button></div>
 <div class="nav-pair"><button class="secondary" id="prevLesson" ${prev?'':'disabled'}>${prev?'← '+esc(prev.title):'Начало курса'}</button><button class="secondary" id="nextLesson" ${next?'':'disabled'}>${next?esc(next.title)+' →':'Конец курса'}</button></div>
 <p class="footer-note">При переносе доказательства в GeoProof всегда проверяй, какие основания действительно аудируются автоматически, а какие требуют математического обоснования.</p>`;
 document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{
  const choice=Number(b.dataset.choice),correct=choice===lesson.exercise.answer;document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;const n=Number(x.dataset.choice);if(n===lesson.exercise.answer)x.classList.add('correct');else if(n===choice)x.classList.add('wrong')});
  const fb=$('#feedback');fb.hidden=false;fb.textContent=(correct?'Верно. ':'Не совсем. ')+lesson.exercise.feedback;
 }));
 $('#showSolution').addEventListener('click',()=>{$('#solution').hidden=!$('#solution').hidden;$('#showSolution').textContent=$('#solution').hidden?'Показать разбор':'Скрыть разбор'});
 $('#lessonNotes').addEventListener('input',e=>{lessonNotes[id]=e.target.value;try{localStorage.setItem(NOTES_KEY,JSON.stringify(lessonNotes));$('#notesStatus').textContent='Заметки сохранены в этом браузере'}catch(_){$('#notesStatus').textContent='Не удалось сохранить заметки: проверь настройки хранилища браузера'}});
 $('#markDone').addEventListener('click',()=>{if(completed.has(id))completed.delete(id);else completed.add(id);save();openLesson(id)});

 $('#prevLesson').addEventListener('click',()=>{if(prev)openLesson(prev.id)});

 history.replaceState(null,'','#/lesson/'+id);window.scrollTo({top:0,behavior:'auto'});
}

 $('#content').innerHTML=`<div class="crumb">Справочный раздел</div><h1 class="page-title">Связи дисциплин</h1><p class="lead">Курс построен не как набор изолированных тем. Каждая область использует понятия соседних: логика задаёт правила вывода, геометрия — содержательные отношения, теория типов — машинное представление доказательств.</p><div class="table-wrap"><table><thead><tr><th>Направление</th><th>Использует</th><th>Даёт другим областям</th></tr></thead><tbody><tr><td>Основания и семантика</td><td>Теория множеств, логический язык</td><td>Модель и смысл формул</td></tr><tr><td>Логика</td><td>Формальный язык, предположения</td><td>Схемы вывода и снятие гипотез</td></tr><tr><td>Геометрия</td><td>Аксиомы, отношения, конгруэнтность</td><td>Содержательные теоремы</td></tr><tr><td>Методы доказательства</td><td>Логика, определения, теоремы</td><td>Стратегии построения вывода</td></tr><tr><td>GeoProof</td><td>Геометрия, AST и логические правила</td><td>Интерактивное моделирование и аудит ограниченных схем</td></tr><tr><td>Lean 4</td><td>Теория типов, логика, определения</td><td>Проверка формальных термов</td></tr></tbody></table></div><div class="insight"><div class="box-label">Пример связи</div>Теорема о сумме углов треугольника использует понятия угла и треугольника, свойства параллельных прямых и евклидову аксиому параллельных. В GeoProof её можно исследовать на чертеже, а в Lean — формализовать только после задания соответствующей геометрической структуры.</div><button class="secondary" id="connBack">Вернуться к программе</button>`;
